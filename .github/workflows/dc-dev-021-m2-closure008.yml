name: DC-DEV-021 M2 CLOSURE-008 lineage-level post-ingestive material-work

on:
  push:
    branches:
      - m2/dc-dev-021-m2-closure008-lineage-material-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure008:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=0dfd81fdd99cc9a0eb7562b1d8705190c37d3a73
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefName,baseRefName
          python3 - "$start" <<'PY'
          import subprocess, sys
          start=sys.argv[1]
          allowed={
            '.agent/CURRENT.md','.agent/DIRECTIVES.md','.agent/LEARNINGS.md','.agent/OUTCOMES.md','.agent/RECORD.md','.agent/REPO_MAP.md',
            '.github/workflows/dc-dev-021-m2-closure008.yml',
            'digital-protocell/crates/regulatory-core/Cargo.toml',
            'digital-protocell/examples/dcdev021_m2_closure008.rs',
            'digital-protocell/examples/dcdev021_m2_closure008_impl.rs',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{start}..HEAD'],text=True).splitlines())
          unexpected={p for p in changed if p not in allowed and not p.startswith('digital-protocell/experiments/generated/dcdev021m2closure008/')}
          assert not unexpected, sorted(unexpected)
          forbidden_prefixes=(
            'digital-protocell/crates/chemistry-core/src/',
            'digital-protocell/crates/regulatory-core/src/',
            'digital-protocell/crates/phase1-certifier/src/',
            'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(p.startswith(forbidden_prefixes) for p in changed)
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and run CLOSURE-008 assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked -p regulatory-core --release --example dcdev021_m2_closure008
          cargo +1.89.0 run --locked -p regulatory-core --release --example dcdev021_m2_closure008 -- experiments/generated/dcdev021m2closure008
      - name: Validate compact CLOSURE-008 evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/generated/dcdev021m2closure008')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for item in manifest['files']:
              assert (root/item['file']).is_file(), item
          q=json.loads((root/'qualification.json').read_text())
          assert q['classification'] in {
              'M2_POST_INGESTIVE_MATERIAL_WORK_RESOURCE_CAUSAL_REPRODUCTION_QUALIFIED',
              'M2_POST_INGESTIVE_MATERIAL_WORK_LINEAGE_BENEFIT_REPRODUCTION_NOT_ESTABLISHED',
              'M2_POST_INGESTIVE_MATERIAL_WORK_LINEAGE_BENEFIT_INSUFFICIENT',
          }
          assert q['architect_acceptance']=='PENDING'
          assert q['autonomous_resource_acquisition']=='NOT_ESTABLISHED'
          for name in ('paired_arms.json','daughter_a_arms.json','daughter_b_arms.json'):
              arms=json.loads((root/name).read_text())
              assert set(arms) == {'MATERIAL_FEEDBACK','TRANSFER_DISABLED','ZERO_RESOURCE','NO_MATERIAL_FEEDBACK','MOTOR_OFF'}
              for value in arms.values():
                  assert value['classification_inputs']['invalid'] is False
                  ci=value['classification_inputs']
                  assert abs(ci['world_n_loss']-ci['delivered_n']) <= 1e-10
                  assert abs(ci['world_f_loss']-ci['delivered_f']) <= 1e-10
                  assert ci['a_to_w_residual'] <= 1e-9
          controls=json.loads((root/'controls.json').read_text())
          assert controls['zero_resource_delivery_zero'] is True
          definition=json.loads((root/'mechanism_reuse.json').read_text())
          assert definition['new_parameter'] is False
          assert definition['contact_signal'] is False
          assert definition['observer_ledger_as_behavior_input'] is False
          for p in root.glob('*.json'): json.loads(p.read_text())
          print('CLOSURE-008 evidence validation passed')
          PY
      - name: Validate governance and preservation
        run: |
          set -euo pipefail
          python3 scripts/validate_governance.py --mode ADOPTED
          git diff --check
      - name: Hash compact evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2closure008 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2closure008.sha256"
      - name: Upload CLOSURE-008 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-closure008-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2closure008/
            ${{ runner.temp }}/dcdev021m2closure008.sha256
