name: DC-DEV-020-M1 REPLAN-002-R5-R3 live-resource death qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002r5r3_v4_live_resource_irreversible_death.rs
      - name: Verify bounded R5-R3 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = 'd0a9601aed170c43a5c288c8300f3fe65e64237f'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md',
              '.github/workflows/dc-dev-020m1replan002r5r3.yml',
              'digital-protocell/Cargo.lock',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002r5r3_v4_live_resource_irreversible_death.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r5r3/dcdev020m1replan002r5r3_v4_live_resource_irreversible_death.md',
          }
          allowed |= {
              f'digital-protocell/experiments/generated/dcdev020m1replan002r5r3/{name}'
              for name in ('protocol.json', 'results.json', 'qualification.json',
                           'preservation.json', 'artifact_manifest.json')
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R5-R3 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R5R3_BOUNDED_DIFF_PASS')
          PY
      - name: V2 D-087 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r3/ci/v2_d087
      - name: V3 D-087 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r3/ci/v3_d087
      - name: V4 D-087 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r3/ci/v4_d087
      - name: R5-R3 live-resource qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R5R3_OUTPUT: experiments/generated/dcdev020m1replan002r5r3/ci
          DCDEV020M1REPLAN002R5R3_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r5r3-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r5r3_v4_live_resource_irreversible_death --release --quiet
      - name: Verify compact R5-R3 evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/generated/dcdev020m1replan002r5r3')
          ci = root / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json',
                   'preservation.json', 'artifact_manifest.json')
          for name in names:
              assert (ci / name).is_file(), f'missing {ci/name}'
          q = json.loads((ci / 'qualification.json').read_text())
          r = json.loads((ci / 'results.json').read_text())
          assert q['starting_head'] == 'd0a9601aed170c43a5c288c8300f3fe65e64237f'
          assert q['direct_internal_nf_insertion'] is False
          assert q['sealed_internal_delivery_used'] is False
          assert q['starvation_material_closure'] is True
          assert q['authoritative_stop'] is True
          assert q['s0_live_uptake'] is True
          assert q['s0_recovery'] is False
          assert q['old_r5_post_failure_states_used'] is False
          assert q['s2_resource_opportunity'] == 'NO_PHYSICAL_RESOURCE_CONTACT'
          assert q['classification'] == 'M1_V4_LIVE_RESOURCE_DEATH_QUALIFICATION_INVALID'
          assert r['starvation']['first_mechanics_false'] is not None
          assert r['s0']['resource']['classification'] == 'PHYSICAL_UPTAKE_OCCURRED'
          assert r['s1']['resource']['classification'] == 'NO_PHYSICAL_RESOURCE_CONTACT'
          assert r['s2']['resource']['classification'] == 'NO_PHYSICAL_RESOURCE_CONTACT'
          assert r['s2']['authoritative_stop_step'] == 1
          v2 = json.loads((ci / 'v2_d087/certification/report.json').read_text())
          v3 = json.loads((ci / 'v3_d087/certification/report.json').read_text())
          v4 = json.loads((ci / 'v4_d087/certification/report.json').read_text())
          assert [v2[f'gate{i}']['pass'] for i in range(8)] == [True] * 8
          assert [v3[f'gate{i}']['pass'] for i in range(8)] == [True] * 8
          assert [v4[f'gate{i}']['pass'] for i in range(8)] == [True, True, False, True, True, True, True, True]
          print('DCDEV020M1REPLAN002R5R3_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: R5-R3 focused preservation tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r5r3_v4_live_resource_irreversible_death -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r5r3-v4-live-resource-death
          path: digital-protocell/experiments/generated/dcdev020m1replan002r5r3/ci/**/*.json
