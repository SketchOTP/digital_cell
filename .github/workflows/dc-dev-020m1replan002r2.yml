name: DC-DEV-020-M1 REPLAN-002-R2 D-087 V4 lifecycle semantics audit

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit.rs
      - name: Verify bounded R2 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = '98b1104165039359bdc609898e0d0371f9ce05c4'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md',
              '.github/workflows/dc-dev-020m1replan002r2.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r2/dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit.md',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/d087_raw_metrics.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/dual_retention_comparison.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/starvation_semantics_comparison.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/physical_trajectory_parity.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r2/artifact_manifest.json',
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R2 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R2_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r2/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r2/ci/v3_d087
      - name: D-087 MaturationCoupledV4 raw reproduction
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r2/ci/v4_d087
      - name: Run R2 observer audit
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R2_OUTPUT: experiments/generated/dcdev020m1replan002r2/ci
          DCDEV020M1REPLAN002R2_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r2-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit --release --quiet
      - name: Verify R2 compact evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1replan002r2/ci')
          names = ('d087_raw_metrics.json', 'dual_retention_comparison.json', 'starvation_semantics_comparison.json', 'physical_trajectory_parity.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for name in names:
              assert (base / name).is_file(), f'missing {base/name}'
          q = json.loads((base / 'qualification.json').read_text())
          raw = json.loads((base / 'd087_raw_metrics.json').read_text())
          assert q['starting_head'] == '98b1104165039359bdc609898e0d0371f9ce05c4'
          assert q['v2_d087'] is True and q['v3_d087'] is True
          assert q['v4_legacy_d087'] == [True, False, False, True, True, True, True, True]
          assert q['production_biology_changed'] is False
          assert q['d087_threshold_changed'] is False
          assert raw['v4_gate_array'] == q['v4_legacy_d087']
          assert json.loads((base / 'physical_trajectory_parity.json').read_text())['physical_trajectory_parity'] is True
          print('DCDEV020M1REPLAN002R2_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: R1 capability and lifecycle tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit -- --nocapture
      - name: Phase-1 and preservation suites
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r2-d087-v4-lifecycle-semantics-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1replan002r2/ci/**/*.json
