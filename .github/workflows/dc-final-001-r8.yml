name: DC-FINAL-001-R8 V4 closure consistency

on:
  push:
    branches: [codex/dc-final-001-r8-v4-closure-consistency]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r8-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R7 authority, owner override, and bounded scope
        run: |
          set -euo pipefail
          start=7363cfaa2c459522583b70d8107f377c08467b76
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e 0dac294efce2745a99d423f28c31065fcbf29e76^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r8.yml',
              'digital-protocell/crates/chemistry-core/src/material_mesh.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_fission.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_mechanics.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_topology.rs',
              'digital-protocell/crates/chemistry-core/tests/r8_v4_closure_consistency_tests.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r8_v4_closure.rs',
              'digital-protocell/experiments/dcfinal001_r8_evidence.py',
              'digital-protocell/experiments/fixtures/dcfinal001r8/',
              'digital-protocell/experiments/generated/dcfinal001r8/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '7363cfaa2c459522583b70d8107f377c08467b76..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY
          gh run view 34373915324 --repo SketchOTP/digital_cell \
            --json conclusion,headSha --jq '.conclusion + " " + .headSha' \
            | grep '^success 7363cfaa2c459522583b70d8107f377c08467b76$'
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr['state'] == 'OPEN'
          assert pr['isDraft'] is True
          assert pr['mergedAt'] is None
          assert pr['headRefOid'] == 'fb77f472b1519a9e0f713833efba5b1d403f4723'
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Qualify V4 closure contracts and corrected reproduction
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test r8_v4_closure_consistency_tests -- --nocapture
          cargo +1.89.0 check --locked -p regulatory-core --example dcfinal001_r8_v4_closure
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r8_v4_closure \
            -- --output "$RUNNER_TEMP/r8.json"
          scientific_head=$(python3 - <<'PY'
          import json
          print(json.load(open('experiments/generated/dcfinal001r8/authority.json'))['result_scientific_head'])
          PY
          )
          python3 experiments/dcfinal001_r8_evidence.py \
            --head "$scientific_head" \
            --raw "$RUNNER_TEMP/r8.json" \
            --r7 experiments/generated/dcfinal001r7 \
            --fixtures experiments/fixtures/dcfinal001r8 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r8 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          raw = json.loads((root / 'r8.json').read_text())
          q = json.loads((root / 'evidence' / 'qualification.json').read_text())
          counts = {row['mode']: row for row in raw['campaign_counts']}
          expected = {
              'PASSIVE_V4': (10, 0, 0),
              'ZERO_PARAMETER_MEAN_RELATIVE_STRAIN': (10, 0, 0),
              'CURVATURE_GATED_NORMAL_ONLY': (10, 1, 1),
              'CURVATURE_NORMAL_PLUS_TANGENTIAL': (10, 0, 0),
          }
          for mode, values in expected.items():
              row = counts[mode]
              assert (row['growth_qualified'], row['geometry_valid_fissions'], row['simple_viable_daughter_pairs']) == values
          assert raw['new_free_parameters'] == 0
          assert raw['robust_v4_reproduction'] is False
          assert q['closing_edge_young_load_cycle'] == 'CONFIRMED'
          assert q['two_edge_structural_accounting'] == 'PASS'
          assert q['non_v4_parity'] == 'PASS'
          assert q['classification'] == 'V4_FISSION_CLOSURE_CONSISTENCY_REPAIRED_ROBUST_REPRODUCTION_NOT_ESTABLISHED'
          assert q['next_execution_started'] is False
          assert q['independent_architect_acceptance'] == 'PENDING'
          PY

      - name: Preserve M1, M2, lifecycle, and tests-only evolution surfaces
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test r4_contract_topology_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime --bin digital-cell-final-lifeform -- --nocapture
          cargo +1.89.0 check --locked -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Validate evidence manifest and Python tooling
        run: |
          set -euo pipefail
          python3 -m py_compile digital-protocell/experiments/dcfinal001_r8_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('digital-protocell/experiments/generated/dcfinal001r8')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY

      - name: Upload exact-head R8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r8
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r8
            ${{ runner.temp }}/r8.json
