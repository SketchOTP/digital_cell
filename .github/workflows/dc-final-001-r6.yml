name: DC-FINAL-001-R6 curvature-normal emergency closure

on:
  push:
    branches: [codex/dc-final-001-r6-curvature-normal-constriction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r6-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R5R1 authority, owner override, and bounded scope
        run: |
          set -euo pipefail
          start=456cc98837842af933d3972b8588707ea801bf28
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e cadf6d283cc7f77f243e5958fd8be22d5ee804c9^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r6.yml',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r6_curvature_normal.rs',
              'digital-protocell/experiments/dcfinal001_r6_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r6/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '456cc98837842af933d3972b8588707ea801bf28..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY
          gh run view 34345745806 --repo SketchOTP/digital_cell \
            --json conclusion,headSha --jq '.conclusion + " " + .headSha' \
            | grep '^success 456cc98837842af933d3972b8588707ea801bf28$'
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr['state'] == 'OPEN'
          assert pr['isDraft'] is True
          assert pr['mergedAt'] is None
          assert pr['headRefOid'] == 'fb77f472b1519a9e0f713833efba5b1d403f4723'
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Run curvature-normal mechanics and reproduction qualification
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 check --locked -p regulatory-core \
            --example dcfinal001_r5_v4_neck \
            --example dcfinal001_r5r1_strain_contrast \
            --example dcfinal001_r6_curvature_normal
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r6_curvature_normal \
            -- --output "$RUNNER_TEMP/r6.json"
          scientific_head=$(python3 - <<'PY'
          import json
          print(json.load(open('experiments/generated/dcfinal001r6/authority.json'))['result_scientific_head'])
          PY
          )
          python3 experiments/dcfinal001_r6_evidence.py \
            --head "$scientific_head" \
            --raw "$RUNNER_TEMP/r6.json" \
            --r5r1 experiments/generated/dcfinal001r5r1 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r6 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          raw = json.loads((root / 'r6.json').read_text())
          q = json.loads((root / 'evidence' / 'qualification.json').read_text())
          c = raw['campaigns']
          assert raw['owner_override'] == 'PASS'
          assert raw['tangential_geometry_audit']['classification'] == 'TANGENTIAL_TENSION_GEOMETRY_MISMATCH_SUPPORTED'
          assert raw['curvature_signal']['pass'] is True
          assert raw['new_free_parameters'] == 0
          assert c['passive']['geometry_valid_fissions'] == 3
          assert c['passive']['simple_viable_daughter_pairs'] == 2
          assert c['r5r1_tangential']['geometry_valid_fissions'] == 3
          assert c['r5r1_tangential']['simple_viable_daughter_pairs'] == 3
          assert c['normal_only']['geometry_valid_fissions'] == 3
          assert c['normal_only']['simple_viable_daughter_pairs'] == 2
          assert c['normal_motor_off']['geometry_valid_fissions'] == 3
          assert c['normal_motor_off']['simple_viable_daughter_pairs'] == 2
          assert raw['energy']['normal_only']['pass'] is True
          assert raw['energy']['normal_plus_tangential']['pass'] is True
          assert raw['energy']['zero_a_pass'] is True
          assert raw['apposition']['conditional_combined_executed'] is True
          assert c['normal_plus_tangential']['geometry_valid_fissions'] == 5
          assert c['normal_plus_tangential']['simple_viable_daughter_pairs'] == 2
          assert raw['reproduction']['pass'] is False
          assert raw['evolution_execution'] == 'NOT_REACHED_GATE8_STOP'
          assert q['classification'] == 'V4_ROBUST_PHYSICAL_REPRODUCTION_NOT_ESTABLISHED'
          assert q['shutdown_recommended'] == 'NO — OWNER OVERRIDE ACTIVE'
          assert q['next_execution_started'] is False
          assert q['independent_architect_acceptance'] == 'PENDING'
          PY

      - name: Preserve M1, M2, lifecycle, and tests-only evolution surfaces
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test r4_contract_topology_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime --bin digital-cell-final-lifeform -- --nocapture
          cargo +1.89.0 check --locked -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Validate evidence manifest and Python tooling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/validate_governance.py \
            scripts/test_validate_governance.py \
            digital-protocell/experiments/dcfinal001_r6_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('digital-protocell/experiments/generated/dcfinal001r6')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY

      - name: Upload exact-head R6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r6
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r6
            ${{ runner.temp }}/r6.json
