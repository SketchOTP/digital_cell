name: DC-FINAL-001-R3 D096 V4 integration boundary

on:
  push:
    branches: [codex/dc-final-001-r3-maturation-safe-evolution]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r3-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R2 authority and bounded scope
        run: |
          set -euo pipefail
          start=5bd82aa40b10ecbdc86cd6915760915ba6ccfb18
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e 5b7c06a7208b8b6bc8cc9c918d8de7906c611a4a^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r3.yml',
              'digital-protocell/crates/chemistry-core/src/d096_allocation.rs',
              'digital-protocell/crates/chemistry-core/tests/d096_tests.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r3_evolution.rs',
              'digital-protocell/experiments/dcfinal001_r3_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r3/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '5bd82aa40b10ecbdc86cd6915760915ba6ccfb18..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr['state'] == 'OPEN'
          assert pr['isDraft'] is True
          assert pr['mergedAt'] is None
          assert pr['headRefOid'] == 'fb77f472b1519a9e0f713833efba5b1d403f4723'
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Qualify V4 expression and seal the exact R2 boundary
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test d096_tests -- --nocapture
          cargo +1.89.0 run --locked -q --release -p regulatory-core --example dcfinal001_r3_evolution -- --output "$RUNNER_TEMP/r3-evolution.json"
          scientific_head=$(python3 - <<'PY'
          import json
          print(json.load(open('experiments/generated/dcfinal001r3/authority.json'))['result_scientific_head'])
          PY
          )
          python3 experiments/dcfinal001_r3_evidence.py \
            --head "$scientific_head" \
            --raw "$RUNNER_TEMP/r3-evolution.json" \
            --r1 experiments/generated/dcfinal001r1 \
            --r2 experiments/generated/dcfinal001r2 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r3 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          raw = json.loads((root / 'r3-evolution.json').read_text())
          evidence = root / 'evidence'
          q = json.loads((evidence / 'qualification.json').read_text())
          closure = json.loads((evidence / 'expression_activation_energy_closure.json').read_text())
          non_v4 = json.loads((evidence / 'non_v4_semantic_parity.json').read_text())
          assert raw['template']['contract_version'] == 'HistoricalV1'
          assert raw['gate6_exact_r2_newborn_continuity'] == 'FAIL'
          assert raw['evolution_execution'] == 'NOT_RUN_STOPPED_AT_GATE6'
          assert raw['v4_counterpart']['daughter_a_first_step']['contact_accepted']
          assert raw['v4_counterpart']['daughter_b_first_step']['contact_accepted']
          for key in ['daughter_a_lifecycle', 'daughter_b_lifecycle']:
              life = raw['v4_counterpart'][key]
              assert life['runtime_invalidation'] == {'phase': 'post_topology', 'step': 1}
              assert life['first_topology_ledger']['tension_ruptures'] > 0
              assert life['first_invalid_edges']
          assert closure['pass']
          assert non_v4['pass']
          assert q['classification'] == 'D096_V4_STRUCTURAL_TRANSFER_SEMANTICS_INVALID'
          assert q['status'] == 'GOAL_AGENT_PROVISIONAL_NEGATIVE_REPLAN'
          assert q['evolution_executed'] is False
          assert q['next_execution_started'] is False
          assert q['independent_architect_acceptance'] == 'PENDING'
          PY

      - name: Preserve frozen foundations and tests-only evolution harness
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime --bin digital-cell-final-lifeform -- --nocapture
          cargo +1.89.0 check --locked -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Upload exact-head R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r3
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r3
            ${{ runner.temp }}/r3-evolution.json
