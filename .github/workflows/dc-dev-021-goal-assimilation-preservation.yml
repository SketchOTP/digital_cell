name: DC-DEV-021 goal assimilation preservation audit

on:
  push:
    branches:
      - m2/dc-dev-021-goal-post-fission-ecological-reentry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=721172711a31ac80c6fa798474ffeef519eb963c
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/LEARNINGS.md', '.agent/OUTCOMES.md',
              '.agent/RECORD.md',
              '.github/workflows/dc-dev-021-goal-assimilation-preservation.yml',
              '.github/workflows/dc-dev-021-goal-flux-budget-audit.yml',
              'docs/goal-assimilation-preservation-audit-r9.md',
              'scripts/dcdev021_goal_assimilation_preservation_audit.py',
              'digital-protocell/crates/chemistry-core/tests/d094_tests.rs',
              'digital-protocell/crates/chemistry-core/tests/d098_geometry_material_conservation.rs',
              'digital-protocell/crates/chemistry-core/tests/goal_assimilation_preservation.rs',
              'digital-protocell/crates/m2-lifeform-runtime/src/main.rs',
          }
          prefix = 'digital-protocell/experiments/generated/dcdev021goalassimilationpreservationr9/'
          unexpected = {p for p in changed if p not in allowed and not p.startswith(prefix)}
          assert not unexpected, sorted(unexpected)
          assert not any(p.startswith(('digital-protocell/crates/regulatory-core/src/',
                                      'digital-protocell/crates/phase1-certifier/src/',
                                      'digital-protocell/crates/evolution-harness/src/'))
                         for p in changed)
          PY

      - name: Run assimilation-specific preservation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test goal_assimilation_preservation -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d094_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime -- --nocapture

      - name: Verify sealed M1 boundary
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = [
              Path('experiments/generated/dcdev021m2closure003r1/m1_preservation.json'),
              Path('experiments/generated/dcdev021goalmaterialfluxbudgetr7/m1_preservation.json'),
          ]
          for path in candidates:
              if path.exists():
                  data = json.loads(path.read_text())
                  assert data['v2_d087'] == '8/8'
                  assert data['v3_d087'] == '8/8'
                  assert data['v4_d087'] == '7/8'
                  assert data['v4_vector'] == [True, True, False, True, True, True, True, True]
                  print(f'canonical D-087 preservation boundary passed from {path}')
                  break
          else:
              raise SystemExit('sealed D-087 preservation evidence not found')
          PY

      - name: Emit provisional audit evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 ../scripts/dcdev021_goal_assimilation_preservation_audit.py \
            --output experiments/generated/dcdev021goalassimilationpreservationr9

      - name: Hash and upload compact evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021goalassimilationpreservationr9 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/dcdev021-goal-assimilation-preservation.sha256"

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-goal-assimilation-preservation-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021goalassimilationpreservationr9/
            ${{ runner.temp }}/dcdev021-goal-assimilation-preservation.sha256
