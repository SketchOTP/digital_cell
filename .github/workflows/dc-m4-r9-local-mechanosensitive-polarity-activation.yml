name: DC-M4 R9 local mechanosensitive polarity activation

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r9-mechanosensitive-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R8 authority and R9 source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r8=18cd5daff29267469db838acbba9bf9691e94ba6
          git merge-base --is-ancestor "$r8" HEAD
          python3 - "$r8" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r9-local-mechanosensitive-polarity-activation.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/crates/regulatory-core/src/polarity_mass.rs",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcm4_r9_local_mechanosensitive_polarity_activation.rs",
              "digital-protocell/experiments/dcm4_r9_local_mechanosensitive_polarity_activation_verify.py",
              "digital-protocell/experiments/generated/dcm4r9localmechanosensitivepolarityactivation/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Run focused implementation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check crates/regulatory-core/src/polarity_mass.rs
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r9_local_mechanosensitive_polarity_activation.rs
          python3 -m py_compile experiments/dcm4_r9_local_mechanosensitive_polarity_activation_verify.py
          cargo test --locked -q -p regulatory-core --lib
          cargo check --locked -q -p regulatory-core --example dcm4_r9_local_mechanosensitive_polarity_activation

      - name: Seal R9 contract before fixed-snapshot execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          mkdir -p experiments/generated/dcm4r9localmechanosensitivepolarityactivation/raw
          cargo run --locked -q -p regulatory-core --example dcm4_r9_local_mechanosensitive_polarity_activation -- \
            --stage seal --output /tmp/dcm4_r9_seal.json
          python3 experiments/dcm4_r9_local_mechanosensitive_polarity_activation_verify.py \
            --repo . --raw /tmp/dcm4_r9_seal.json \
            --output experiments/generated/dcm4r9localmechanosensitivepolarityactivation --stage seal

      - name: Execute fixed R8 E2 mechanosensitive diagnostic
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo run --locked --release -q -p regulatory-core --example dcm4_r9_local_mechanosensitive_polarity_activation -- \
            --stage qualification \
            --output experiments/generated/dcm4r9localmechanosensitivepolarityactivation/raw/qualification.json

      - name: Independently verify R9 E2 and seal artifact
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 experiments/dcm4_r9_local_mechanosensitive_polarity_activation_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r9localmechanosensitivepolarityactivation/raw/qualification.json \
            --output experiments/generated/dcm4r9localmechanosensitivepolarityactivation \
            --stage qualification
          sha256sum target/release/examples/dcm4_r9_local_mechanosensitive_polarity_activation \
            > experiments/generated/dcm4r9localmechanosensitivepolarityactivation/binary_sha256.txt
          python3 experiments/dcm4_r9_local_mechanosensitive_polarity_activation_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r9localmechanosensitivepolarityactivation/raw/qualification.json \
            --output experiments/generated/dcm4r9localmechanosensitivepolarityactivation \
            --stage qualification
          git diff --check

      - name: Confirm R9 downstream stages were not started
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcm4r9localmechanosensitivepolarityactivation")
          qualification = json.loads((root / "qualification.json").read_text())
          assert qualification["reproduction"] == "NOT_REACHED"
          assert qualification["population_selection"] == "NOT_REACHED"
          assert qualification["reversal"] == "NOT_REACHED"
          assert qualification["final_integration"] == "NOT_REACHED"
          assert qualification["mechanical_output"] == "NOT_CONNECTED"
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert manifest["file_count"] >= 8
          assert manifest["exact_head"] == __import__("subprocess").check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          PY

      - name: Upload R9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r9localmechanosensitivepolarityactivation-${{ github.sha }}
          if-no-files-found: error
          path: |
            digital-protocell/experiments/generated/dcm4r9localmechanosensitivepolarityactivation/
            digital-protocell/experiments/dcm4_r9_local_mechanosensitive_polarity_activation_verify.py
            digital-protocell/examples/dcm4_r9_local_mechanosensitive_polarity_activation.rs
            digital-protocell/target/release/examples/dcm4_r9_local_mechanosensitive_polarity_activation
