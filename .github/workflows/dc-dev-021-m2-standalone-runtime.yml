name: DC-DEV-021 M2 standalone runtime increment

on:
  push:
    branches:
      - m2/dc-dev-021-m2-standalone-lifeform-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=8b18d1a349208ab81d1f5f051451ac5d18bf17b6
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess, sys
          start=sys.argv[1]
          allowed={
            '.agent/CURRENT.md','.agent/DIRECTIVES.md','.agent/OUTCOMES.md','.agent/RECORD.md',
            'digital-protocell/Cargo.toml',
            'digital-protocell/Cargo.lock',
            '.github/workflows/dc-dev-021-m2-standalone-runtime.yml',
            'digital-protocell/crates/m2-lifeform-runtime/Cargo.toml',
            'digital-protocell/crates/m2-lifeform-runtime/src/main.rs',
            'digital-protocell/crates/m2-lifeform-runtime/src/polarity.rs',
            '.github/workflows/dc-dev-021-m2-standalone-runtime.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{start}..HEAD'],text=True).splitlines())
          evidence_prefix='digital-protocell/experiments/generated/m2-lifeform-runtime-v2/'
          unexpected={p for p in changed if p not in allowed and not p.startswith(evidence_prefix)}
          assert not unexpected, sorted(unexpected)
          assert all(p.startswith(evidence_prefix) for p in changed if p.startswith('digital-protocell/experiments/generated/'))
          forbidden=(
            'digital-protocell/crates/chemistry-core/src/',
            'digital-protocell/crates/regulatory-core/src/',
            'digital-protocell/crates/phase1-certifier/src/',
            'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(p.startswith(forbidden) for p in changed)
          PY
      - name: Build and test runtime
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p m2-lifeform-runtime
      - name: Run checkpoint and resume smoke
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/m2-lifeform-runtime.snapshot.json"
          cargo +1.89.0 run --locked -q -p m2-lifeform-runtime -- \
            --steps 50 --seed 1 --checkpoint "$checkpoint" \
            --report "$RUNNER_TEMP/m2-lifeform-runtime.report.json"
          cargo +1.89.0 run --locked -q -p m2-lifeform-runtime -- \
            --steps 50 --resume "$checkpoint" --checkpoint "$checkpoint" \
            --report "$RUNNER_TEMP/m2-lifeform-runtime.report.json"
      - name: Validate runtime evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/generated/m2-lifeform-runtime-v2')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for item in manifest['files']:
              assert (root/item).is_file(), item
          import os
          smoke=json.loads((Path(os.environ['RUNNER_TEMP']) / 'm2-lifeform-runtime.report.json').read_text())
          assert smoke['step'] == 100
          assert smoke['motor_steps'] > 0
          assert smoke['motor_failures'] == 0
          assert abs(smoke['world_n_conservation_error']) <= 1e-12
          assert abs(smoke['world_f_conservation_error']) <= 1e-12
          report=json.loads((root/'runtime_12000_report.json').read_text())
          assert report['fission_events'] == 0
          assert abs(report['world_n_conservation_error']) <= 1e-12
          assert abs(report['world_f_conservation_error']) <= 1e-12
          assert report['autonomous_resource_acquisition'] == 'NOT_ESTABLISHED'
          assert report['resource_causal_reproduction'] == 'NOT_ESTABLISHED'
          for path in root.glob('*.json'):
              json.loads(path.read_text())
          print('M2 runtime evidence validation passed')
          PY
      - name: Hash runtime evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/m2-lifeform-runtime-v2 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/m2-lifeform-runtime-v2.sha256"
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: dc-dev-021-m2-runtime-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/m2-lifeform-runtime-v2/
            ${{ runner.temp }}/m2-lifeform-runtime-v2.sha256
