name: DC-M4 R5 mechanochemical instability attribution

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r5-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and diagnostic-only source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r4=38de33d6ed2741a60b3e825360a45b8ff4686792
          git merge-base --is-ancestor "$r4" HEAD
          python3 - "$r4" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r5-mechanochemical-instability.yml",
              "digital-protocell/experiments/dcm4_r5_mechanochemical_instability_verify.py",
              "digital-protocell/experiments/generated/dcm4r5mechanochemicalinstability/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          assert not any(path.startswith("digital-protocell/crates/") for path in changed)
          assert not any(path.startswith("digital-protocell/examples/") for path in changed)
          print("R5 diagnostic-only source scope passed")
          PY
          git diff --check

      - name: Download and verify the sealed R4 raw artifact
        working-directory: digital-protocell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10331644383/zip" \
            --output "$run_root/r4.zip"
          test "$(sha256sum "$run_root/r4.zip" | awk '{print $1}')" = \
            "1be6045d0fdc0b91dda666baefe363e9490ee1cc2be498169b5a0cd3219b677b"
          unzip -q "$run_root/r4.zip" -d "$run_root/r4"
          raw="$(find "$run_root/r4" -type f -path '*/raw/qualification.json' -print -quit)"
          test -n "$raw"
          test "$(sha256sum "$raw" | awk '{print $1}')" = \
            "a97852f34c8bb63c86d1367ec512a69e3ae4a421d559fa3dd7054d9ee878c8bd"
          printf '%s\n' "$raw" > "$run_root/raw-path"
          printf '%s\n' "$run_root" > "$GITHUB_WORKSPACE/.r5-run-root"

      - name: Run independent sealed-history attribution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(cat ../.r5-run-root)"
          raw="$(cat "$run_root/raw-path")"
          python3 -m py_compile experiments/dcm4_r5_mechanochemical_instability_verify.py
          python3 experiments/dcm4_r5_mechanochemical_instability_verify.py \
            --repo . \
            --raw "$raw" \
            --output experiments/generated/dcm4r5mechanochemicalinstability

      - name: Enforce fail-closed R5 terminal decision and manifest
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcm4r5mechanochemicalinstability")
          qualification = json.loads((root / "qualification.json").read_text())
          decision = json.loads((root / "architecture_decision.json").read_text())
          verifier = json.loads((root / "independent_verifier.json").read_text())
          authority = json.loads((root / "authority.json").read_text())
          stability = json.loads((root / "local_stability_modal_projection.json").read_text())
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert qualification["implementation_acceptance"] == "PASS", qualification
          assert qualification["scientific_acceptance"] == "BOUNDED_INCONCLUSIVE", qualification
          assert qualification["terminal_classification"] == "R4_ATTRIBUTION_INCONCLUSIVE", qualification
          assert decision["classification"] == "R4_ATTRIBUTION_INCONCLUSIVE", decision
          assert decision["successor"]["production_implementation_started"] is False, decision
          assert authority["r4_final_head"] == "38de33d6ed2741a60b3e825360a45b8ff4686792"
          assert authority["r4_ci"] == "34802371283"
          assert authority["r4_artifact"] == "sha256:1be6045d0fdc0b91dda666baefe363e9490ee1cc2be498169b5a0cd3219b677b"
          assert authority["raw_input_sha256"] == "a97852f34c8bb63c86d1367ec512a69e3ae4a421d559fa3dd7054d9ee878c8bd"
          assert verifier["status"] == "PASS", verifier
          assert verifier["frozen_stability_counts"] == {"DECAYING": 1800, "GROWING": 0, "INVALID": 0, "NEUTRAL": 0}
          assert stability["coupled_local_jacobian"]["status"] == "NOT_IDENTIFIABLE_FROM_SEALED_R4_RAW"
          assert manifest["file_count"] == len(manifest["files"]), manifest
          for relative, expected in manifest["files"].items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert actual == expected, (relative, actual, expected)
          print(json.dumps({
              "classification": qualification["terminal_classification"],
              "frozen_stability": verifier["frozen_stability_counts"],
              "files": len(manifest["files"]),
          }, sort_keys=True))
          PY
          git diff --check

      - name: Upload exact-head R5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r5mechanochemicalinstability-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcm4r5mechanochemicalinstability/
            digital-protocell/experiments/dcm4_r5_mechanochemical_instability_verify.py
