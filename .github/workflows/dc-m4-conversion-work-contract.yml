name: DC-M4 Conversion Work Ownership Contract
on:
  push:
    branches:
      - codex/dc-m4-conversion-work-contract
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify contract arithmetic, independent review and preservation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 scripts/verify_conversion_work_contract.py --repo . --output "$RUNNER_TEMP/conversion-work-contract"
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: dc-m4-conversion-work-contract-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/conversion-work-contract/
