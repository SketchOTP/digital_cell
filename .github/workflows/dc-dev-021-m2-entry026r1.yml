name: DC-DEV-021 M2 ENTRY-026-R1 population fission-gate requalification

on:
  push:
    branches:
      - m2/dc-dev-021-entry026r1-population-fission-gate-requalification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry026r1-population-fission-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded scope
        run: |
          set -euo pipefail
          start=04e8b7f030118842b0ad2d8428b6f937fa9aa6c7
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          test -z "$(git diff --name-only "$start" HEAD -- digital-protocell/crates/chemistry-core/src digital-protocell/crates/phase1-certifier/src digital-protocell/crates/regulatory-core/src digital-protocell/crates/evolution-harness/src)"
          python3 - "$start" <<'PY'
          import subprocess, sys
          start = sys.argv[1]
          allowed = {
              ".github/workflows/dc-dev-021-m2-entry026r1.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcdev021_m2_entry026r1.rs",
              ".agent/CURRENT.md", ".agent/DIRECTIVES.md", ".agent/OUTCOMES.md",
              ".agent/LEARNINGS.md", ".agent/RECORD.md", ".agent/REPO_MAP.md",
          }
          prefix = "digital-protocell/experiments/generated/dcdev021m2entry026r1/"
          changed = subprocess.check_output(["git", "diff", "--name-only", start, "HEAD"], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed and not p.startswith(prefix)]
          assert not unexpected, unexpected
          print("ENTRY-026-R1 authority and scope verified")
          PY
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefName,baseRefName
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and execute ENTRY-026-R1 assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build -p regulatory-core --release --example dcdev021_m2_entry026r1
          cargo +1.89.0 run -p regulatory-core --release --example dcdev021_m2_entry026r1 -- experiments/generated/dcdev021m2entry026r1

      - name: Validate ENTRY-026-R1 evidence and preservation
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          start = "04e8b7f030118842b0ad2d8428b6f937fa9aa6c7"
          root = Path("experiments/generated/dcdev021m2entry026r1")
          required = [
              "protocol.json", "authority.json", "entry026_architect_disposition.json",
              "entry026_boundary_defect_reproduction.json", "mesh_population_fission_authority.json",
              "daughter_birth_mass_authority.json", "population_fission_gate.json", "cadence_equivalence.json",
              "daughter_a_inherited_growth_on.json", "daughter_a_inherited_growth_off.json",
              "daughter_a_homogeneous_growth_on.json", "daughter_a_homogeneous_growth_off.json",
              "daughter_b_inherited_growth_on.json", "daughter_b_inherited_growth_off.json",
              "daughter_b_homogeneous_growth_on.json", "daughter_b_homogeneous_growth_off.json",
              "corrected_common_prefix.json", "developmental_activity.json", "polarity_chronology.json",
              "maintenance_attribution.json", "reseed_events.json", "de_novo_seed.json",
              "true_second_fission_boundary.json", "u_v_closure.json", "f_accounting.json",
              "growth_material_closure.json", "remesh_continuity.json", "rotation_equivariance.json",
              "index_invariance.json", "no_behavior_audit.json", "forbidden_information_audit.json",
              "entry005_026_preservation.json", "m1_preservation.json", "downstream_preservation.json",
              "restart_boundary.json", "repository_professionalism.json", "qualification.json",
              "artifact_manifest.json",
          ]
          for name in required:
              assert (root / name).is_file(), name
          q = json.loads((root / "qualification.json").read_text())
          assert q["classification"] in {
              "M2_POST_FISSION_CONTINUED_DEVELOPMENT_POLARITY_RESEEDING_QUALIFIED",
              "M2_POST_FISSION_DEVELOPMENT_MAINTAINS_INHERITED_POLARITY_WITHOUT_DE_NOVO_RESEED",
              "M2_POST_FISSION_CONTINUED_DEVELOPMENT_POLARITY_INSUFFICIENT",
              "M2_ENTRY026R1_POPULATION_FISSION_GATE_AUTHORITY_UNRESOLVED",
              "M2_ENTRY026R1_GROWTH_OFF_REGRESSION_INVALID",
              "M2_ENTRY026R1_REQUALIFICATION_INVALID",
          }
          assert q["autonomous_polarity_initiation"] == "QUALIFIED"
          assert q["polarity_fission_inheritance"] == "QUALIFIED"
          assert q["second_fission_executed"] is False
          assert q["actuator"] == "NO"
          assert q["rotation"] == "PASS" and q["index_invariance"] == "PASS"
          assert q["entry005_026_preservation"] == "PASS"
          assert q["m1_preservation"] == "PASS" and q["downstream_preservation"] == "PASS"
          assert json.loads((root / "rotation_equivariance.json").read_text())["pass"] is True
          assert json.loads((root / "index_invariance.json").read_text())["pass"] is True
          boundary = json.loads((root / "true_second_fission_boundary.json").read_text())
          assert boundary["second_fission_executed"] is False
          sealed_path = "experiments/generated/dcdev021m2entry026/qualification.json"
          sealed_git_path = "digital-protocell/" + sealed_path
          sealed_at_start = subprocess.check_output(["git", "show", f"{start}:{sealed_git_path}"])
          assert Path(sealed_path).read_bytes() == sealed_at_start
          assert q["entry026_sealed_artifact"] == "UNCHANGED"
          m1 = json.loads((root / "m1_preservation.json").read_text())
          assert m1["v2_d087"] == "8/8" and m1["v3_d087"] == "8/8" and m1["v4_d087"] == "7/8"
          assert m1["v4_vector"] == [True, True, False, True, True, True, True, True]
          print("ENTRY-026-R1 evidence and preservation gates passed")
          PY

      - name: Verify historical classifications and production preservation
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
            "dcdev021m2entry005":"M2_REFRACTORY_MOTOR_DECOUPLING_EXPLORATION_QUALIFIED",
            "dcdev021m2entry006":"M2_UNGUIDED_RESOURCE_ACQUISITION_NOT_ESTABLISHED",
            "dcdev021m2entry007":"M2_UPTAKE_DEGRADATION_CONCENTRATION_FEEDBACK_CONFIRMED",
            "dcdev021m2entry008":"M2_LOCAL_CONTACT_REFRACTORY_EXPLOITATION_UPTAKE_INSUFFICIENT",
            "dcdev021m2entry009":"M2_CONTACT_LOCAL_SUPPRESSION_FAMILY_MECHANICALLY_INSUFFICIENT",
            "dcdev021m2entry010":"M2_POST_INGESTIVE_MATERIAL_SIGNAL_SUBSTRATE_QUALIFIED",
            "dcdev021m2entry011":"M2_FROZEN_UPTAKE_METABOLISM_COMPOSITION_QUALIFIED",
            "dcdev021m2entry012":"M2_SEPARATED_RESOURCE_ENCOUNTER_NOT_ESTABLISHED",
            "dcdev021m2entry013":"M2_SEARCH_REACH_POLARITY_DECAY_OR_HOMOGENIZATION_CONFIRMED",
            "dcdev021m2entry014":"M2_EXCITABLE_POLARITY_REFERENCE_TRANSFER_FEASIBLE",
            "dcdev021m2entry015":"M2_EXCITABLE_POLARITY_ACTUATOR_INTERFACE_QUALIFIED",
            "dcdev021m2entry016":"M2_POLARITY_INITIATION_ENDOGENOUS_ASYMMETRY_ABSENT",
            "dcdev021m2entry017":"M2_POST_FISSION_ASYMMETRY_PRESENT_TOPOLOGY_MAPPING_UNRESOLVED",
            "dcdev021m2entry018":"M2_NATIVE_MATERIAL_RING_POLARITY_TRANSFER_FEASIBLE",
            "dcdev021m2entry019":"M2_CONSERVATIVE_LIFE_HISTORY_POLARITY_INITIATION_QUALIFIED",
            "dcdev021m2entry020":"M2_AUTONOMOUS_POLARITY_MECHANICAL_AMPLITUDE_INSUFFICIENT",
            "dcdev021m2entry021":"M2_CONSERVATIVE_POLARITY_FISSION_INHERITANCE_AND_AMPLIFICATION_QUALIFIED",
            "dcdev021m2entry022":"M2_POST_FISSION_TRANSIENT_MOTOR_CONTRAST_MECHANICALLY_INSUFFICIENT",
            "dcdev021m2entry023":"M2_DAUGHTER_MECHANICAL_TRANSFER_ATTRIBUTION_UNRESOLVED",
            "dcdev021m2entry024":"M2_EFFECTOR_ORIENTATION_DAUGHTER_DEPENDENT_UNRESOLVED",
            "dcdev021m2entry025":"M2_LIVE_ANTAGONISTIC_INHERITED_POLARITY_COMPOSITION_INSUFFICIENT",
          }
          for folder, value in expected.items():
              actual = json.loads((Path("experiments/generated") / folder / "qualification.json").read_text())["classification"]
              assert actual == value, (folder, actual)
          print("historical classification preservation passed")
          PY
          DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/production.json"
          python3 - "$RUNNER_TEMP/production.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          assert result["mesh_contract"] == "MaturationCoupledV4"
          assert result["reserve_enabled"] is False
          PY
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
          python3 ../scripts/validate_governance.py --mode ADOPTED

      - name: Record and upload ENTRY-026-R1 evidence
        if: always()
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2entry026r1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2entry026r1.sha256"

      - name: Upload ENTRY-026-R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-entry026r1-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2entry026r1/
            ${{ runner.temp }}/dcdev021m2entry026r1.sha256
            ${{ runner.temp }}/production.json
          if-no-files-found: warn
