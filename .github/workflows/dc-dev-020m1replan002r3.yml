name: DC-DEV-020-M1 REPLAN-002-R3 D-087 N-starvation causal divergence audit

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002r3_d087_n_starvation_causal_divergence.rs
      - name: Verify bounded R3 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = '7d7303900e17e1fc3cb0ded911e60ddfe70bb621'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md',
              '.github/workflows/dc-dev-020m1replan002r3.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002r3_d087_n_starvation_causal_divergence.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r3/dcdev020m1replan002r3_d087_n_starvation_causal_divergence_audit.md',
          }
          allowed |= {
              f'digital-protocell/experiments/generated/dcdev020m1replan002r3/{name}'
              for name in ('protocol.json', 'qualification.json', 'comparator_endpoints.json',
                           'starvation_flux_comparison.json', 'a_balance_comparison.json',
                           'structural_lifecycle_comparison.json', 'embodied_demand_comparison.json',
                           'first_divergence.json', 'preservation.json', 'artifact_manifest.json')
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R3 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R3_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r3/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r3/ci/v3_d087
      - name: D-087 MaturationCoupledV4 raw reproduction
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r3/ci/v4_d087
      - name: Run R3 observer audit
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R3_OUTPUT: experiments/generated/dcdev020m1replan002r3/ci
          DCDEV020M1REPLAN002R3_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r3-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r3_d087_n_starvation_causal_divergence --release --quiet
      - name: Verify R3 compact evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1replan002r3/ci')
          names = ('protocol.json', 'qualification.json', 'comparator_endpoints.json',
                   'starvation_flux_comparison.json', 'a_balance_comparison.json',
                   'structural_lifecycle_comparison.json', 'embodied_demand_comparison.json',
                   'first_divergence.json', 'preservation.json', 'artifact_manifest.json')
          for name in names:
              assert (base / name).is_file(), f'missing {base/name}'
          q = json.loads((base / 'qualification.json').read_text())
          assert q['starting_head'] == '7d7303900e17e1fc3cb0ded911e60ddfe70bb621'
          assert q['v2_d087'] is True and q['v3_d087'] is True
          assert q['v4_d087'] == [True, False, False, True, True, True, True, True]
          assert q['r1_shadow_parity'] is True
          assert q['v4_fed_homeostasis'] is True and q['v4_recovery'] is True
          assert q['v4_starvation_structural_decline'] is True
          assert q['material_closure'] is True
          assert q['classification'] in {
              'M1_V4_N_STARVATION_LIFECYCLE_PROTECTION_DOMINANT',
              'M1_V4_N_STARVATION_ENERGETIC_DEMAND_DOMINANT',
              'M1_V4_N_STARVATION_EMBODIED_COUPLING_DOMINANT',
              'M1_V4_N_STARVATION_COMBINED_COUPLING',
              'M1_V4_N_STARVATION_OTHER_CAUSAL_DIVERGENCE',
              'M1_V4_N_STARVATION_CAUSE_UNRESOLVED',
          }
          assert q['first_divergence_v4_vs_v2']['first_step'] is not None
          assert q['first_divergence_v4_vs_v3']['first_step'] is not None
          assert q['production_default_changed'] is False
          assert q['next_execution_started'] is False
          p = json.loads((base / 'preservation.json').read_text())
          assert p['v2_d087_8_of_8'] is True and p['v3_d087_8_of_8'] is True
          assert p['v4_expected_legacy_6_of_8'] is True
          print('DCDEV020M1REPLAN002R3_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: R1 and R2 preservation tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit -- --nocapture
      - name: Phase-1 and preservation suites
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r3-d087-n-starvation-causal-divergence-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1replan002r3/ci/**/*.json
