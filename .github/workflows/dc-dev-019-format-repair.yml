name: DC-DEV-019 formatting-only repair

on:
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install sanctioned Rust toolchain and rustfmt
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add rustfmt --toolchain 1.89.0

      - name: Format only DC-DEV-019 touched Rust files
        working-directory: digital-protocell
        run: |
          rustup run 1.89.0 rustfmt --edition 2021 \
            crates/regulatory-core/src/metabolic_homeostat.rs \
            crates/regulatory-core/src/spatial_resource.rs \
            crates/chemistry-core/src/mesh_reactions.rs \
            examples/dcdev019_phase1_delivery.rs \
            examples/dcdev019_homeostasis.rs

      - name: Commit and push formatting-only repair if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting repair needed"
            exit 0
          fi
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed='^(digital-protocell/crates/regulatory-core/src/metabolic_homeostat\.rs|digital-protocell/crates/regulatory-core/src/spatial_resource\.rs|digital-protocell/crates/chemistry-core/src/mesh_reactions\.rs|digital-protocell/examples/dcdev019_phase1_delivery\.rs|digital-protocell/examples/dcdev019_homeostasis\.rs)$'
          if printf '%s\n' "$changed" | grep -Ev "$allowed"; then
            echo "Unexpected non-format scope"
            exit 1
          fi
          git config user.name "digital-cell-architect"
          git config user.email "actions@users.noreply.github.com"
          git add $changed
          git commit -m "Format DC-DEV-019 touched Rust files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
