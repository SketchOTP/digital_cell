name: DC-DEV-020-R8-R5 A-C allocation capacity audit

on:
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-020r8r5-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate R8-R5 boundary and compact evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev020r8r5")
          required = [
              "protocol.json", "economic_envelope.json", "r8r4_reproduction.json",
              "constant_allocation_summary.json", "local_drift_summary.json",
              "qualification.json", "literature_review.json",
              "external_evidence_manifest.json", "manifest.json",
          ]
          if any(not (root / name).is_file() for name in required):
              raise SystemExit("missing R8-R5 compact evidence")
          protocol = json.loads((root / "protocol.json").read_text())
          qualification = json.loads((root / "qualification.json").read_text())
          if protocol["entry_head"] != "37b47ec89e02418018a138f670e826c6945c8030":
              raise SystemExit("wrong R8-R4 authority")
          if protocol["constant_allocation"]["a_c_conserving"] is not True:
              raise SystemExit("A+C conservation boundary missing")
          if qualification["dc_dev_021_authorized"] or qualification["next_execution_started"]:
              raise SystemExit("R8-R5 scope boundary opened")
          if qualification["production_chemistry_changed"] or qualification["production_behavior_changed"]:
              raise SystemExit("production boundary opened")
          changed = "\n".join(__import__("subprocess").check_output(["git", "diff", "--name-only", "1e242f28152797b512e25cd56c7b718e45d6ca97", "HEAD"], text=True).splitlines())
          if any(name.startswith("digital-protocell/crates/chemistry-core/") for name in changed.splitlines()):
              raise SystemExit("certified chemistry-core changed")
          if any("dcdev021" in name.lower() or "dc-dev-021" in name.lower() for name in changed.splitlines()):
              raise SystemExit("DC-DEV-021 scope opened")
          PY

      - name: Scoped formatting and R8-R5 compile
        working-directory: digital-protocell
        run: |
          rustup run 1.89.0 rustfmt --edition 2021 --check examples/dcdev020r8r5_ac_allocation_upper_bound.rs
          cargo +1.89.0 test -p regulatory-core --example dcdev020r8r5_ac_allocation_upper_bound --release

      - name: Execute R8-R5 fixed observer audit
        working-directory: digital-protocell
        env:
          DCDEV020R8R5_OUTPUT_ROOT: experiments/generated/dcdev020r8r5-ci
          DCDEV020R8R5_DENSE_LEDGER: target/dcdev020r5-ac-allocation-dense.json
          DCDEV020R8R5_EXTERNAL_LOCATION: CI_UNSEALED
          DCDEV020R8R5_EXTERNAL_SHA256: CI_UNSEALED
          DCDEV020R8R5_RESULT_COMMIT: PENDING
        run: |
          set -euo pipefail
          cargo +1.89.0 run -p regulatory-core --example dcdev020r8r5_ac_allocation_upper_bound --release --quiet
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcdev020r8r5-ci")
          q = json.loads((root / "qualification.json").read_text())
          summary = json.loads((root / "constant_allocation_summary.json").read_text())
          local = json.loads((root / "local_drift_summary.json").read_text())
          assert q["classification"] == "DCDEV020R8R5_CATALYST_ALLOCATION_ENVELOPE_MIXED"
          assert q["gate_0_authority"] and q["gate_1_reproduction"]
          assert q["gate_2_conservative_partition"] and q["gate_3_deterministic_refinement"]
          assert q["gate_4_original_sustained_qualification"] and q["gate_5_local_late_state_envelope"]
          assert summary["complete_gate_passes"] == 0
          assert local["deferred_nonnegative"] > 0 and local["shared_nonnegative"] > 0
          assert not q["dc_dev_021_authorized"] and not q["next_execution_started"]
          PY

      - name: Preservation regressions
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core
          cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
