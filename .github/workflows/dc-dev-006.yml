name: DC-DEV-006 validation

on:
  pull_request:
    branches:
      - strategy/dc-dev-005-local-plasticity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-006-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate DC-DEV-006 artifacts and boundaries
        env:
          ENTRY_COMMIT: 4da04a5cf8153e4ab31603965eeba305ad4bb721
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev006")
          required = [
              "protocol.json", "contact_world.json", "zero_world_parity.json",
              "contact_physics.json", "contact_transduction.json",
              "regulatory_response.json", "experience_dependence.json",
              "remesh_boundaries.json", "governance_boundary.json",
              "regression_manifest.json", "final_manifest.json",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing artifacts: {missing}")
          data = {name: json.loads((root / name).read_text()) for name in required}
          if data["protocol.json"]["entry_commit"] != "4da04a5cf8153e4ab31603965eeba305ad4bb721":
              raise SystemExit("wrong entry commit")
          if data["protocol.json"]["parameter_screening"]:
              raise SystemExit("parameter screening must remain false")
          final = data["final_manifest.json"]
          if final["conclusion"] != "DCDEV006_SPATIAL_CONTACT_ENVIRONMENT_QUALIFIED":
              raise SystemExit("unexpected conclusion")
          if final["next_execution_started"] is not False:
              raise SystemExit("next execution must remain stopped")
          for key in ["new_sensor", "new_actuator", "reward", "fitness", "evolution"]:
              if final[key]:
                  raise SystemExit(f"forbidden capability enabled: {key}")
          checks = [
              data["zero_world_parity"]["exact_dcdev005_trajectory"],
              data["contact_physics"]["non_contact_forces_zero"],
              data["contact_physics"]["world_did_not_move_coordinates"],
              data["contact_transduction"]["deterministic"],
              data["contact_transduction"]["distant_zero"],
              data["regulatory_response.json"]["contacted_activity_increased"],
              data["experience_dependence"]["same_physical_contact"],
              data["remesh_boundaries"]["continuity_valid"],
              data["remesh_boundaries"]["fission_rejected"],
          ]
          if not all(checks):
              raise SystemExit("one or more DC-DEV-006 gate assertions failed")
          print(f"validated {len(required)} DC-DEV-006 artifacts")
          PY
          changed="$(git diff --name-only "$ENTRY_COMMIT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/' | grep -v '^digital-protocell/crates/chemistry-core/src/mesh_mechanics.rs$'; then
            echo "DC-DEV-006 may only add the bounded mesh mechanics force hook in chemistry-core"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ei '(^|/)(d096|r4)(/|_|\.)'; then
            echo "DC-DEV-006 may not modify D-096/R4"
            exit 1
          fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 --check crates/chemistry-core/src/mesh_mechanics.rs crates/regulatory-core/src/lib.rs crates/regulatory-core/src/contractility.rs crates/regulatory-core/src/plasticity.rs crates/regulatory-core/src/spatial.rs examples/dcdev006_gate_assay.rs

      - name: Regulatory-core and DC-DEV-006 assay
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core --lib -- --nocapture
          cargo +1.89.0 run -p regulatory-core --example dcdev006_gate_assay -- experiments/generated/dcdev006

      - name: Prior developmental preservation assays
        working-directory: digital-protocell
        run: |
          tmp_dir="$(mktemp -d)"
          cargo +1.89.0 run -p regulatory-core --example dcdev002_gate_assay -- "$tmp_dir/dcdev002"
          cargo +1.89.0 run -p regulatory-core --example dcdev003_gate_assay -- "$tmp_dir/dcdev003"
          cargo +1.89.0 run -p regulatory-core --example dcdev004_gate_assay -- "$tmp_dir/dcdev004"
          cargo +1.89.0 run -p regulatory-core --example dcdev005_gate_assay -- "$tmp_dir/dcdev005"

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        run: git rev-parse --verify HEAD
