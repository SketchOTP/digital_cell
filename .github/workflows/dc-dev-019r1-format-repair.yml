name: DC-DEV-019-R1 formatting-only repair

on:
  pull_request:
    branches:
      - strategy/dc-dev-019-nutrient-homeostasis-persistence

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install sanctioned Rust toolchain and rustfmt
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add rustfmt --toolchain 1.89.0

      - name: Format only R1 assay source
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 examples/dcdev019_homeostasis.rs

      - name: Commit formatting-only repair
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ "$changed" != "digital-protocell/examples/dcdev019_homeostasis.rs" ]; then
            echo 'Unexpected formatting scope'
            exit 1
          fi
          git config user.name 'digital-cell-architect'
          git config user.email 'actions@users.noreply.github.com'
          git add digital-protocell/examples/dcdev019_homeostasis.rs
          git commit -m 'Format DC-DEV-019-R1 assay source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
