name: DC-DEV-021 M2 developmental polarity runtime increment

on:
  push:
    branches:
      - m2/dc-dev-021-runtime-developmental-polarity-embodiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=9a519d21481fa0eeb5c2aa27d41d15155ffeef41
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          allowed = {
              '.agent/RECORD.md',
              '.agent/OUTCOMES.md',
              '.github/workflows/dc-dev-021-m2-runtime-developmental-polarity.yml',
              'digital-protocell/crates/chemistry-core/tests/d008_tests.rs',
              'digital-protocell/crates/m2-lifeform-runtime/src/main.rs',
              'digital-protocell/crates/m2-lifeform-runtime/src/polarity.rs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines())
          evidence_prefix = (
              'digital-protocell/experiments/generated/'
              'm2-lifeform-runtime-v3-developmental-polarity/'
          )
          unexpected = {
              path for path in changed
              if path not in allowed and not path.startswith(evidence_prefix)
          }
          assert not unexpected, sorted(unexpected)
          forbidden = (
              'digital-protocell/crates/chemistry-core/src/',
              'digital-protocell/crates/regulatory-core/src/',
              'digital-protocell/crates/phase1-certifier/src/',
              'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(path.startswith(forbidden) for path in changed)
          PY

      - name: Build and test runtime
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p m2-lifeform-runtime

      - name: Revalidate frozen chemistry fixture
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test d008_tests

      - name: Run developmental runtime observations
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --steps 1500 --seed 1 --report "$RUNNER_TEMP/seed1_1500.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --steps 1500 --seed 2 --report "$RUNNER_TEMP/seed2_1500.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --steps 12000 --seed 1 --report "$RUNNER_TEMP/seed1_12000.json"
          checkpoint="$RUNNER_TEMP/runtime.snapshot.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --steps 50 --seed 1 --checkpoint "$checkpoint" \
            --report "$RUNNER_TEMP/checkpoint_50.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --steps 50 --resume "$checkpoint" --checkpoint "$checkpoint" \
            --report "$RUNNER_TEMP/checkpoint_100.json"

      - name: Validate runtime evidence and observations
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('experiments/generated/m2-lifeform-runtime-v3-developmental-polarity')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for item in manifest['files']:
              assert (root / item).is_file(), item
          for path in root.glob('*.json'):
              json.loads(path.read_text())

          temp = Path(os.environ['RUNNER_TEMP'])
          seed1 = json.loads((temp / 'seed1_1500.json').read_text())
          seed2 = json.loads((temp / 'seed2_1500.json').read_text())
          seed1_long = json.loads((temp / 'seed1_12000.json').read_text())
          checkpoint = json.loads((temp / 'checkpoint_100.json').read_text())

          for report in (seed1, seed2, seed1_long, checkpoint):
              assert report['schema'] == (
                  'digital_cell_m2_checkpointable_lifeform_runtime_v3_developmental_polarity'
              )
              assert report['motor_failures'] == 0
              assert abs(report['world_n_conservation_error']) <= 1e-12
              assert abs(report['world_f_conservation_error']) <= 1e-12
              assert report['autonomous_resource_acquisition'] == 'NOT_ESTABLISHED'
              assert report['resource_causal_reproduction'] == 'NOT_ESTABLISHED'
              assert report['developmental_bootstrap_steps'] > 0
              assert report['developmental_initial_topology'] > 0
              assert report['developmental_initial_polarity_amplitude'] >= 0.0

          assert seed1['step'] == 1500
          assert seed2['step'] == 1500
          assert seed1_long['step'] == 12000
          assert checkpoint['step'] == 100
          assert seed2['fission_events'] >= 1
          assert seed2['living_count'] >= 2
          assert seed1_long['fission_events'] == 0
          assert checkpoint['developmental_initial_topology'] == 192
          print('developmental polarity runtime validation passed')
          PY

      - name: Hash runtime evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/m2-lifeform-runtime-v3-developmental-polarity \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/m2-lifeform-runtime-v3-developmental-polarity.sha256"

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: dc-dev-021-m2-runtime-developmental-polarity-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/m2-lifeform-runtime-v3-developmental-polarity/
            ${{ runner.temp }}/m2-lifeform-runtime-v3-developmental-polarity.sha256
