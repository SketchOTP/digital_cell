name: DC-M4 R3 conserved polarity substrate

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r3-prefission-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and diagnostic-only source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r2=66bba0a3f511ba6ebd048fa574d8a6d5ebc171ab
          git merge-base --is-ancestor "$r2" HEAD
          python3 - "$r2" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r3-conserved-polarity-substrate.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/crates/regulatory-core/src/lib.rs",
              "digital-protocell/crates/regulatory-core/src/polarity_mass.rs",
              "digital-protocell/examples/dcm4_r3_conserved_polarity_substrate.rs",
              "digital-protocell/experiments/dcm4_r3_conserved_polarity_substrate_verify.py",
              "digital-protocell/experiments/fixtures/dcm4r3/",
          )
          unexpected = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not unexpected, unexpected
          assert not any(path.startswith("digital-protocell/crates/chemistry-core/") for path in changed)
          assert not any(path.startswith("digital-protocell/crates/m2-lifeform-runtime/") for path in changed)
          print("R3 source scope passed")
          PY
          git diff --check

      - name: Format and syntax checks for R3 files
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check crates/regulatory-core/src/polarity_mass.rs examples/dcm4_r3_conserved_polarity_substrate.rs
          python3 -m py_compile experiments/dcm4_r3_conserved_polarity_substrate_verify.py

      - name: Run isolated substrate unit tests
        working-directory: digital-protocell
        run: cargo test -p regulatory-core polarity_mass --lib

      - name: Seal parameters before any held-out result
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          cargo run -q -p regulatory-core --example dcm4_r3_conserved_polarity_substrate -- \
            --stage seal --output "$run_root/parameter_seal.json"
          python3 experiments/dcm4_r3_conserved_polarity_substrate_verify.py \
            --repo . --output experiments/generated/dcm4r3conservedpolaritysubstrate \
            --stage seal --raw "$run_root/parameter_seal.json"

      - name: Qualify sealed isolated stability benchmark
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          test -s experiments/generated/dcm4r3conservedpolaritysubstrate/parameter_seal.json
          cargo run -q -p regulatory-core --example dcm4_r3_conserved_polarity_substrate -- \
            --stage benchmark --output "$run_root/benchmark.json"
          python3 experiments/dcm4_r3_conserved_polarity_substrate_verify.py \
            --repo . --output experiments/generated/dcm4r3conservedpolaritysubstrate \
            --stage benchmark --raw "$run_root/benchmark.json"

      - name: Execute and independently verify held-out Resource pattern gate
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          test -s experiments/generated/dcm4r3conservedpolaritysubstrate/parameter_seal.json
          test -s experiments/generated/dcm4r3conservedpolaritysubstrate/external_benchmark.json
          cargo run -q -p regulatory-core --example dcm4_r3_conserved_polarity_substrate -- \
            --stage heldout --output "$run_root/heldout.json"
          python3 experiments/dcm4_r3_conserved_polarity_substrate_verify.py \
            --repo . --output experiments/generated/dcm4r3conservedpolaritysubstrate \
            --stage heldout --raw "$run_root/heldout.json"

      - name: Enforce terminal classification and manifest
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcm4r3conservedpolaritysubstrate")
          qualification = json.loads((root / "qualification.json").read_text())
          benchmark = json.loads((root / "external_benchmark.json").read_text())
          verifier = json.loads((root / "independent_verifier.json").read_text())
          forbidden = json.loads((root / "forbidden_information_audit.json").read_text())
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert benchmark["pass"] is True, benchmark
          assert verifier["status"] == "PASS", verifier
          assert forbidden["status"] == "PASS", forbidden
          assert qualification["implementation_acceptance"] == "PASS", qualification
          assert qualification["scientific_acceptance"] == "PASS", qualification
          assert qualification["terminal_classification"] == "ROUTE_B_AUTONOMOUS_PREFISSION_MODE_GENERATION_DEMONSTRATED", qualification
          assert qualification["mechanical_coupling"] == "NOT_AUTHORIZED", qualification
          assert qualification["reproduction"] == "NOT_AUTHORIZED_NOT_REACHED", qualification
          assert qualification["next_execution_started"] is False, qualification
          assert manifest["file_count"] == len(manifest["files"]), manifest
          for relative, expected in manifest["files"].items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert actual == expected, (relative, actual, expected)
          print(json.dumps({"classification": qualification["terminal_classification"], "files": len(manifest["files"])}, sort_keys=True))
          PY
          git diff --check

      - name: Upload R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r3conservedpolaritysubstrate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcm4r3conservedpolaritysubstrate/
            digital-protocell/experiments/dcm4_r3_conserved_polarity_substrate_verify.py
            digital-protocell/experiments/fixtures/dcm4r3/held_out_resource_histories.json
