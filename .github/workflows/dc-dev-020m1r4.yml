name: DC-DEV-020-M1-R4 coupled-source candidate qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  coupled-source-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check \
            crates/regulatory-core/src/coupled_resource.rs \
            examples/dcdev020m1r4_coupled_source_candidate.rs
      - name: Verify bounded R4 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '17226fb7484eb50079c1c30ce9fd8039b3f23c60'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r4.yml',
              'digital-protocell/crates/regulatory-core/src/coupled_resource.rs',
              'digital-protocell/crates/regulatory-core/src/lib.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r4_coupled_source_candidate.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r4/coupled_source_candidate.md',
              'digital-protocell/experiments/generated/dcdev020m1r4/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r4/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r4/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r4/artifact_manifest.json',
          }
          unexpected = [path for path in changed if path not in allowed]
          assert not unexpected, f'unexpected R4 paths: {unexpected}'
          forbidden = [
              path for path in changed
              if any(token in path.lower() for token in (
                  'dcdev020m1r3', 'dc-dev-021', 'recycl', 'salvage',
                  'phase1-certifier/src/gates.rs', 'phase1-certifier/src/frozen.rs',
                  'phase1-certifier/src/runtime.rs', 'mesh_reactions.rs',
                  'mesh_transport.rs', 'mesh_mechanics.rs', 'mesh_fission.rs',
              ))
          ]
          assert not forbidden, f'forbidden R4 paths: {forbidden}'
          print('DCDEV020M1R4_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: |
          cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- \
            --output experiments/generated/dcdev020m1r4/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: |
          cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- \
            --output experiments/generated/dcdev020m1r4/ci/v2_d087
      - name: Fresh R4 coupled-source assay
        working-directory: digital-protocell
        env:
          DCDEV020M1R4_OUTPUT: experiments/generated/dcdev020m1r4/ci
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020m1r4_coupled_source_candidate --release --quiet
      - name: R3 starvation/topology preservation replay
        working-directory: digital-protocell
        env:
          DCDEV020M1R3_OUTPUT: experiments/generated/dcdev020m1r4/ci/r3_replay
        run: |
          mkdir -p experiments/generated/dcdev020m1r4/ci/r3_replay
          cp -R experiments/generated/dcdev020m1r4/ci/v3_d087 experiments/generated/dcdev020m1r4/ci/r3_replay/v3_d087
          cp -R experiments/generated/dcdev020m1r4/ci/v2_d087 experiments/generated/dcdev020m1r4/ci/r3_replay/v2_d087
          cargo +1.89.0 run -p regulatory-core --example dcdev020m1r3_ordinary_decay_candidate --release --quiet
      - name: Verify R4 artifacts and candidate qualification
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  print(f'::error title=R4 verifier::{message}')
                  raise SystemExit(1)

          base = Path('experiments/generated/dcdev020m1r4')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          v3 = json.loads((fresh / 'v3_d087/certification/report.json').read_text())
          v2 = json.loads((fresh / 'v2_d087/certification/report.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R4-COUPLED-SOURCE-CANDIDATE-001', f"directive={protocol.get('directive')}")
          require(protocol['starting_head'] == '17226fb7484eb50079c1c30ce9fd8039b3f23c60', f"starting_head={protocol.get('starting_head')}")
          require(protocol['coupled_source_schema'] == 'FINITE_SPATIAL_RESOURCE_COUPLED_ACTIVATION_V1', f"schema={protocol.get('coupled_source_schema')}")
          require(results['v1_semantics_unchanged'] is True, 'V1 replay preservation failed')
          require(all(control['pass'] for control in results['physical_controls']), 'physical control failed')
          baseline = results['v1_baseline']
          reference = results['source_capacity_reference']
          candidate = results['coupled_candidate']
          require(abs(baseline['organized_material_delta'] - (-9.200978427498057)) <= 1e-8, f"baseline_delta={baseline['organized_material_delta']}")
          require(abs(reference['organized_material_delta'] - 1.2571804904075918) <= 1e-8, f"reference_delta={reference['organized_material_delta']}")
          require(candidate['organized_material_delta'] >= -1e-8, f"candidate_delta={candidate['organized_material_delta']}")
          require(abs(candidate['organized_material_delta'] - reference['organized_material_delta']) <= 1e-8, 'candidate/reference mismatch')
          source = candidate['source']
          require(abs(source['n_world_loss'] - source['n_delivered']) <= 1e-8, 'N world closure failed')
          require(abs(source['f_world_loss'] - source['f_delivered']) <= 1e-8, 'F world closure failed')
          require(abs(source['paired_activated'] - source['a_produced_coupled']) <= 1e-8, 'coupled A stoichiometry failed')
          require(abs(source['paired_activated'] - source['w_produced_coupled']) <= 1e-8, 'coupled W stoichiometry failed')
          require(source['max_conservation_residual'] <= 1e-8, f"source_residual={source['max_conservation_residual']}")
          require(candidate['world_to_organism_closure_residual'] <= 1e-8, f"closure={candidate['world_to_organism_closure_residual']}")
          require(results['classification'] == 'M1_COUPLED_SOURCE_CANDIDATE_QUALIFIED', f"classification={results.get('classification')}")
          require(qualification['e0_authority'] is True, 'E0 failed')
          require(qualification['e1_physical_law'] is True, 'E1 failed')
          require(qualification['e3_nonnegative_organized_material_delta'] is True, 'E3 failed')
          require(qualification['e4_candidate_closure_and_d087'] is True, 'E4 failed')
          for report, contract in ((v3, 'ConservativeV3'), (v2, 'ConservativeV2')):
              require(report['mesh_contract'] == contract, f"mesh_contract={report.get('mesh_contract')}")
              require(report['reserve_enabled'] is False, f"reserve_enabled={report.get('reserve_enabled')}")
              require([report[f'gate{i}']['pass'] for i in range(8)] == [True] * 8, f"D087 gates failed for {contract}")
              require(report['primary_conclusion'] == 'D087_PHASE1_AUTOPOIETIC_PROTOCELL_CERTIFIED', f"D087 conclusion failed for {contract}")
          require(results['v1_chemistry_changed'] is False, 'V1 chemistry changed')
          require(results['v3_chemistry_changed'] is False, 'V3 chemistry changed')
          require(results['selected_production_changed'] is False, 'production selection changed')
          require(results['parameter_search'] is False, 'parameter search occurred')
          require(results['controller_added'] is False, 'controller added')
          require(results['recycling'] is False, 'recycling added')
          require(results['next_execution_started'] is False, 'next execution started')
          print('DCDEV020M1R4_ARTIFACT_AND_D087_VERIFICATION_PASS')
          PY
      - name: Regulatory-core coupled/V1 tests
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p regulatory-core coupled_resource -- --nocapture
      - name: Phase-1 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r4-coupled-source-candidate-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r4/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r4/results.json
            digital-protocell/experiments/generated/dcdev020m1r4/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r4/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r4/ci/v3_d087/certification/report.json
            digital-protocell/experiments/generated/dcdev020m1r4/ci/v2_d087/certification/report.json
          include-hidden-files: false
