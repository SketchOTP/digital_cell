name: DC-DEV-021 goal Route-B spatial material field

on:
  push:
    branches:
      - m2/dc-dev-021-routeb-spatial-material-field
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routeb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=3b6154fc260c7b52f1eb610975b883863107b54c
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          allowed = {
              '.github/workflows/dc-dev-021-goal-routeb-spatial-material-field.yml',
              'digital-protocell/crates/m2-lifeform-runtime/src/main.rs',
              'digital-protocell/crates/regulatory-core/src/lib.rs',
              'digital-protocell/crates/regulatory-core/src/spatial_material_field.rs',
              'digital-protocell/docs/routeb-spatial-material-field-replan.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines())
          prefix = 'digital-protocell/experiments/generated/routeb_spatial_material_field/'
          unexpected = {path for path in changed if path not in allowed and not path.startswith(prefix)}
          assert not unexpected, sorted(unexpected)
          forbidden = (
              'digital-protocell/crates/chemistry-core/src/',
              'digital-protocell/crates/phase1-certifier/src/',
              'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(path.startswith(forbidden) for path in changed)
          PY

      - name: Build and test Route-B field and runtime
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p regulatory-core spatial_material_field -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime

      - name: Run active and transfer-disabled Route-B controls
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --routeb-spatial-field --steps 3000 --seed 1 --report "$RUNNER_TEMP/active.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --routeb-spatial-field --transfer-disabled --steps 3000 --seed 1 \
            --report "$RUNNER_TEMP/disabled.json"

      - name: Validate bounded negative and evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('experiments/generated/routeb_spatial_material_field')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for item in manifest['evidence_files']:
              assert (root / item).is_file(), item
          for path in root.glob('*.json'):
              json.loads(path.read_text())

          temp = Path(os.environ['RUNNER_TEMP'])
          active = json.loads((temp / 'active.json').read_text())
          disabled = json.loads((temp / 'disabled.json').read_text())
          assert active['step'] == disabled['step'] == 3000
          assert active['resource_mode'] == disabled['resource_mode'] == 'SpatialMaterialFieldV1'
          assert active['resource_transfer_enabled'] is True
          assert disabled['resource_transfer_enabled'] is False
          assert active['cumulative_n_delivered'] > 0.0
          assert active['cumulative_f_delivered'] > 0.0
          assert abs(active['world_n_conservation_error']) <= 1e-12
          assert abs(active['world_f_conservation_error']) <= 1e-12
          assert disabled['cumulative_n_delivered'] == 0.0
          assert disabled['cumulative_f_delivered'] == 0.0
          assert active['fission_events'] == 0
          assert disabled['fission_events'] == 0
          assert active['resource_causal_reproduction'] == 'NOT_ESTABLISHED'
          assert disabled['resource_causal_reproduction'] == 'NOT_ESTABLISHED'
          assert active['autonomous_resource_acquisition'] == 'NOT_ESTABLISHED'
          assert disabled['autonomous_resource_acquisition'] == 'NOT_ESTABLISHED'
          print('Route-B bounded negative validation passed')
          PY

      - name: Hash and upload Route-B evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/routeb_spatial_material_field \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/routeb-spatial-material-field.sha256"

      - name: Upload Route-B evidence
        uses: actions/upload-artifact@v4
        with:
          name: dc-dev-021-goal-routeb-spatial-material-field-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/routeb_spatial_material_field/
            ${{ runner.temp }}/routeb-spatial-material-field.sha256
