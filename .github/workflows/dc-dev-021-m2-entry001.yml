name: DC-DEV-021 M2 ENTRY-001 activated-energy contractility

on:
  push:
    branches:
      - m2/dc-dev-021-entry001-activated-contractility
  pull_request:
    branches:
      - m2/dc-dev-021-entry001-activated-contractility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry001:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify M2 entry authority and scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor d76481c785e9eec361df3fa0cd03c512b521639c HEAD
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("digital-protocell/experiments/generated/dcdev020postm1baseline001/baseline_manifest.json").read_text())
          assert m["selected_contract"] == "MaturationCoupledV4"
          assert m["reserve_enabled"] is False
          assert m["m1"] == "CLOSED" and m["m1_physiology"] == "FROZEN"
          print("M1 baseline authority: MaturationCoupledV4 / reserve OFF")
          PY
          forbidden=$(git diff --name-only d76481c785e9eec361df3fa0cd03c512b521639c HEAD -- digital-protocell/crates/chemistry-core digital-protocell/crates/phase1-certifier)
          test -z "$forbidden"
          echo "chemistry-core and phase1-certifier are unchanged"

      - name: Build and test new M2 APIs
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core --lib -- --nocapture
          cargo +1.89.0 build -p regulatory-core --example dcdev021_m2_entry001

      - name: Run ENTRY-001 feasibility assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry001 -- "$RUNNER_TEMP/dcdev021m2entry001"
          python3 - "$RUNNER_TEMP/dcdev021m2entry001" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          q = json.loads((root / "qualification.json").read_text())
          s = json.loads((root / "stick_slip_feasibility.json").read_text())
          assert q["classification"] == "M2_ACTIVATED_ENERGY_CONTRACTILITY_FEASIBILITY_QUALIFIED", q
          assert q["m2_autonomous_resource_acquisition"] == "NOT_ESTABLISHED", q
          assert s["pass"] is True, s
          print("ENTRY-001 activated-energy contractility: QUALIFIED")
          PY

      - name: Verify production M1 and historical selectors
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build -p phase1-certifier --bin digital-protocell-phase1 --release
          cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/production.json"
          DCDEV020R9R3_CONTRACT=ConservativeV2 cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/v2.json"
          DCDEV020R9R3_CONTRACT=ConservativeV3 cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/v3.json"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.environ["RUNNER_TEMP"] + "/production.json"))
          v2 = json.load(open(os.environ["RUNNER_TEMP"] + "/v2.json"))
          v3 = json.load(open(os.environ["RUNNER_TEMP"] + "/v3.json"))
          assert p["mesh_contract"] == "MaturationCoupledV4" and p["reserve_enabled"] is False, p
          assert v2["mesh_contract"] == "ConservativeV2" and v2["reserve_enabled"] is False, v2
          assert v3["mesh_contract"] == "GeometryConservativeV3" and v3["reserve_enabled"] is False, v3
          print("production V4/reserve OFF and explicit V2/V3 selectors validated")
          PY

      - name: Preserve M1 qualification boundary
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
          run_canonical_d087() {
            local workspace="$1"
            local output="$2"
            mkdir -p "$output"
            (
              cd "$workspace/digital-protocell"
              DCDEV020R9R3_CONTRACT=ConservativeV2 DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output/ConservativeV2"
              DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output/ConservativeV3"
              DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output/MaturationCoupledV4"
            )
          }

          baseline_root="$RUNNER_TEMP/dcdev021-canonical-baseline"
          m2_root="$RUNNER_TEMP/dcdev021-canonical-m2"
          baseline_worktree="$RUNNER_TEMP/dcdev021-baseline-worktree"
          m2_head="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$baseline_worktree" d76481c785e9eec361df3fa0cd03c512b521639c
          run_canonical_d087 "$baseline_worktree" "$baseline_root"
          run_canonical_d087 "$GITHUB_WORKSPACE" "$m2_root"
          M2_HEAD="$m2_head" python3 - "$baseline_root" "$m2_root" "$RUNNER_TEMP/dcdev021m2entry001" <<'PY'
          import json, sys
          from pathlib import Path

          baseline_root, m2_root, evidence_root = map(Path, sys.argv[1:])
          evidence_root.mkdir(parents=True, exist_ok=True)
          expected = {
              "ConservativeV2": [True] * 8,
              "ConservativeV3": [True] * 8,
              "MaturationCoupledV4": [True, True, False, True, True, True, True, True],
          }
          selector_mapping = {
              "ConservativeV2": {
                  "DCDEV020R9R3_CONTRACT": "ConservativeV2",
                  "DCDEV020R9R3_RESERVE": "0",
                  "DCDEV020M1REPLAN002R1_V4": None,
              },
              "ConservativeV3": {
                  "DCDEV020R9R3_CONTRACT": "ConservativeV3",
                  "DCDEV020R9R3_RESERVE": "0",
                  "DCDEV020M1REPLAN002R1_V4": None,
              },
              "MaturationCoupledV4": {
                  "DCDEV020R9R3_CONTRACT": "ConservativeV3",
                  "DCDEV020R9R3_RESERVE": "0",
                  "DCDEV020M1REPLAN002R1_V4": "1",
              },
          }
          def read(root):
              reports = {}
              for name in expected:
                  report = json.loads((root / name / "manifest.json").read_text())
                  reports[name] = [report[f"gate{i}"]["pass"] for i in range(8)]
              return reports
          baseline = read(baseline_root)
          m2 = read(m2_root)
          assert baseline == expected, baseline
          assert m2 == expected, m2
          assert baseline == m2
          (evidence_root / "selector_semantics_audit.json").write_text(json.dumps({
              "schema": "dcdev021_m2_entry001_d087_selector_audit_v1",
              "canonical_mapping": selector_mapping,
              "unsupported_chemistry_selector": "MaturationCoupledV4",
              "unsupported_selector_resolution": "HistoricalV1",
              "v4_selection_authority": "DCDEV020M1REPLAN002R1_V4",
              "pass": True,
          }, indent=2) + "\n")
          (evidence_root / "prior_invalid_d087_evidence.json").write_text(json.dumps({
              "baseline_ci_33271509819": "INVALID_PRESERVATION_HARNESS_EVIDENCE",
              "entry001_ci_33278000813": "INVALID_PRESERVATION_HARNESS_EVIDENCE",
              "reason": "MaturationCoupledV4 was passed to DCDEV020R9R3_CONTRACT, which resolves unknown selector values as HistoricalV1.",
              "historical_records_rewritten": False,
          }, indent=2) + "\n")
          for name, reports, head in [
              ("baseline_d087_canonical.json", baseline, "d76481c785e9eec361df3fa0cd03c512b521639c"),
              ("m2_d087_canonical.json", m2, __import__("os").environ["M2_HEAD"]),
          ]:
              (evidence_root / name).write_text(json.dumps({
                  "head": head,
                  "selectors": selector_mapping,
                  "reports": reports,
                  "pass": reports == expected,
              }, indent=2) + "\n")
          print("canonical D-087 preservation boundary: V2 8/8, V3 8/8, V4 [true,true,false,true,true,true,true,true]")
          PY
          cp -a "$m2_root/ConservativeV2" "$RUNNER_TEMP/d087-ConservativeV2"
          cp -a "$m2_root/ConservativeV3" "$RUNNER_TEMP/d087-ConservativeV3"
          cp -a "$m2_root/MaturationCoupledV4" "$RUNNER_TEMP/d087-MaturationCoupledV4"

      - name: Preserve reusable downstream foundations
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/foundations"
          mkdir -p "$out"
          for spec in "dcdev002_gate_assay:regulator" "dcdev005_gate_assay:plasticity" "dcdev006_gate_assay:contact" "dcdev007_gate_assay:contact_regulation" "dcdev008_gate_assay:finite_resource" "dcdev011_gate_assay:traction"; do
            example="${spec%%:*}"; label="${spec##*:}"
            cargo +1.89.0 run -p regulatory-core --example "$example" -- "$out/$label"
          done
          cargo +1.89.0 test -p evolution-harness -- --nocapture
          test -d "$out/traction"
          echo "reusable regulator/plasticity/contact/resource/traction foundations preserved"

      - name: Upload compact ENTRY-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-entry001-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2entry001/
            ${{ runner.temp }}/dcdev021m2entry001/
            ${{ runner.temp }}/production.json
            ${{ runner.temp }}/v2.json
            ${{ runner.temp }}/v3.json
            ${{ runner.temp }}/d087-ConservativeV2/
            ${{ runner.temp }}/d087-ConservativeV3/
            ${{ runner.temp }}/d087-MaturationCoupledV4/
            ${{ runner.temp }}/dcdev021-canonical-baseline/
            ${{ runner.temp }}/dcdev021-canonical-m2/
            ${{ runner.temp }}/foundations/
          if-no-files-found: warn
