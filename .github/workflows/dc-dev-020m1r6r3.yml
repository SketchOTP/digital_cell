name: DC-DEV-020-M1-R6-R3 full-runtime M1 certification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  full-runtime-m1-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1r6r3_full_runtime_m1_certification.rs
      - name: Verify bounded R6-R3 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '0c56890d1f59c5dc2ffc66fd1d69181d7ca7b8c5'
          changed = subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r6r3.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r6r3_full_runtime_m1_certification.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r6r3/full_runtime_m1_certification.md',
              'digital-protocell/experiments/generated/dcdev020m1r6r3/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r3/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r3/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r3/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r3/artifact_manifest.json',
          }
          assert set(changed) <= allowed, f'unexpected R6-R3 paths: {sorted(set(changed) - allowed)}'
          forbidden = [path for path in changed if any(token in path.lower() for token in (
              'chemistry-core/src', 'mesh_reactions.rs', 'mesh_transport.rs',
              'mesh_mechanics.rs', 'mesh_fission.rs', 'phase1-certifier/src/gates.rs',
              'recycl', 'salvage', 'dc-dev-021',
          ))]
          assert not forbidden, f'forbidden R6-R3 paths: {forbidden}'
          print('DCDEV020M1R6R3_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r3/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r3/ci/v2_d087
      - name: Fresh full-runtime M1 certification
        working-directory: digital-protocell
        env:
          DCDEV020M1R6R3_OUTPUT: experiments/generated/dcdev020m1r6r3/ci
          DCDEV020M1R6R3_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1r6r3-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6r3_full_runtime_m1_certification --release --quiet
      - name: Verify compact evidence and fail-closed M1 gates
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f'R6-R3 verifier failure: {message}')

          base = Path('experiments/generated/dcdev020m1r6r3')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          preservation = json.loads((fresh / 'preservation.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R6-R3-FULL-RUNTIME-M1-CERTIFICATION-001', 'directive mismatch')
          require(protocol['starting_head'] == '0c56890d1f59c5dc2ffc66fd1d69181d7ca7b8c5', 'starting head mismatch')
          require(protocol['runtime_contract'] == {'material': 'GeometryConservativeV3', 'chemistry': 'ConservativeV3', 'reserve': 'OFF', 'transport': 'unchanged uncoupled V1 finite spatial transport', 'world': 'FINITE_SPATIAL_BACKING_RESERVOIR_V1'}, 'runtime identity mismatch')
          require(protocol['resource']['replenishment_events'] == 0, 'replenishment was enabled')
          require(protocol['stage_closure']['remesh_return_value_is_authority'] is False, 'remesh return was incorrectly authoritative')
          require(results['classification'] == 'M1_FULL_RUNTIME_HOMEOSTASIS_FAILED', f"unexpected classification={results['classification']}")
          require(results['fed_8000']['organized_material_delta'] < 0.0, 'fed homeostasis unexpectedly passed')
          require(results['fed_8000']['stage_closure_pass'] is True, 'fed stage closure failed')
          require(results['recovery']['no_state_reset'] is True, 'recovery reset state')
          require(results['recovery']['refed_organized_delta_from_deprived'] < 0.0, 'refeed did not preserve the negative result')
          require(results['zero_resource']['source']['n_delivered'] == 0.0 and results['zero_resource']['source']['f_delivered'] == 0.0, 'zero-resource delivery was nonzero')
          require(results['feed_then_remove']['source']['n_delivered'] == 0.0 and results['feed_then_remove']['source']['f_delivered'] == 0.0, 'post-removal delivery was nonzero')
          require(results['feed_then_remove']['organized_material_delta'] < 0.0, 'withdrawal did not deteriorate material')
          physical_loss_pass = results['physical_loss_pass'] is True
          if results['classification'] == 'M1_FULL_RUNTIME_CERTIFIED':
              require(physical_loss_pass, 'certified result did not reach physical loss')
          if physical_loss_pass:
              require(results['post_loss_refeed']['topology_recovered'] is False, 'topology recovered after refeed')
          else:
              require(results['post_loss_refeed']['exercised'] is False, 'post-loss refeed was exercised without physical loss')
          require(results['accounting_pass'] is True, 'stage accounting failed')
          require(results['preservation_pass'] is True, 'D-087 preservation failed')
          require(preservation['historical_v2_d087'] is True and preservation['candidate_v3_d087'] is True, 'D-087 reports were not 8/8')
          require(qualification['next_execution_started'] is False, 'next execution started')
          print('DCDEV020M1R6R3_ARTIFACT_AND_FAIL_CLOSED_GATE_VERIFICATION_PASS')
          PY
      - name: Geometry/material conservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r6r3-full-runtime-m1-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r6r3/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r3/ci/artifact_manifest.json
