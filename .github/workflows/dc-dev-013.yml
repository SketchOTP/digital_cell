name: DC-DEV-013 local resource-contact feeding

on:
  pull_request:
    branches:
      - strategy/dc-dev-011-local-stick-slip-traction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-013-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate frozen DC-DEV-013 contract and result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev013")
          required = ["protocol.json", "settled_body.json", "arm_results.json", "gate_results.json", "final_manifest.json"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing artifacts: {missing}")
          data = {name: json.loads((root / name).read_text()) for name in required}
          protocol = data["protocol.json"]
          final = data["final_manifest.json"]
          if protocol["entry_commit"] != "f9c6d4e83fc9dc50e4d2ec4004ea640084ce5732":
              raise SystemExit("wrong entry authority")
          if protocol["freeze_commit"] != "fa8a689adff8cbc3b981038c4812ebdc0623116c":
              raise SystemExit("wrong freeze commit")
          if protocol["settlement_steps"] != 5000 or protocol["accepted_steps"] != 480:
              raise SystemExit("formal horizon changed")
          if protocol["resource_center"] != [4.8, 0.0] or protocol["resource_radius"] != 1.5:
              raise SystemExit("resource geometry changed")
          if protocol["initial_n_mass"] != 3.0 or protocol["initial_f_mass"] != 3.0:
              raise SystemExit("resource inventory changed")
          if protocol["parameter_screening"] or protocol["geometry_screening"] or protocol["dcdev012_imported"]:
              raise SystemExit("forbidden screening/import enabled")
          if not data["settled_body.json"]["settled"]:
              raise SystemExit("settlement failed")
          if final["conclusion"] != "DCDEV013_RESOURCE_CONTACT_FEEDING_NOT_ESTABLISHED":
              raise SystemExit("unexpected conclusion")
          gates = data["gate_results.json"]
          if gates["gate_5_active_resource_acquisition_benefit"]["pass"]:
              raise SystemExit("Gate 5 must remain the negative result")
          if not gates["gate_7_resource_conservation"]["pass"] or not gates["gate_8_no_resource_specificity"]["pass"]:
              raise SystemExit("conservation or empty-sham control failed")
          if final.get("next_execution_started", False):
              raise SystemExit("next execution must remain stopped")
          production = Path("digital-protocell/crates/regulatory-core/src/spatial_resource.rs").read_text()
          assay = Path("digital-protocell/examples/dcdev013_gate_assay.rs").read_text()
          if "endogenous_polarity" in production.lower() or "endogenous_polarity" in assay.lower() or '"dcdev012_imported": true' in assay.lower():
              raise SystemExit("DC-DEV-012 implementation imported")
          print(f"validated {len(required)} DC-DEV-013 artifacts")
          PY
          changed="$(git diff --name-only f9c6d4e83fc9dc50e4d2ec4004ea640084ce5732 HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then
            echo "DC-DEV-013 may not modify chemistry-core"
            exit 1
          fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 --check crates/regulatory-core/src/lib.rs crates/regulatory-core/src/spatial_resource.rs examples/dcdev013_gate_assay.rs

      - name: Run DC-DEV-013 production tests and frozen assay
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core --lib -- --nocapture
          cargo +1.89.0 run -p regulatory-core --example dcdev013_gate_assay -- experiments/generated/dcdev013-ci

      - name: Preservation through DC-DEV-011
        working-directory: digital-protocell
        run: |
          tmp_dir="$(mktemp -d)"
          cargo +1.89.0 run -p regulatory-core --example dcdev002_gate_assay -- "$tmp_dir/dcdev002"
          cargo +1.89.0 run -p regulatory-core --example dcdev003_gate_assay -- "$tmp_dir/dcdev003"
          cargo +1.89.0 run -p regulatory-core --example dcdev004_gate_assay -- "$tmp_dir/dcdev004"
          cargo +1.89.0 run -p regulatory-core --example dcdev005_gate_assay -- "$tmp_dir/dcdev005"
          cargo +1.89.0 run -p regulatory-core --example dcdev006_gate_assay -- "$tmp_dir/dcdev006"
          cargo +1.89.0 run -p regulatory-core --example dcdev007_gate_assay -- "$tmp_dir/dcdev007"
          cargo +1.89.0 run -p regulatory-core --example dcdev008_gate_assay -- "$tmp_dir/dcdev008"
          cargo +1.89.0 run -p regulatory-core --example dcdev009_gate_assay -- "$tmp_dir/dcdev009"
          cargo +1.89.0 run -p regulatory-core --example dcdev011_gate_assay -- "$tmp_dir/dcdev011"

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
