name: DC-DEV-021 M2 ENTRY-011 frozen uptake metabolism composition

on:
  push:
    branches:
      - m2/dc-dev-021-entry011-frozen-metabolism-composition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry011-frozen-metabolism:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify ENTRY-010 authority and ENTRY-011 scope
        run: |
          set -euo pipefail
          start=729af274329e46ed439a7488e8c0d64c2151f662
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          forbidden=$(git diff --name-only "$start" HEAD -- \
            digital-protocell/crates/chemistry-core \
            digital-protocell/crates/phase1-certifier \
            digital-protocell/crates/regulatory-core/src/contractility.rs \
            digital-protocell/crates/regulatory-core/src/intrinsic_exploration.rs \
            digital-protocell/crates/regulatory-core/src/plasticity.rs \
            digital-protocell/crates/regulatory-core/src/spatial_resource.rs \
            digital-protocell/crates/regulatory-core/src/stick_slip_traction.rs)
          test -z "$forbidden"
          python3 - "$start" <<'PY'
          import subprocess, sys
          start = sys.argv[1]
          allowed = {
              ".github/workflows/dc-dev-021-m2-entry011.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcdev021_m2_entry011.rs",
              ".agent/CURRENT.md", ".agent/DIRECTIVES.md", ".agent/OUTCOMES.md",
              ".agent/LEARNINGS.md", ".agent/RECORD.md", ".agent/REPO_MAP.md",
          }
          prefix = "digital-protocell/experiments/generated/dcdev021m2entry011/"
          changed = subprocess.check_output(["git", "diff", "--name-only", start, "HEAD"], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed and not p.startswith(prefix)]
          assert not unexpected, unexpected
          print("ENTRY-010 authority, frozen sources, and ENTRY-011 scope verified")
          PY

      - name: Reproduce historical ENTRY-005 through ENTRY-010
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          for example in dcdev021_m2_entry005 dcdev021_m2_entry006 dcdev021_m2_entry007 dcdev021_m2_entry008 dcdev021_m2_entry009 dcdev021_m2_entry010; do
            cargo +1.89.0 build -p regulatory-core --example "$example"
          done
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry005 -- "$RUNNER_TEMP/entry005"
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry006 -- "$RUNNER_TEMP/entry006"
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry007 -- "$RUNNER_TEMP/entry007"
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry008 -- "$RUNNER_TEMP/entry008"
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry009 -- "$RUNNER_TEMP/entry009"
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry010 -- "$RUNNER_TEMP/entry010"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, math, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          def load(folder, name): return json.loads((root / folder / name).read_text())
          expected = {
              "entry005": "M2_REFRACTORY_MOTOR_DECOUPLING_EXPLORATION_QUALIFIED",
              "entry006": "M2_UNGUIDED_RESOURCE_ACQUISITION_NOT_ESTABLISHED",
              "entry007": "M2_UPTAKE_DEGRADATION_CONCENTRATION_FEEDBACK_CONFIRMED",
              "entry008": "M2_LOCAL_CONTACT_REFRACTORY_EXPLOITATION_UPTAKE_INSUFFICIENT",
              "entry009": "M2_CONTACT_LOCAL_SUPPRESSION_FAMILY_MECHANICALLY_INSUFFICIENT",
              "entry010": "M2_POST_INGESTIVE_MATERIAL_SIGNAL_SUBSTRATE_QUALIFIED",
          }
          for folder, classification in expected.items():
              assert load(folder, "qualification.json")["classification"] == classification
          assert math.isclose(load("entry006", "unguided_explorer.json")["cumulative_acquisition"], 0.2948669468973028, abs_tol=1e-12, rel_tol=0)
          assert math.isclose(load("entry009", "candidate_ceiling.json")["cumulative_acquisition"], 0.31794402180604237, abs_tol=1e-12, rel_tol=0)
          print("ENTRY-005 through ENTRY-010 preservation passed")
          PY

      - name: Execute ENTRY-011 observer composition
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build -p regulatory-core --example dcdev021_m2_entry011
          cargo +1.89.0 run -p regulatory-core --example dcdev021_m2_entry011 -- "$RUNNER_TEMP/entry011" "$RUNNER_TEMP/entry011-dense"
          python3 - "$RUNNER_TEMP/entry011" <<'PY'
          import json, math, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          def load(name): return json.loads((root / name).read_text())
          q = load("qualification.json")
          authority = load("frozen_metabolism_authority.json")
          activity = load("metabolic_activity.json")
          closure = load("end_to_end_material_closure.json")
          benefit = load("acquisition_benefit.json")
          force = load("uptake_driving_force.json")
          empty = load("empty_resource_control.json")
          contact = load("contact_no_transfer_control.json")
          forbidden = load("forbidden_information_audit.json")
          assert q["classification"] == "M2_FROZEN_UPTAKE_METABOLISM_COMPOSITION_QUALIFIED", q
          assert authority["api"].endswith("reactions_step_with_reserve_mode")
          assert authority["reserve_enabled"] is False and authority["reserve_mode"] == "Full"
          assert activity["active"] is True and closure["pass"] is True
          assert benefit["ten_percent_gate"] is True
          assert force["metabolism_reduces_nf_buildup"] is True
          assert empty["external_acquisition_zero"] is True
          assert contact["transfer_committed"] is False and contact["delivered_n"] == 0.0
          assert all(value is False for key, value in forbidden.items() if key != "forbidden_resource_information_read")
          print("ENTRY-011 frozen uptake/metabolism composition passed")
          PY

      - name: Preserve production selector and canonical D-087 boundary
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 build -p phase1-certifier --bin digital-protocell-phase1 --release
          DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/production.json"
          python3 - "$RUNNER_TEMP/production.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["mesh_contract"] == "MaturationCoupledV4" and report["reserve_enabled"] is False
          PY
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          expected = {"v2": [True] * 8, "v3": [True] * 8, "v4": [True, True, False, True, True, True, True, True]}
          observed = {}
          for name, vector in expected.items():
              report = json.loads((root / f"d087-{name}" / "manifest.json").read_text())
              observed[name] = [report[f"gate{i}"]["pass"] for i in range(8)]
              assert observed[name] == vector
          (root / "canonical_d087.json").write_text(json.dumps({"expected": expected, "observed": observed, "pass": True}, indent=2) + "\n")
          PY

      - name: Preserve downstream foundations and governance
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/foundations"; mkdir -p "$out"
          for spec in "dcdev002_gate_assay:regulator" "dcdev005_gate_assay:plasticity" "dcdev006_gate_assay:contact" "dcdev007_gate_assay:contact_regulation" "dcdev008_gate_assay:finite_resource" "dcdev011_gate_assay:traction"; do
            example="${spec%%:*}"; label="${spec##*:}"
            cargo +1.89.0 run -p regulatory-core --example "$example" -- "$out/$label"
          done
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
          python3 ../scripts/validate_governance.py --mode ADOPTED

      - name: Record artifact SHA-256
        if: always()
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2entry011 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2entry011.sha256"

      - name: Upload ENTRY-011 evidence and digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-entry011-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2entry011/
            ${{ runner.temp }}/entry005/
            ${{ runner.temp }}/entry006/
            ${{ runner.temp }}/entry007/
            ${{ runner.temp }}/entry008/
            ${{ runner.temp }}/entry009/
            ${{ runner.temp }}/entry010/
            ${{ runner.temp }}/entry011/
            ${{ runner.temp }}/entry011-dense/
            ${{ runner.temp }}/canonical_d087.json
            ${{ runner.temp }}/production.json
            ${{ runner.temp }}/d087-v2/
            ${{ runner.temp }}/d087-v3/
            ${{ runner.temp }}/d087-v4/
            ${{ runner.temp }}/foundations/
            ${{ runner.temp }}/dcdev021m2entry011.sha256
          if-no-files-found: warn
