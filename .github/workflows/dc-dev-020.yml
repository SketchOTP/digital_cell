name: DC-DEV-020 fast allosteric assimilation observer

on:
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-020-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate compact observer evidence and scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("digital-protocell/experiments/generated/dcdev020/observer")
          required = ["protocol.json", "results.json", "qualification.json"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing artifacts: {missing}")
          protocol = json.loads((root / "protocol.json").read_text())
          results = json.loads((root / "results.json").read_text())
          qualification = json.loads((root / "qualification.json").read_text())
          if protocol["entry_commit"] != "1e242f28152797b512e25cd56c7b718e45d6ca97":
              raise SystemExit("wrong entry authority")
          if protocol["settle_steps"] != 5000 or protocol["starvation_steps"] != 480 or protocol["feeding_steps"] != 480:
              raise SystemExit("observer horizon changed")
          if protocol["no_parameter_search"] is not True or protocol["production_integration"] != "forbidden_until_observer_gate_pass":
              raise SystemExit("observer scope changed")
          if results["observer_only"] is not True or results["production_behavior_changed"] or results["chemistry_behavior_changed"]:
              raise SystemExit("production behavior contamination")
          if results["gates"]["gate_1_source_actuation_and_conservation"] is not True:
              raise SystemExit("source conservation failed")
          if results["gates"]["gate_3_new_feedback_counterfactual_finite_feed"] is not False:
              raise SystemExit("negative observer disposition changed")
          if results["implementation_authorized"] is not False or qualification["implementation_authorized"] is not False:
              raise SystemExit("fail-closed implementation boundary changed")
          if qualification["classification"] != "DCDEV020_A_PRODUCT_FEEDBACK_COUNTERFACTUAL_NOT_ESTABLISHED":
              raise SystemExit("unexpected observer classification")
          print("validated DC-DEV-020 compact observer evidence")
          PY
          changed="$(git diff --name-only 1e242f28152797b512e25cd56c7b718e45d6ca97 HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then exit 1; fi
          if printf '%s\n' "$changed" | grep -Ei 'dcdev019|dc-dev-019|dcdev021|dc-dev-021'; then exit 1; fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 --check examples/dcdev020_fast_allosteric_assimilation.rs

      - name: Run DC-DEV-020 observer assay
        working-directory: digital-protocell
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020_fast_allosteric_assimilation --quiet

      - name: Regulatory-core regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p regulatory-core

      - name: D-017 historical regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d017_tests

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
