name: DC-FINAL-001-R5R1 strain-contrast terminal closure

on:
  push:
    branches: [codex/dc-final-001-r5r1-strain-contrast]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r5r1-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R5 authority and bounded scope
        run: |
          set -euo pipefail
          start=404dd374b8a75adc6b77a97c064b0197ab334628
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e fb471605034ec0bd5a5eacca89cbf0ebdd4b4aa6^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r5r1.yml',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r5r1_strain_contrast.rs',
              'digital-protocell/experiments/dcfinal001_r5r1_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r5r1/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '404dd374b8a75adc6b77a97c064b0197ab334628..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY
          gh run view 34332924972 --repo SketchOTP/digital_cell \
            --json conclusion,headSha --jq '.conclusion + " " + .headSha' \
            | grep '^success 404dd374b8a75adc6b77a97c064b0197ab334628$'
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr['state'] == 'OPEN'
          assert pr['isDraft'] is True
          assert pr['mergedAt'] is None
          assert pr['headRefOid'] == 'fb77f472b1519a9e0f713833efba5b1d403f4723'
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Run R5R1 localization and terminal reproduction qualification
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 check --locked -p regulatory-core \
            --example dcfinal001_r5_v4_neck \
            --example dcfinal001_r5r1_strain_contrast
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r5r1_strain_contrast \
            -- --output "$RUNNER_TEMP/r5r1.json"
          scientific_head=$(python3 - <<'PY'
          import json
          print(json.load(open('experiments/generated/dcfinal001r5r1/authority.json'))['result_scientific_head'])
          PY
          )
          python3 experiments/dcfinal001_r5r1_evidence.py \
            --head "$scientific_head" \
            --raw "$RUNNER_TEMP/r5r1.json" \
            --r5 experiments/generated/dcfinal001r5 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r5r1 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          raw = json.loads((root / 'r5r1.json').read_text())
          evidence = root / 'evidence'
          q = json.loads((evidence / 'qualification.json').read_text())
          controls = json.loads((evidence / 'contrast_controls.json').read_text())
          assert raw['qualification_horizon'] == 14778
          assert raw['localization_reclassification']['classification'] == 'SPATIALLY_NONUNIFORM_BUT_FUNCTIONALLY_DIFFUSE'
          assert raw['localization_reclassification']['all_observed_correlations_nonpositive'] is True
          assert raw['contrast_contract']['new_free_parameters'] == 0
          assert raw['contrast_contract']['new_thresholds'] == 0
          assert raw['contrast_contract']['new_state_variables'] == 0
          assert raw['campaigns']['passive']['geometry_valid_fissions'] == 3
          assert raw['campaigns']['passive']['simple_viable_daughter_pairs'] == 2
          assert raw['campaigns']['original_regulator']['geometry_valid_fissions'] == 4
          assert raw['campaigns']['original_regulator']['simple_viable_daughter_pairs'] == 1
          assert raw['campaigns']['contrast']['growth_qualified'] == 10
          assert raw['campaigns']['contrast']['geometry_valid_fissions'] == 3
          assert raw['campaigns']['contrast']['simple_viable_daughter_pairs'] == 3
          assert raw['active_energy_closure']['pass'] is True
          assert controls['motor_off_passive_parity'] is True
          assert controls['zero_a_active_work_eliminated'] is True
          assert raw['reproduction']['pass'] is False
          assert raw['evolution_execution'] == 'NOT_REACHED_GATE5_STOP'
          assert q['status'] == 'GOAL_AGENT_PROVISIONAL_TERMINAL_NEGATIVE'
          assert q['classification'] == 'V4_ROBUST_PHYSICAL_REPRODUCTION_NOT_ESTABLISHED'
          assert q['shutdown_recommended'] is True
          assert q['next_execution_started'] is False
          assert q['independent_architect_acceptance'] == 'PENDING'
          PY

      - name: Preserve M1, M2, lifecycle, and tests-only evolution surfaces
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --test r4_contract_topology_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime --bin digital-cell-final-lifeform -- --nocapture
          cargo +1.89.0 check --locked -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Upload exact-head R5R1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r5r1
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r5r1
            ${{ runner.temp }}/r5r1.json
