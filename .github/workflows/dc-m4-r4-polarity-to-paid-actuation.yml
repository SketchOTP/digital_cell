name: DC-M4 R4 polarity to paid actuation

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r4-polarity-actuation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r3=70f869bd90c48834e3fcd6e57d845eef99a09247
          git merge-base --is-ancestor "$r3" HEAD
          python3 - "$r3" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r4-polarity-to-paid-actuation.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/crates/regulatory-core/src/lib.rs",
              "digital-protocell/crates/regulatory-core/src/polarity_mass.rs",
              "digital-protocell/crates/regulatory-core/src/polarity_actuation.rs",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcfinal001_r5_v4_neck.rs",
              "digital-protocell/examples/dcm4_r4_polarity_paid_actuation.rs",
              "digital-protocell/experiments/dcm4_r4_polarity_paid_actuation_verify.py",
              "digital-protocell/experiments/generated/dcm4r4polaritypaidactuation/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          assert not any(path.startswith("digital-protocell/crates/chemistry-core/") for path in changed)
          assert not any(path.startswith("digital-protocell/crates/m2-lifeform-runtime/") for path in changed)
          print("R4 source scope passed")
          PY
          git diff --check

      - name: Format and syntax checks for R4 files
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check crates/regulatory-core/src/polarity_mass.rs
          rustfmt --edition 2021 --check crates/regulatory-core/src/polarity_actuation.rs
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r4_polarity_paid_actuation.rs
          python3 -m py_compile experiments/dcm4_r4_polarity_paid_actuation_verify.py

      - name: Run focused substrate and coupling tests
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo test --locked -q -p regulatory-core polarity_mass --lib
          cargo test --locked -q -p regulatory-core polarity_actuation --lib
          cargo check --locked -q -p regulatory-core --example dcm4_r4_polarity_paid_actuation

      - name: Seal the R4 coupling before held-out execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          cargo run --locked -q -p regulatory-core --example dcm4_r4_polarity_paid_actuation -- \
            --stage seal --output "$run_root/seal.json"
          python3 experiments/dcm4_r4_polarity_paid_actuation_verify.py \
            --repo . --output experiments/generated/dcm4r4polaritypaidactuation \
            --stage seal --raw "$run_root/seal.json"

      - name: Execute and independently verify ten matched Resource histories
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          test -s experiments/generated/dcm4r4polaritypaidactuation/coupling_raw_seal.json
          cargo run --locked --release -q -p regulatory-core --example dcm4_r4_polarity_paid_actuation -- \
            --stage qualification --output "$run_root/qualification.json"
          python3 experiments/dcm4_r4_polarity_paid_actuation_verify.py \
            --repo . --output experiments/generated/dcm4r4polaritypaidactuation \
            --stage qualification --raw "$run_root/qualification.json"
          sha256sum target/release/examples/dcm4_r4_polarity_paid_actuation \
            > experiments/generated/dcm4r4polaritypaidactuation/binary_sha256.txt
          python3 experiments/dcm4_r4_polarity_paid_actuation_verify.py \
            --repo . --output experiments/generated/dcm4r4polaritypaidactuation \
            --stage qualification --raw "$run_root/qualification.json"

      - name: Enforce R4 terminal classification and manifest
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcm4r4polaritypaidactuation")
          qualification = json.loads((root / "qualification.json").read_text())
          e2 = json.loads((root / "e2_pre_fission_morphogenesis.json").read_text())
          verifier = json.loads((root / "independent_verifier.json").read_text())
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert qualification["implementation_acceptance"] == "PASS", qualification
          assert qualification["scientific_acceptance"] == "BOUNDED_NEGATIVE", qualification
          assert qualification["terminal_classification"] == (
              "ROUTE_B_POLARITY_ACTUATION_FAILS_TO_GENERATE_MECHANICAL_MODES"
          ), qualification
          assert e2["e2_pass"] is False, e2
          assert e2["connected_new_growing_mode_arms"] == 3, e2
          assert e2["connected_lower_late_distance_arms"] == 9, e2
          assert verifier["status"] == "PASS", verifier
          assert qualification["e3"] == "NOT_REACHED", qualification
          assert qualification["e4"] == "NOT_REACHED", qualification
          assert qualification["next_execution_started"] is False, qualification
          assert manifest["file_count"] == len(manifest["files"]), manifest
          for relative, expected in manifest["files"].items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert actual == expected, (relative, actual, expected)
          print(json.dumps({
              "classification": qualification["terminal_classification"],
              "new_growing_mode_arms": e2["connected_new_growing_mode_arms"],
              "lower_distance_arms": e2["connected_lower_late_distance_arms"],
              "files": len(manifest["files"]),
          }, sort_keys=True))
          PY
          git diff --check

      - name: Upload exact-head R4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r4polaritypaidactuation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcm4r4polaritypaidactuation/
            digital-protocell/experiments/dcm4_r4_polarity_paid_actuation_verify.py
            digital-protocell/examples/dcm4_r4_polarity_paid_actuation.rs
            digital-protocell/target/release/examples/dcm4_r4_polarity_paid_actuation
