name: DC-M4 R7 full-cycle same-boundary coupled response identification

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r7-full-cycle-same-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and diagnostic-only source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r6=477bf84fc902244731ea85cb0c639459160587c0
          git merge-base --is-ancestor "$r6" HEAD
          python3 - "$r6" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r7-full-cycle-same-boundary.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcm4_r7_full_cycle_same_boundary.rs",
              "digital-protocell/experiments/dcm4_r7_full_cycle_same_boundary_verify.py",
              "digital-protocell/experiments/generated/dcm4r7fullcyclesameboundary/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          assert not any(path.startswith("digital-protocell/crates/chemistry-core/") for path in changed)
          assert not any(path.startswith("digital-protocell/crates/m2-lifeform-runtime/") for path in changed)
          print("R7 diagnostic-only source scope passed")
          PY
          git diff --check

      - name: Run focused R7 syntax and compile checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r7_full_cycle_same_boundary.rs
          python3 -m py_compile experiments/dcm4_r7_full_cycle_same_boundary_verify.py
          cargo check --locked -q -p regulatory-core --example dcm4_r7_full_cycle_same_boundary

      - name: Seal fixed checkpoints and reused R6 perturbation contract
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          cargo run --locked -q -p regulatory-core --example dcm4_r7_full_cycle_same_boundary -- \
            --stage seal --output "$run_root/seal.json"
          python3 experiments/dcm4_r7_full_cycle_same_boundary_verify.py \
            --repo . --raw "$run_root/seal.json" \
            --output experiments/generated/dcm4r7fullcyclesameboundary --stage seal
          test -s experiments/generated/dcm4r7fullcyclesameboundary/checkpoint_preregistration.json
          test -s experiments/generated/dcm4r7fullcyclesameboundary/perturbation_preregistration.json

      - name: Execute exact R7 full-cycle observer diagnostic
        working-directory: digital-protocell
        env:
          DCFINAL001_R10R9R5_CANONICAL: "1"
        run: |
          set -euo pipefail
          run_root="$(mktemp -d)"
          cargo run --locked --release -q -p regulatory-core --example dcm4_r7_full_cycle_same_boundary -- \
            --stage qualification --output "$run_root/qualification.json"
          mkdir -p experiments/generated/dcm4r7fullcyclesameboundary/raw
          cp "$run_root/qualification.json" \
            experiments/generated/dcm4r7fullcyclesameboundary/raw/qualification.json
          python3 experiments/dcm4_r7_full_cycle_same_boundary_verify.py \
            --repo . --raw experiments/generated/dcm4r7fullcyclesameboundary/raw/qualification.json \
            --output experiments/generated/dcm4r7fullcyclesameboundary --stage qualification
          sha256sum target/release/examples/dcm4_r7_full_cycle_same_boundary \
            > experiments/generated/dcm4r7fullcyclesameboundary/binary_sha256.txt
          python3 experiments/dcm4_r7_full_cycle_same_boundary_verify.py \
            --repo . --raw experiments/generated/dcm4r7fullcyclesameboundary/raw/qualification.json \
            --output experiments/generated/dcm4r7fullcyclesameboundary --stage qualification

      - name: Enforce R7 terminal decision and independent manifest
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcm4r7fullcyclesameboundary")
          qualification = json.loads((root / "qualification.json").read_text())
          decision = json.loads((root / "architecture_decision.json").read_text())
          verifier = json.loads((root / "independent_verifier.json").read_text())
          identity = json.loads((root / "full_cycle_replay_identity.json").read_text())
          response = json.loads((root / "full_cycle_response_operator.json").read_text())
          preservation = json.loads((root / "preservation.json").read_text())
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert qualification["implementation_acceptance"] == "PASS", qualification
          assert qualification["scientific_acceptance"] == "BOUNDED_INCONCLUSIVE", qualification
          assert qualification["terminal_classification"] == \
              "R4_FULL_CYCLE_RESPONSE_NONSMOOTH_OR_UNIDENTIFIABLE", qualification
          assert decision["classification"] == qualification["terminal_classification"], decision
          assert decision["successor"]["production_implementation_started"] is False, decision
          assert verifier["status"] == "PASS", verifier
          assert identity["exact_next_boundary_count"] == 60, identity
          assert identity["explicit_identity_count"] == 60, identity
          assert response["full_cycle_jacobian"] == "NOT_IDENTIFIED", response
          assert preservation["status"] == "PASS", preservation
          assert qualification["reproduction"] == "NOT_REACHED", qualification
          assert qualification["population_selection"] == "NOT_REACHED", qualification
          assert qualification["reversal"] == "NOT_REACHED", qualification
          assert qualification["next_execution_started"] is False, qualification
          assert manifest["file_count"] == len(manifest["files"]), manifest
          for relative, expected in manifest["files"].items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert actual == expected, (relative, actual, expected)
          print(json.dumps({
              "classification": qualification["terminal_classification"],
              "exact_next_boundaries": identity["exact_next_boundary_count"],
              "full_cycle_jacobian": response["full_cycle_jacobian"],
              "files": len(manifest["files"]),
          }, sort_keys=True))
          PY
          git diff --check

      - name: Upload exact-head R7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r7fullcyclesameboundary-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcm4r7fullcyclesameboundary/
            digital-protocell/experiments/dcm4_r7_full_cycle_same_boundary_verify.py
            digital-protocell/examples/dcm4_r7_full_cycle_same_boundary.rs
            digital-protocell/target/release/examples/dcm4_r7_full_cycle_same_boundary
