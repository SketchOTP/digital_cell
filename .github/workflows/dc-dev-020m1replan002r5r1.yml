name: DC-DEV-020-M1 REPLAN-002-R5-R1 zero-area and refeed semantics audit

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002r5r1_zero_area_closure_refeed_semantics_audit.rs
      - name: Verify bounded R5-R1 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = '0cdab2f5dcccfe6b7f41936e546b96ffe8df7c4b'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1replan002r5r1.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002r5r1_zero_area_closure_refeed_semantics_audit.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r5r1/dcdev020m1replan002r5r1_zero_area_closure_refeed_semantics_audit.md',
          }
          allowed |= {
              f'digital-protocell/experiments/generated/dcdev020m1replan002r5r1/{name}'
              for name in ('protocol.json', 'runtime_caller_audit.json',
                           'stage_closure_ledger_summary.json', 'first_failure.json',
                           'zero_area_attribution.json', 'checkpoint_validity.json',
                           'r4_impact.json', 'refeed_semantics.json',
                           'r5_compliance.json', 'preservation.json',
                           'qualification.json', 'artifact_manifest.json')
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R5-R1 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R5R1_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r1/ci/v2_d087
      - name: D-087 GeometryConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r1/ci/v3_d087
      - name: D-087 MaturationCoupledV4 reproduction
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r1/ci/v4_d087
      - name: R5-R1 stage closure audit
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R5R1_OUTPUT: experiments/generated/dcdev020m1replan002r5r1/ci
          DCDEV020M1REPLAN002R5R1_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r5r1-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r5r1_zero_area_closure_refeed_semantics_audit --release --quiet
      - name: Verify R5-R1 compact evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1replan002r5r1/ci')
          names = ('protocol.json', 'runtime_caller_audit.json',
                   'stage_closure_ledger_summary.json', 'first_failure.json',
                   'zero_area_attribution.json', 'checkpoint_validity.json',
                   'r4_impact.json', 'refeed_semantics.json',
                   'r5_compliance.json', 'preservation.json',
                   'qualification.json', 'artifact_manifest.json')
          for name in names:
              assert (base / name).is_file(), f'missing {base/name}'
          q = json.loads((base / 'qualification.json').read_text())
          f = json.loads((base / 'first_failure.json').read_text())
          a = json.loads((base / 'zero_area_attribution.json').read_text())
          cp = json.loads((base / 'checkpoint_validity.json').read_text())
          assert q['starting_head'] == '0cdab2f5dcccfe6b7f41936e546b96ffe8df7c4b'
          assert q['classification'] == 'M1_R5_ALTERNATE_CLOSURE_CAUSE_CONFIRMED'
          assert q['production_runtime_accepts_failed_mechanics_continuation'] is False
          assert q['r5_refeed_classification'] == 'SEALED_INTERNAL_DELIVERY_UPPER_BOUND'
          assert q['r5_no_direct_injection_requirement'] is False
          assert q['r5_physical_resource_opportunity_requirement'] is False
          assert q['r5_s3_s4_evidence_status'] == 'BOTH_POST_FAILURE_AND_INVALID_INTERVENTION'
          assert f['first_mechanics_false_step'] == 8566
          assert f['first_signed_area_nonpositive_step'] == 7675
          assert f['first_snapshot_accounting_area_zero_step'] == 8566
          assert a['zero_area_transition_explains_r5_max_residual'] is False
          assert a['r5_max_raw_residual_record']['absolute_step'] == 8177
          assert abs(a['r5_max_raw_residual_record']['signed_residual'] - 0.45051928554230614) < 1e-12
          assert cp['r5'][0]['validity'] == 'VALID_PRE_FAILURE'
          assert cp['r5'][1]['validity'] == 'VALID_PRE_FAILURE'
          assert cp['r5'][2]['validity'] == 'POST_INVALID_CONTINUATION'
          assert cp['r5'][3]['validity'] == 'POST_INVALID_CONTINUATION'
          assert q['scientific_core_diff'] == 'NONE'
          assert q['next_execution_started'] is False
          print('DCDEV020M1REPLAN002R5R1_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: R5-R1 focused tests and preservation
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r5r1_zero_area_closure_refeed_semantics_audit -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r4_v4_contract_aware_preservation -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r5r1-zero-area-refeed-semantics-audit
          path: digital-protocell/experiments/generated/dcdev020m1replan002r5r1/ci/**/*.json
