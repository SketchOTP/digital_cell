name: DC-DEV-020-M1 REPLAN-002-R5-R4 admissible-boundary no-resurrection

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002r5r4_v4_admissible_boundary_no_resurrection.rs
      - name: Verify bounded R5-R4 diff
        run: |
          python3 - <<'PY'
          import subprocess
          start = '4c6a0020be887f66ea6cfab661ce570c730f7d90'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md',
              '.github/workflows/dc-dev-020m1replan002r5r4.yml',
              'digital-protocell/Cargo.lock',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002r5r4_v4_admissible_boundary_no_resurrection.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r5r4/dcdev020m1replan002r5r4_v4_admissible_boundary_no_resurrection.md',
          }
          allowed |= {
              f'digital-protocell/experiments/generated/dcdev020m1replan002r5r4/{name}'
              for name in ('protocol.json', 'results.json', 'qualification.json',
                           'preservation.json', 'artifact_manifest.json')
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R5-R4 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R5R4_BOUNDED_DIFF_PASS')
          PY
      - name: V2 D-087 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r4/ci/v2_d087
      - name: V3 D-087 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r4/ci/v3_d087
      - name: V4 D-087 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5r4/ci/v4_d087
      - name: R5-R4 admissible-boundary qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R5R4_OUTPUT: experiments/generated/dcdev020m1replan002r5r4
          DCDEV020M1REPLAN002R5R4_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r5r4-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r5r4_v4_admissible_boundary_no_resurrection --release --quiet
      - name: Verify compact R5-R4 evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('experiments/generated/dcdev020m1replan002r5r4')
          names = ('protocol.json', 'results.json', 'qualification.json',
                   'preservation.json', 'artifact_manifest.json')
          for name in names:
              assert (root / name).is_file(), f'missing {root/name}'
          q = json.loads((root / 'qualification.json').read_text())
          r = json.loads((root / 'results.json').read_text())
          assert q['starting_head'] == '4c6a0020be887f66ea6cfab661ce570c730f7d90'
          assert q['classification'] == 'M1_V4_ADMISSIBLE_BOUNDARY_IRREVERSIBLE_DEATH_QUALIFIED'
          assert q['direct_unconditional_internal_nf_insertion'] is False
          assert q['spatial_exposure_required'] is False
          assert q['all_intact_edges_eligible'] is True
          assert q['membrane_permeability_used'] is True
          assert q['current_edge_length_used'] is True
          assert q['current_interior_concentration_used'] is True
          assert q['source_never_exceeded_r1_cap'] is True
          assert q['starvation_closure'] is True
          assert q['s0_refeed_closure'] is True
          assert q['s1_refeed_closure'] is True
          assert q['s2_refeed_closure'] is True
          assert q['s0']['recovery'] is True
          assert q['s2']['resource_entered'] is True
          assert q['s2']['recovery'] is False
          assert q['v2_d087'] is True
          assert q['v3_d087'] is True
          assert q['v4_d087'] == [True, True, False, True, True, True, True, True]
          assert r['next_execution_started'] is False
          print('DCDEV020M1REPLAN002R5R4_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: Focused preservation tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r5r4_v4_admissible_boundary_no_resurrection -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r5r4-v4-admissible-boundary
          path: digital-protocell/experiments/generated/dcdev020m1replan002r5r4/**/*.json
