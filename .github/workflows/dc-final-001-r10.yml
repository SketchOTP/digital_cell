name: DC-FINAL-001-R10 signed load-bearing neck stress

on:
  push:
    branches: [codex/dc-final-001-r10-signed-stress]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r10-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R9 authority and bounded scope
        run: |
          set -euo pipefail
          start=42ec99f1eac5f302aa501a8168429c62d6045680
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e c553f8717342dedbf3f408108a7294037a84920e^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r10.yml',
              'digital-protocell/crates/chemistry-core/src/mesh_fission.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r10_evolution.rs',
              'digital-protocell/examples/dcfinal001_r10_signed_stress.rs',
              'digital-protocell/examples/dcfinal001_r10_signed_stress_audit.rs',
              'digital-protocell/examples/dcfinal001_r4_evolution.rs',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/experiments/dcfinal001_r10_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r10/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '42ec99f1eac5f302aa501a8168429c62d6045680..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY
          gh run view 34410520058 --repo SketchOTP/digital_cell \
            --json conclusion,headSha --jq '.conclusion + " " + .headSha' \
            | grep '^success 42ec99f1eac5f302aa501a8168429c62d6045680$'
          gh pr view 44 --repo SketchOTP/digital_cell \
            --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr == {
              'state': 'OPEN', 'isDraft': True, 'mergedAt': None,
              'headRefOid': 'fb77f472b1519a9e0f713833efba5b1d403f4723',
          }, pr
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.89.0 rustfmt

      - name: Replay R10 signed stress, reproduction, and evolution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10_signed_stress_audit -- --output "$RUNNER_TEMP/r10-audit.json"
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10_signed_stress -- --output "$RUNNER_TEMP/r10-reproduction.json"
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10_evolution -- --output "$RUNNER_TEMP/r10-evolution.json"
          scientific_head=$(python3 - <<'PY'
          import json
          print(json.load(open('experiments/generated/dcfinal001r10/authority.json'))['result_scientific_head'])
          PY
          )
          mkdir -p "$RUNNER_TEMP/validation"
          cp experiments/generated/dcfinal001r10/m1_preservation.json "$RUNNER_TEMP/validation/placeholder.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'validation', 'summary.json').write_text(json.dumps({
              'status': 'PASS',
              'd087': {
                  'v2': [True] * 8,
                  'v3': [True] * 8,
                  'v4': [True, True, False, True, True, True, True, True],
              },
          }, indent=2) + '\n')
          PY
          python3 experiments/dcfinal001_r10_evidence.py \
            --head "$scientific_head" \
            --audit "$RUNNER_TEMP/r10-audit.json" \
            --reproduction "$RUNNER_TEMP/r10-reproduction.json" \
            --evolution "$RUNNER_TEMP/r10-evolution.json" \
            --validation "$RUNNER_TEMP/validation/summary.json" \
            --r9 experiments/generated/dcfinal001r9 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r10 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          audit = json.loads((root / 'r10-audit.json').read_text())
          reproduction = json.loads((root / 'r10-reproduction.json').read_text())
          evolution = json.loads((root / 'r10-evolution.json').read_text())
          assert audit['classification'] == 'V4_SCISSION_TENSILE_ONLY_STRESS_MISMATCH_CONFIRMED'
          assert audit['seed_7_compression_candidate'] == 'PASS'
          assert audit['seed_10_compression_candidate'] == 'PASS'
          assert audit['counterfactual_daughters'] == 'PASS'
          assert reproduction['legacy_r9_control_pass'] is True
          assert reproduction['legacy_r9_control']['geometry_valid_fissions'] == 5
          assert reproduction['legacy_r9_control']['simple_viable_daughter_pairs'] == 5
          assert reproduction['signed_stress_counts']['geometry_valid_fissions'] == 7
          assert reproduction['signed_stress_counts']['full_state_viable_daughter_pairs'] == 6
          assert reproduction['robust_v4_reproduction'] is True
          on = [row for row in evolution['campaigns'] if row['mutation_enabled']]
          off = [row for row in evolution['campaigns'] if not row['mutation_enabled']]
          assert sum(row['ledger']['mutation_opportunities'] for row in on) == 1800
          assert sum(row['ledger']['mutations'] for row in on) == 18
          assert sum(row['ledger']['mutations'] for row in off) == 0
          assert max(row['terminal']['maximum_generation'] for row in on) == 1
          assert all(row['terminal']['mean_genotype'] == row['initial']['mean_genotype'] for row in on)
          PY

      - name: Preserve M1, M2, lifecycle, and tests-only evolution surfaces
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p regulatory-core -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test r8_v4_closure_consistency_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test r4_contract_topology_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime --bin digital-cell-final-lifeform -- --nocapture
          cargo +1.89.0 check --locked -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Validate formatting and evidence manifest
        run: |
          set -euo pipefail
          rustfmt +1.89.0 --edition 2021 --check \
            digital-protocell/crates/chemistry-core/src/mesh_fission.rs \
            digital-protocell/examples/dcfinal001_r4_evolution.rs \
            digital-protocell/examples/dcfinal001_r5_v4_neck.rs \
            digital-protocell/examples/dcfinal001_r10_evolution.rs \
            digital-protocell/examples/dcfinal001_r10_signed_stress.rs \
            digital-protocell/examples/dcfinal001_r10_signed_stress_audit.rs
          python3 -m py_compile digital-protocell/experiments/dcfinal001_r10_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('digital-protocell/experiments/generated/dcfinal001r10')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY

      - name: Upload exact-head R10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r10
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r10
            ${{ runner.temp }}/r10-audit.json
            ${{ runner.temp }}/r10-reproduction.json
            ${{ runner.temp }}/r10-evolution.json
