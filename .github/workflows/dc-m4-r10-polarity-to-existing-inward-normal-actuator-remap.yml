name: DC-M4 R10 polarity to existing inward-normal actuator remap

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r10-normal-remap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R9 authority and R10 source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r9=00a7a26f1c5e23b8b9895de7ba1c71c51b2dbbc4
          git merge-base --is-ancestor "$r9" HEAD
          python3 - "$r9" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r10-polarity-to-existing-inward-normal-actuator-remap.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcfinal001_r5_v4_neck.rs",
              "digital-protocell/examples/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap.rs",
              "digital-protocell/experiments/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap_verify.py",
              "digital-protocell/experiments/generated/dcm4r10polaritynormalremap/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Run focused implementation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap.rs
          python3 -m py_compile experiments/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap_verify.py
          cargo test --locked -q -p regulatory-core --lib
          cargo check --locked -q -p regulatory-core --example dcm4_r10_polarity_to_existing_inward_normal_actuator_remap

      - name: Seal R10 actuator contract before fixed-snapshot execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          mkdir -p experiments/generated/dcm4r10polaritynormalremap/raw
          cargo run --locked -q -p regulatory-core --example dcm4_r10_polarity_to_existing_inward_normal_actuator_remap -- \
            --stage seal --output /tmp/dcm4_r10_seal.json
          python3 experiments/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap_verify.py \
            --repo . --raw /tmp/dcm4_r10_seal.json \
            --output experiments/generated/dcm4r10polaritynormalremap --stage seal

      - name: Execute fixed R8 P_TO_M remap qualification
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo run --locked --release -q -p regulatory-core --example dcm4_r10_polarity_to_existing_inward_normal_actuator_remap -- \
            --stage qualification \
            --output experiments/generated/dcm4r10polaritynormalremap/raw/qualification.json

      - name: Independently verify R10 E2 and seal artifact
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 experiments/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r10polaritynormalremap/raw/qualification.json \
            --output experiments/generated/dcm4r10polaritynormalremap \
            --stage qualification
          sha256sum target/release/examples/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap \
            > experiments/generated/dcm4r10polaritynormalremap/binary_sha256.txt
          python3 experiments/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r10polaritynormalremap/raw/qualification.json \
            --output experiments/generated/dcm4r10polaritynormalremap \
            --stage qualification
          git diff --check

      - name: Confirm downstream stages were not started
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("experiments/generated/dcm4r10polaritynormalremap")
          qualification = json.loads((root / "qualification.json").read_text())
          assert qualification["reproduction"] == "NOT_REACHED"
          assert qualification["population_selection"] == "NOT_REACHED"
          assert qualification["reversal"] == "NOT_REACHED"
          assert qualification["final_integration"] == "NOT_REACHED"
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert manifest["exact_head"] == subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert manifest["file_count"] >= 8
          PY

      - name: Upload R10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r10polaritynormalremap-${{ github.sha }}
          if-no-files-found: error
          path: |
            digital-protocell/experiments/generated/dcm4r10polaritynormalremap/
            digital-protocell/experiments/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap_verify.py
            digital-protocell/examples/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap.rs
            digital-protocell/target/release/examples/dcm4_r10_polarity_to_existing_inward_normal_actuator_remap
