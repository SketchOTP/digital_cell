name: DC-M4 R8 nonlinear mechanochemical causal-edge decomposition

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r8-causal-edge-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R7 authority and R8 source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r7=73d2e420da8a704926ebdd47e0d0b76dd63d2fbb
          git merge-base --is-ancestor "$r7" HEAD
          python3 - "$r7" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r8-nonlinear-mechanochemical-causal-edge.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcm4_r8_nonlinear_mechanochemical_causal_edge.rs",
              "digital-protocell/experiments/dcm4_r8_nonlinear_mechanochemical_causal_edge_verify.py",
              "digital-protocell/experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Run focused implementation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r8_nonlinear_mechanochemical_causal_edge.rs
          python3 -m py_compile experiments/dcm4_r8_nonlinear_mechanochemical_causal_edge_verify.py
          cargo test --locked -q -p regulatory-core --lib
          cargo check --locked -q -p regulatory-core --example dcm4_r8_nonlinear_mechanochemical_causal_edge

      - name: Seal R8 contract before response execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          mkdir -p experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/raw
          cargo run --locked -q -p regulatory-core --example dcm4_r8_nonlinear_mechanochemical_causal_edge -- \
            --stage seal --output /tmp/dcm4_r8_seal.json
          python3 experiments/dcm4_r8_nonlinear_mechanochemical_causal_edge_verify.py \
            --repo . --raw /tmp/dcm4_r8_seal.json \
            --output experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge --stage seal

      - name: Execute clone-local R8 response diagnostics
        working-directory: digital-protocell
        env:
          DCFINAL001_R8_CAPTURE_ONLY: "1"
        run: |
          set -euo pipefail
          cargo run --locked --release -q -p regulatory-core --example dcm4_r8_nonlinear_mechanochemical_causal_edge -- \
            --stage qualification \
            --output experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/raw/qualification.json

      - name: Independently verify R8 raw response and seal evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 experiments/dcm4_r8_nonlinear_mechanochemical_causal_edge_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/raw/qualification.json \
            --output experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge \
            --stage qualification
          sha256sum target/release/examples/dcm4_r8_nonlinear_mechanochemical_causal_edge \
            > experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/binary_sha256.txt
          python3 experiments/dcm4_r8_nonlinear_mechanochemical_causal_edge_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/raw/qualification.json \
            --output experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge \
            --stage qualification
          git diff --check

      - name: Confirm no downstream experiment ran
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge")
          qualification = json.loads((root / "qualification.json").read_text())
          assert qualification["reproduction"] == "NOT_REACHED"
          assert qualification["population_selection"] == "NOT_REACHED"
          assert qualification["reversal"] == "NOT_REACHED"
          assert qualification["final_integration"] == "NOT_REACHED"
          assert qualification["global_jacobian"] == "NOT_CONSTRUCTED"
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert manifest["file_count"] >= 12
          assert manifest["exact_head"] == __import__("subprocess").check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          PY

      - name: Upload R8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r8nonlinearmechanochemicalcausaledge-${{ github.sha }}
          if-no-files-found: error
          path: |
            digital-protocell/experiments/generated/dcm4r8nonlinearmechanochemicalcausaledge/
            digital-protocell/experiments/dcm4_r8_nonlinear_mechanochemical_causal_edge_verify.py
            digital-protocell/examples/dcm4_r8_nonlinear_mechanochemical_causal_edge.rs
            digital-protocell/target/release/examples/dcm4_r8_nonlinear_mechanochemical_causal_edge
