name: DC-DEV-020-M1 age-structured turnover feasibility

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  age-structured-turnover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan001_age_structured_structural_turnover_feasibility.rs
      - name: Verify bounded diagnostic diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = 'f537bc064030d6f336608488935620e2f9256322'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1replan001.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan001_age_structured_structural_turnover_feasibility.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan001/age_structured_structural_turnover_feasibility.md',
              'digital-protocell/experiments/generated/dcdev020m1replan001/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1replan001/results.json',
              'digital-protocell/experiments/generated/dcdev020m1replan001/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1replan001/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1replan001/artifact_manifest.json',
          }
          unexpected = changed - allowed
          assert not unexpected, f'unexpected diagnostic paths: {sorted(unexpected)}'
          print('DCDEV020M1REPLAN001_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan001/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan001/ci/v3_d087
      - name: Run age-structured qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN001_OUTPUT: experiments/generated/dcdev020m1replan001/ci
          DCDEV020M1REPLAN001_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan001-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan001_age_structured_structural_turnover_feasibility --release --quiet
      - name: Run focused age-state tests
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan001_age_structured_structural_turnover_feasibility -- --nocapture
      - name: Verify compact evidence
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f'DC-DEV-020-M1-REPLAN-001 verifier failure: {message}')

          base = Path('experiments/generated/dcdev020m1replan001')
          ci = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, ci):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((ci / 'protocol.json').read_text())
          results = json.loads((ci / 'results.json').read_text())
          qualification = json.loads((ci / 'qualification.json').read_text())
          preservation = json.loads((ci / 'preservation.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['starting_head'] == 'f537bc064030d6f336608488935620e2f9256322', 'starting head mismatch')
          require(protocol['observer_only'] is True and protocol['next_execution_started'] is False, 'observer boundary changed')
          require(results['classification'] in {
              'M1_AGE_STRUCTURED_TURNOVER_FEASIBILITY_CONFIRMED',
              'M1_AGE_STRUCTURED_TURNOVER_HOMEOSTASIS_RECOVERY_ONLY',
              'M1_AGE_STRUCTURED_TURNOVER_INSUFFICIENT',
              'M1_AGE_STRUCTURED_TURNOVER_INVALID',
          }, 'classification outside directive list')
          require(abs(results['arms']['A']['organized_material_delta'] - 0.34214067689040917) <= 1e-8, 'frozen control changed')
          require(abs(results['arms']['B']['organized_material_delta'] + 9.954959206543336) <= 1e-8, 'moving control changed')
          require(abs(results['arms']['C']['organized_material_delta'] + 1.7633945824468071) <= 1e-8, 'age shadow changed')
          require(results['checks']['controls_reproduce'], 'control reproduction failed')
          require(results['checks']['age_identity'] and results['checks']['material_closure'], 'identity/closure failed')
          require(results['checks']['damage_preservation'], 'damage preservation failed')
          require(results['checks']['recovery'] and results['checks']['starvation_decline'], 'recovery/starvation checks failed')
          require(preservation['v2_d087'] and preservation['v3_d087'], 'D-087 preservation failed')
          require(qualification['observer_only'] and qualification['e0_authority'] and qualification['e1_material_identity_and_lineage'], 'qualification boundary failed')
          print('DCDEV020M1REPLAN001_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: GC conservation preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution harness preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan001-age-structured-turnover-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1replan001/protocol.json
            digital-protocell/experiments/generated/dcdev020m1replan001/results.json
            digital-protocell/experiments/generated/dcdev020m1replan001/qualification.json
            digital-protocell/experiments/generated/dcdev020m1replan001/preservation.json
            digital-protocell/experiments/generated/dcdev020m1replan001/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1replan001/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1replan001/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1replan001/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1replan001/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1replan001/ci/artifact_manifest.json
