name: DC-DEV-009 motility feasibility audit

on:
  pull_request:
    branches:
      - strategy/dc-dev-008-spatial-resource-acquisition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-009-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate DC-DEV-009 boundary and evidence
        env:
          ENTRY_COMMIT: 79751bed5ad78d367b7409f0ec677e32a3b9d527
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev009")
          required = [
              "protocol.json", "force_accounting.json", "matched_arms.json",
              "step_ledger.json", "artifact_analysis.json",
              "environment_coupling_inventory.json", "governance_boundary.json",
              "final_manifest.json",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing artifacts: {missing}")
          data = {name: json.loads((root / name).read_text()) for name in required}
          protocol = data["protocol.json"]
          final = data["final_manifest.json"]
          assay = Path("digital-protocell/examples/dcdev009_gate_assay.rs").read_text()
          if protocol["entry_commit"] != "79751bed5ad78d367b7409f0ec677e32a3b9d527":
              raise SystemExit("wrong entry commit")
          if protocol["assay_horizon_steps"] != 240 or protocol["assay_horizon_simulated_time"] != 4.8:
              raise SystemExit("audit horizon changed")
          if not protocol["fixed_topology"] or protocol["topology_size"] != 24:
              raise SystemExit("fixed-topology contract changed")
          forbidden = [
              "new_actuator", "new_friction", "new_adhesion", "new_fluid_physics",
              "navigation", "resource_seeking", "dcdev010_started",
          ]
          if any(protocol[key] for key in forbidden):
              raise SystemExit("forbidden capability enabled")
          if "mechanics_step_from_forces" in assay or re.search(r"mesh\.vertices\[[^\n]+\]\s*=", assay):
              raise SystemExit("assay appears to write production coordinates")
          if final["conclusion"] != "DCDEV009_MOTILITY_FEASIBILITY_AUDIT_COMPLETE":
              raise SystemExit("unexpected audit conclusion")
          if final["scientific_finding"] != "DCDEV009_EXISTING_FREE_SPACE_MOTILITY_NOT_ESTABLISHED":
              raise SystemExit("unexpected scientific finding")
          if final["next_execution_started"] is not False:
              raise SystemExit("next execution must remain stopped")
          accounting = data["force_accounting.json"]
          if accounting["active_contractile_force_vector_sum_max_norm"] > 1e-10:
              raise SystemExit("contractile force sum exceeded tolerance")
          if accounting["motor_off_contractile_force_vector_sum_max_norm"] != 0.0:
              raise SystemExit("motor-off arm applied contractility")
          arms = data["matched_arms.json"]
          if not arms["regulatory_trajectory_identical"] or not arms["fixed_topology"]:
              raise SystemExit("matched-arm identity failed")
          if arms["active_minus_control_displacement_norm"] <= 1e-10:
              raise SystemExit("artifact audit did not retain apparent displacement")
          if arms["active_minus_control_displacement_norm"] - arms["active_minus_control_material_displacement_norm"] > 1e-12:
              raise SystemExit("body/material centroid disagreement exceeded tolerance")
          if data["artifact_analysis.json"]["contractile_only_centroid_displacement"] > 1e-10:
              raise SystemExit("contractility-only centroid displacement exceeded tolerance")
          if not data["artifact_analysis.json"]["centroid_change_is_not_classified_as_locomotion"]:
              raise SystemExit("artifact rule missing")
          print(f"validated {len(required)} DC-DEV-009 artifacts")
          PY
          changed="$(git diff --name-only "$ENTRY_COMMIT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then
            echo "DC-DEV-009 may not modify chemistry-core"
            exit 1
          fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 --check examples/dcdev009_gate_assay.rs

      - name: Run DC-DEV-009 audit
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core --example dcdev009_gate_assay --no-run
          cargo +1.89.0 run -p regulatory-core --example dcdev009_gate_assay -- experiments/generated/dcdev009

      - name: Preservation assays through DC-DEV-008
        working-directory: digital-protocell
        run: |
          tmp_dir="$(mktemp -d)"
          cargo +1.89.0 run -p regulatory-core --example dcdev002_gate_assay -- "$tmp_dir/dcdev002"
          cargo +1.89.0 run -p regulatory-core --example dcdev003_gate_assay -- "$tmp_dir/dcdev003"
          cargo +1.89.0 run -p regulatory-core --example dcdev004_gate_assay -- "$tmp_dir/dcdev004"
          cargo +1.89.0 run -p regulatory-core --example dcdev005_gate_assay -- "$tmp_dir/dcdev005"
          cargo +1.89.0 run -p regulatory-core --example dcdev006_gate_assay -- "$tmp_dir/dcdev006"
          cargo +1.89.0 run -p regulatory-core --example dcdev007_gate_assay -- "$tmp_dir/dcdev007"
          cargo +1.89.0 run -p regulatory-core --example dcdev008_gate_assay -- "$tmp_dir/dcdev008"

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
