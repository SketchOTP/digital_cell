name: DC-DEV-020-M1 REPLAN-002-R1 V4 candidate qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check \
            examples/dcdev020m1replan002r1_maturation_coupled_production_candidate.rs \
            crates/chemistry-core/src/material_mesh.rs \
            crates/chemistry-core/src/mesh_contracts.rs \
            crates/chemistry-core/src/mesh_fission.rs \
            crates/chemistry-core/src/mesh_growth.rs \
            crates/chemistry-core/src/mesh_mechanics.rs \
            crates/chemistry-core/src/mesh_reactions.rs \
            crates/chemistry-core/src/mesh_topology.rs \
            crates/phase1-certifier/src/runtime.rs \
            crates/phase1-certifier/src/sim.rs
      - name: Verify bounded R1 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = '4becff4fff7d096c70468b759ace09f747c4eb56'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md',
              '.github/workflows/dc-dev-020m1replan002r1.yml',
              'digital-protocell/Cargo.lock',
              'digital-protocell/crates/chemistry-core/src/material_mesh.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_contracts.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_fission.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_growth.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_mechanics.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_reactions.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_topology.rs',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/crates/phase1-certifier/src/runtime.rs',
              'digital-protocell/crates/phase1-certifier/src/sim.rs',
              'digital-protocell/examples/dcdev020m1r6r7_reference_geometry_coupling_decision.rs',
              'digital-protocell/examples/dcdev020m1replan001_age_structured_structural_turnover_feasibility.rs',
              'digital-protocell/examples/dcdev020m1replan002_maturation_coupled_load_bearing_feasibility.rs',
              'digital-protocell/examples/dcdev020m1replan002r1_maturation_coupled_production_candidate.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r1/dcdev020m1replan002r1_maturation_coupled_production_candidate.md',
              'digital-protocell/experiments/generated/dcdev020m1replan002r1/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r1/results.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r1/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r1/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002r1/artifact_manifest.json',
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R1 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R1_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r1/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r1/ci/v3_d087
      - name: D-087 MaturationCoupledV4 qualification
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r1/ci/v4_d087
      - name: Run V4 qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R1_OUTPUT: experiments/generated/dcdev020m1replan002r1/ci
          DCDEV020M1REPLAN002R1_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r1-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate --release --quiet
      - name: Run V4 focused tests
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate -- --nocapture
      - name: Verify compact R1 evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1replan002r1')
          ci = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, ci):
              for name in names:
                  assert (root / name).is_file(), f'missing {root/name}'
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((ci / 'protocol.json').read_text())
          results = json.loads((ci / 'results.json').read_text())
          qualification = json.loads((ci / 'qualification.json').read_text())
          preservation = json.loads((ci / 'preservation.json').read_text())
          assert fresh_protocol == protocol, 'fresh protocol differs from committed protocol'
          assert protocol['starting_head'] == '4becff4fff7d096c70468b759ace09f747c4eb56'
          assert protocol['observer_only_qualification'] is True
          assert protocol['next_execution_started'] is False
          assert abs(results['fed']['final_state']['organized_material'] - results['fed']['initial']['organized_material'] - 1.33231221701902) <= 1e-8
          assert qualification['shadow_parity'] is True
          assert qualification['fed_homeostasis'] is True
          assert qualification['recovery'] is True
          assert qualification['starvation_decline'] is True
          assert qualification['material_closure'] is True
          assert preservation['v2_d087'] is True and preservation['v3_d087'] is True
          assert preservation['v4_d087'] is False
          report = json.loads((ci / 'v4_d087/certification/report.json').read_text())
          assert report['mesh_contract'] == 'MaturationCoupledV4'
          assert [report[f'gate{i}']['pass'] for i in range(8)] == [True, False, False, True, True, True, True, True]
          assert results['classification'] == 'M1_MATURATION_COUPLED_PRODUCTION_PRESERVATION_REGRESSION'
          print('DCDEV020M1REPLAN002R1_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: Geometry/material preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution-harness preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r1-maturation-coupled-production-candidate-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1replan002r1/protocol.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/results.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/qualification.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/preservation.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1replan002r1/ci/artifact_manifest.json
