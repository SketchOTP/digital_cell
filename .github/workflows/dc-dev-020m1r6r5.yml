name: DC-DEV-020-M1-R6-R5 embodied sink causal decomposition

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  embodied-sink-causal-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1r6r5_embodied_sink_causal_decomposition.rs
      - name: Verify bounded R6-R5 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '48ac1da5c6af6a9157d482d6fffecd32ee6e82c8'
          changed = subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r6r5.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r6r5_embodied_sink_causal_decomposition.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r6r5/embodied_sink_causal_decomposition.md',
              'digital-protocell/experiments/generated/dcdev020m1r6r5/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r5/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r5/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r5/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r5/artifact_manifest.json',
          }
          assert set(changed) <= allowed, f'unexpected R6-R5 paths: {sorted(set(changed) - allowed)}'
          print('DCDEV020M1R6R5_BOUNDED_DIFF_PASS')
          PY
      - name: Reproduce accepted R6-R4 arm
        working-directory: digital-protocell
        env:
          DCDEV020M1R6R4_OUTPUT: ${{ runner.temp }}/dcdev020m1r6r4
          DCDEV020M1R6R4_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1r6r4-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6r4_homeostasis_contact_audit --release --quiet
      - name: Verify R6-R4 reproduction
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads((Path('${{ runner.temp }}') / 'dcdev020m1r6r4' / 'results.json').read_text())
          assert abs(result['actual_fed']['organized_material_delta'] - (-82.9654506509167)) <= 1e-8
          assert abs(result['contact_upper_bound']['organized_material_delta'] - (-17.494772207126488)) <= 1e-8
          print('DCDEV020M1R6R4_REPRODUCTION_PASS')
          PY
      - name: Actual D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r5/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r5/ci/v2_d087
      - name: Run R6-R5 qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1R6R5_OUTPUT: experiments/generated/dcdev020m1r6r5/ci
          DCDEV020M1R6R5_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1r6r5-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6r5_embodied_sink_causal_decomposition --release --quiet
      - name: Verify R6-R5 compact evidence
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f'R6-R5 verifier failure: {message}')

          base = Path('experiments/generated/dcdev020m1r6r5')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          preservation = json.loads((fresh / 'preservation.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R6-R5-EMBODIED-SINK-CAUSAL-DECOMPOSITION-001', 'directive mismatch')
          require(protocol['starting_head'] == '48ac1da5c6af6a9157d482d6fffecd32ee6e82c8', 'starting head mismatch')
          require(protocol['runtime'] == {'material': 'GeometryConservativeV3', 'chemistry': 'ConservativeV3', 'reserve': 'OFF', 'dt': 0.02}, 'runtime identity mismatch')
          require(protocol['resource']['center'] == [4.8, 0.0] and protocol['resource']['radius'] == 1.5, 'resource geometry changed')
          require(protocol['resource']['replenishment_events'] == 0, 'replenishment enabled')
          require(results['classification'] in {
              'M1_EMBODIED_SINK_A_DECAY_DOMINANT',
              'M1_EMBODIED_SINK_CATALYST_TURNOVER_DOMINANT',
              'M1_EMBODIED_SINK_STRUCTURAL_TURNOVER_DOMINANT',
              'M1_EMBODIED_SINK_SOURCE_PROFILE_DOMINANT',
              'M1_EMBODIED_SINK_MIXED',
              'M1_EMBODIED_SINK_CAUSE_UNRESOLVED',
          }, 'classification outside directive list')
          require(results['actual_moving']['organized_material_delta'] == -82.9654506509167, 'actual R6 result changed')
          require(abs(results['geometry_frozen']['organized_material_delta'] - 0.34214067689040917) <= 1e-8, 'frozen reference changed')
          require(abs(results['contact_upper_bound']['organized_material_delta'] - (-17.494772207126488)) <= 1e-8, 'contact-upper result changed')
          require(abs(results['matched_source_static_frozen_schedule']['organized_material_delta'] - 0.34214067689040917) <= 1e-8, 'matched frozen static changed')
          require(results['matched_source_static']['organized_material_delta'] < 0.0, 'matched contact-upper static did not test source profile')
          require(results['matched_source_moving']['organized_material_delta'] < 0.0, 'matched moving arm unexpectedly passed')
          require(results['organized_sink_identity'] is True, 'organized sink identity failed')
          require(results['preservation_pass'] is True, 'D-087 preservation failed')
          require(len(results['single_sink_knockouts']) == 3, 'single knockout set incomplete')
          require(results['pairwise_arms_exercised'] is False, 'pairwise gate should be conditional')
          for arm_name in ('actual_moving', 'geometry_frozen', 'contact_upper_bound', 'matched_source_static', 'matched_source_static_frozen_schedule', 'matched_source_moving'):
              require(results[arm_name]['closure']['max_organized_identity_residual'] <= 1e-8, f'{arm_name} identity closure failed')
              require(results[arm_name]['closure']['max_strict_residual'] <= 1e-8, f'{arm_name} strict closure failed')
              if results[arm_name]['source_steps']:
                  require(results[arm_name]['n_remaining'] >= -1e-8 and results[arm_name]['f_remaining'] >= -1e-8, f'{arm_name} shadow inventory negative')
          require(qualification['observer_only'] is True, 'observer-only boundary missing')
          require(qualification['next_execution_started'] is False, 'next execution started')
          require(results['production_changed'] is False and results['parameter_search'] is False, 'production/search boundary changed')
          require(results['recycling_salvage_added'] is False and results['target_size_or_homeostat_added'] is False, 'forbidden mechanism added')
          require(preservation['historical_v2_d087'] is True and preservation['candidate_v3_d087'] is True, 'D-087 reports were not certified')
          print('DCDEV020M1R6R5_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: Geometry/material preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution harness preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r6r5-embodied-sink-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r6r5/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r5/ci/artifact_manifest.json
