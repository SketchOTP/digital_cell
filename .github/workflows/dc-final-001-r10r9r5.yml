name: DC-FINAL-001-R10R9R5 lifecycle and evidence recovery

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r10r9r5-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and bounded scope
        run: |
          set -euo pipefail
          start=a835937b18a7b634704657e948e217c8205e38cf
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - <<'PY'
          import subprocess
          start = 'a835937b18a7b634704657e948e217c8205e38cf'
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r10r9r5.yml',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/crates/chemistry-core/src/d096_allocation.rs',
              'digital-protocell/crates/chemistry-core/tests/d096_tests.rs',
              'digital-protocell/examples/dcfinal001_r4_evolution.rs',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r10r9r5_evolution.rs',
              'digital-protocell/examples/dcfinal001_r10r9r5_contract_tests.rs',
              'digital-protocell/examples/dcfinal001_r10r9r5_shared_kernel_reproduction.rs',
              'digital-protocell/examples/dcfinal001_r10r9r5_reproduction_equivalence.rs',
              'digital-protocell/experiments/dcfinal001_r10r9r5_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r10r9r5/',
          )
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{start}..HEAD'], text=True).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Run focused compile and preservation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -q -p chemistry-core --test d091_tests --no-fail-fast
          cargo +1.89.0 test --locked -q -p chemistry-core --test d096_tests --no-fail-fast
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r4_evolution
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r5_evolution
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r5_contract_tests
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r5_shared_kernel_reproduction
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r5_reproduction_equivalence

      - name: Run executable R5 lifecycle boundary controls
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            DCFINAL001_R10R9R5_CANONICAL=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r5_contract_tests

      - name: Run shared current-kernel reproduction qualification
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            DCFINAL001_R10R9R5_CANONICAL=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r5_shared_kernel_reproduction

      - name: Run matched reproduction-equivalence diagnostics
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            DCFINAL001_R10R9R5_CANONICAL=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r5_reproduction_equivalence

      - name: Run executable evidence-verifier fixtures
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/dcfinal001_r10r9r5_evidence.py
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('r5evidence', 'experiments/dcfinal001_r10r9r5_evidence.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          results = module.run_adversarial_fixtures()
          assert all(row.get('pass', row.get('recognized_nonneutral', False)) for row in results.values())
          PY
          git diff --check

      - name: Upload R5 repair controls
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r10r9r5-repair-controls
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/dcfinal001_r10r9r5_contract_tests.json
            /tmp/dcfinal001_r10r9r5_shared_kernel_reproduction.json
            /tmp/dcfinal001_r10r9r5_reproduction_equivalence.json
