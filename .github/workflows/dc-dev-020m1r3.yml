name: DC-DEV-020-M1-R3 ordinary-decay candidate qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  ordinary-decay-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check \
            crates/chemistry-core/src/mesh_reactions.rs \
            crates/chemistry-core/src/mesh_contracts.rs \
            crates/chemistry-core/src/mesh_growth.rs \
            crates/phase1-certifier/src/sim.rs \
            examples/dcdev020m1r3_ordinary_decay_candidate.rs
      - name: Verify bounded R3 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '1622b664a4a37b8a0ac4ea51fbc97ca71f9d853c'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r3.yml',
              'digital-protocell/crates/chemistry-core/src/mesh_reactions.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_contracts.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_growth.rs',
              'digital-protocell/crates/phase1-certifier/src/sim.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r3_ordinary_decay_candidate.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r3/ordinary_decay_candidate.md',
              'digital-protocell/experiments/generated/dcdev020m1r3/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r3/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r3/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r3/artifact_manifest.json',
          }
          unexpected = [path for path in changed if path not in allowed]
          assert not unexpected, f'unexpected R3 paths: {unexpected}'
          forbidden = [
              path for path in changed
              if any(token in path.lower() for token in (
                  'dcdev020m1r2', 'dc-dev-021', 'recycl', 'salvage',
                  'phase1-certifier/src/gates.rs', 'phase1-certifier/src/frozen.rs',
                  'phase1-certifier/src/runtime.rs',
              ))
          ]
          assert not forbidden, f'forbidden downstream or certifier-boundary paths: {forbidden}'
          print('DCDEV020M1R3_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 candidate
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- \
          --output experiments/generated/dcdev020m1r3/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- \
          --output experiments/generated/dcdev020m1r3/ci/v2_d087
      - name: Fresh ordinary-decay candidate assay
        working-directory: digital-protocell
        env:
          DCDEV020M1R3_OUTPUT: experiments/generated/dcdev020m1r3/ci
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020m1r3_ordinary_decay_candidate --release --quiet
      - name: Verify R3 artifacts and candidate qualification
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1r3')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  assert (root / name).is_file(), f'missing {root/name}'
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          v3 = json.loads((fresh / 'v3_d087/certification/report.json').read_text())
          v2 = json.loads((fresh / 'v2_d087/certification/report.json').read_text())
          assert fresh_protocol == protocol
          assert protocol['directive'] == 'DC-DEV-020-M1-R3-ORDINARY-DECAY-CANDIDATE-001'
          assert protocol['starting_head'] == '1622b664a4a37b8a0ac4ea51fbc97ca71f9d853c'
          assert protocol['candidate']['mesh_chemistry_schema'] == 'ConservativeV3'
          assert protocol['candidate']['physical_mesh_contract'] == 'ConservativeV2'
          assert protocol['candidate']['k_a_decay'] == 0.008
          assert protocol['candidate']['starvation_multiplier'] == 1.0
          assert results['classification'] == 'M1_ORDINARY_DECAY_CANDIDATE_QUALIFIED'
          assert results['conservative_v2_semantics_changed'] is False
          assert results['selected_production_changed'] is False
          eq = results['ordinary_starvation_equivalence']
          assert eq['v2_first_rupture_step'] == 124717
          assert eq['v3_first_rupture_step'] == 124717
          assert eq['v2_observer_collapse_step'] == eq['v3_observer_collapse_step']
          assert eq['pass'] is True
          cap = results['source_capacity_v3']
          assert abs(cap['organized_material_delta'] - 1.25718049040759) <= 1e-8
          assert cap['world_to_organism_closure_residual'] <= 1e-8
          assert results['v3_refeed_ordinary']['closed_intact_after'] is False
          assert results['v3_refeed_source_capacity']['closed_intact_after'] is False
          for report, contract in ((v3, 'ConservativeV3'), (v2, 'ConservativeV2')):
              assert report['mesh_contract'] == contract
              assert report['reserve_enabled'] is False
              assert [report[f'gate{i}']['pass'] for i in range(8)] == [True] * 8
              assert report['primary_conclusion'] == 'D087_PHASE1_AUTOPOIETIC_PROTOCELL_CERTIFIED'
          assert qualification['e0_authority_and_v2_preservation'] is True
          assert qualification['e1_version_isolation'] is True
          assert qualification['e2_causal_ordinary_starvation_equivalence'] is True
          assert qualification['e3_source_capacity_without_decay_compensation'] is True
          assert qualification['e4_v3_d087'] is True
          assert qualification['e4_v2_d087_preservation'] is True
          assert qualification['e4_internal_material_closure'] is True
          assert qualification['next_execution_started'] is False
          print('DCDEV020M1R3_ARTIFACT_AND_D087_VERIFICATION_PASS')
          PY
      - name: Phase-1 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r3-ordinary-decay-candidate-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r3/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r3/results.json
            digital-protocell/experiments/generated/dcdev020m1r3/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r3/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r3/ci/v3_d087/certification/report.json
            digital-protocell/experiments/generated/dcdev020m1r3/ci/v2_d087/certification/report.json
          include-hidden-files: false
