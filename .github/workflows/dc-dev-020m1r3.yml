name: DC-DEV-020-M1-R3 ordinary-decay candidate qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  ordinary-decay-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check \
            crates/chemistry-core/src/mesh_reactions.rs \
            crates/chemistry-core/src/mesh_contracts.rs \
            crates/chemistry-core/src/mesh_growth.rs \
            crates/phase1-certifier/src/sim.rs \
            examples/dcdev020m1r3_ordinary_decay_candidate.rs
      - name: Verify bounded R3 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '1622b664a4a37b8a0ac4ea51fbc97ca71f9d853c'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r3.yml',
              'digital-protocell/crates/chemistry-core/src/mesh_reactions.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_contracts.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_growth.rs',
              'digital-protocell/crates/phase1-certifier/src/sim.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r3_ordinary_decay_candidate.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r3/ordinary_decay_candidate.md',
              'digital-protocell/experiments/generated/dcdev020m1r3/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r3/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r3/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r3/artifact_manifest.json',
          }
          unexpected = [path for path in changed if path not in allowed]
          assert not unexpected, f'unexpected R3 paths: {unexpected}'
          forbidden = [
              path for path in changed
              if any(token in path.lower() for token in (
                  'dcdev020m1r2', 'dc-dev-021', 'recycl', 'salvage',
                  'phase1-certifier/src/gates.rs', 'phase1-certifier/src/frozen.rs',
                  'phase1-certifier/src/runtime.rs',
              ))
          ]
          assert not forbidden, f'forbidden downstream or certifier-boundary paths: {forbidden}'
          print('DCDEV020M1R3_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 candidate
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- \
          --output experiments/generated/dcdev020m1r3/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- \
          --output experiments/generated/dcdev020m1r3/ci/v2_d087
      - name: Fresh ordinary-decay candidate assay
        working-directory: digital-protocell
        env:
          DCDEV020M1R3_OUTPUT: experiments/generated/dcdev020m1r3/ci
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020m1r3_ordinary_decay_candidate --release --quiet
      - name: Verify R3 artifacts and candidate qualification
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  Path('r3_verifier_failure.txt').write_text(message + '\n', encoding='utf-8')
                  print(f'::error title=R3 verifier::{message}')
                  raise SystemExit(1)

          base = Path('experiments/generated/dcdev020m1r3')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          v3 = json.loads((fresh / 'v3_d087/certification/report.json').read_text())
          v2 = json.loads((fresh / 'v2_d087/certification/report.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R3-ORDINARY-DECAY-CANDIDATE-001', f"directive={protocol.get('directive')}")
          require(protocol['starting_head'] == '1622b664a4a37b8a0ac4ea51fbc97ca71f9d853c', f"starting_head={protocol.get('starting_head')}")
          require(protocol['candidate']['mesh_chemistry_schema'] == 'ConservativeV3', f"candidate_schema={protocol['candidate'].get('mesh_chemistry_schema')}")
          require(protocol['candidate']['physical_mesh_contract'] == 'ConservativeV2', f"physical_contract={protocol['candidate'].get('physical_mesh_contract')}")
          require(protocol['candidate']['k_a_decay'] == 0.008, f"k_a_decay={protocol['candidate'].get('k_a_decay')}")
          require(protocol['candidate']['starvation_multiplier'] == 1.0, f"starvation_multiplier={protocol['candidate'].get('starvation_multiplier')}")
          require(results['classification'] == 'M1_ORDINARY_DECAY_CANDIDATE_QUALIFIED', f"classification={results.get('classification')}")
          require(results['conservative_v2_semantics_changed'] is False, f"conservative_v2_semantics_changed={results.get('conservative_v2_semantics_changed')}")
          require(results['selected_production_changed'] is False, f"selected_production_changed={results.get('selected_production_changed')}")
          eq = results['ordinary_starvation_equivalence']
          require(eq['v2_first_rupture_step'] == 124717, f"v2_first_rupture_step={eq.get('v2_first_rupture_step')}")
          require(eq['v3_first_rupture_step'] == 124717, f"v3_first_rupture_step={eq.get('v3_first_rupture_step')}")
          require(eq['v2_observer_collapse_step'] == eq['v3_observer_collapse_step'], f"collapse_steps={eq.get('v2_observer_collapse_step')}/{eq.get('v3_observer_collapse_step')}")
          require(eq['pass'] is True, f"equivalence_pass={eq.get('pass')}")
          cap = results['source_capacity_v3']
          require(abs(cap['organized_material_delta'] - 1.25718049040759) <= 1e-8, f"organized_delta={cap.get('organized_material_delta')}")
          require(cap['world_to_organism_closure_residual'] <= 1e-8, f"closure_residual={cap.get('world_to_organism_closure_residual')}")
          require(results['v3_refeed_ordinary']['closed_intact_after'] is False, f"ordinary_refeed_closed={results['v3_refeed_ordinary'].get('closed_intact_after')}")
          require(results['v3_refeed_source_capacity']['closed_intact_after'] is False, f"capacity_refeed_closed={results['v3_refeed_source_capacity'].get('closed_intact_after')}")
          for report, contract in ((v3, 'ConservativeV3'), (v2, 'ConservativeV2')):
              require(report['mesh_contract'] == contract, f"mesh_contract={report.get('mesh_contract')} expected={contract}")
              require(report['reserve_enabled'] is False, f"reserve_enabled={report.get('reserve_enabled')} contract={contract}")
              require([report[f'gate{i}']['pass'] for i in range(8)] == [True] * 8, f"d087_gates={[report[f'gate{i}']['pass'] for i in range(8)]} contract={contract}")
              require(report['primary_conclusion'] == 'D087_PHASE1_AUTOPOIETIC_PROTOCELL_CERTIFIED', f"d087_conclusion={report.get('primary_conclusion')} contract={contract}")
          require(qualification['e0_authority_and_v2_preservation'] is True, f"e0={qualification.get('e0_authority_and_v2_preservation')}")
          require(qualification['e1_version_isolation'] is True, f"e1={qualification.get('e1_version_isolation')}")
          require(qualification['e2_causal_ordinary_starvation_equivalence'] is True, f"e2={qualification.get('e2_causal_ordinary_starvation_equivalence')}")
          require(qualification['e3_source_capacity_without_decay_compensation'] is True, f"e3={qualification.get('e3_source_capacity_without_decay_compensation')}")
          require(qualification['e4_v3_d087'] is True, f"e4_v3={qualification.get('e4_v3_d087')}")
          require(qualification['e4_v2_d087_preservation'] is True, f"e4_v2={qualification.get('e4_v2_d087_preservation')}")
          require(qualification['e4_internal_material_closure'] is True, f"e4_closure={qualification.get('e4_internal_material_closure')}")
          require(qualification['next_execution_started'] is False, f"next_execution_started={qualification.get('next_execution_started')}")
          print('DCDEV020M1R3_ARTIFACT_AND_D087_VERIFICATION_PASS')
          PY
      - name: Capture R3 verifier diagnostic
        if: failure()
        id: verifier_diagnostic
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f r3_verifier_failure.txt ]]; then
            code="$(tr -cs '[:alnum:]' '_' < r3_verifier_failure.txt | sed 's/^_//;s/_$//' | cut -c1-96)"
            echo "failure_code=${code:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "failure_code=unknown" >> "$GITHUB_OUTPUT"
          fi
      - name: Phase-1 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r3-ordinary-decay-candidate-evidence-${{ steps.verifier_diagnostic.outputs.failure_code || 'pass' }}
          path: |
            digital-protocell/experiments/generated/dcdev020m1r3/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r3/results.json
            digital-protocell/experiments/generated/dcdev020m1r3/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r3/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r3/ci/v3_d087/certification/report.json
            digital-protocell/experiments/generated/dcdev020m1r3/ci/v2_d087/certification/report.json
            digital-protocell/r3_verifier_failure.txt
          include-hidden-files: false
