name: DC-DEV-021 M2 CLOSURE-007 post-ingestive material-to-work

on:
  push:
    branches:
      - m2/dc-dev-021-m2-closure007-post-ingestive-material-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure007:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=3ee324e968ac38489e147e47840f5e1f277f706c
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefName,baseRefName
          python3 - "$start" <<'PY'
          import subprocess, sys
          start=sys.argv[1]
          allowed={
            '.agent/CURRENT.md','.agent/DIRECTIVES.md','.agent/LEARNINGS.md','.agent/OUTCOMES.md','.agent/RECORD.md','.agent/REPO_MAP.md',
            '.github/workflows/dc-dev-021-m2-closure007.yml',
            'digital-protocell/crates/regulatory-core/Cargo.toml',
            'digital-protocell/examples/dcdev021_m2_closure007.rs',
            'digital-protocell/examples/dcdev021_m2_closure007_impl.rs',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{start}..HEAD'],text=True).splitlines())
          unexpected={p for p in changed if p not in allowed and not p.startswith('digital-protocell/experiments/generated/dcdev021m2closure007/')}
          assert not unexpected, sorted(unexpected)
          forbidden_prefixes=(
            'digital-protocell/crates/chemistry-core/src/',
            'digital-protocell/crates/regulatory-core/src/',
            'digital-protocell/crates/phase1-certifier/src/',
            'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(p.startswith(forbidden_prefixes) for p in changed)
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and run CLOSURE-007 assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked -p regulatory-core --release --example dcdev021_m2_closure007
          cargo +1.89.0 run --locked -p regulatory-core --release --example dcdev021_m2_closure007 -- experiments/generated/dcdev021m2closure007
      - name: Validate compact CLOSURE-007 evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/generated/dcdev021m2closure007')
          required=json.loads((root/'artifact_manifest.json').read_text())['files']
          for item in required:
              assert (root/item).is_file(), item
          q=json.loads((root/'qualification.json').read_text())
          assert q['classification']=='M2_POST_INGESTIVE_MATERIAL_WORK_ACQUISITION_BENEFIT_REPRODUCTION_NOT_ESTABLISHED'
          assert q['candidate_benefit'] is True
          assert q['candidate_saves_a'] is True
          assert q['resource_causal_reproduction'] is False
          assert q['post_ingestive_material_work']=='NOT_ESTABLISHED'
          assert q['autonomous_resource_acquisition']=='NOT_ESTABLISHED'
          candidate=json.loads((root/'candidate_material_feedback.json').read_text())
          null=json.loads((root/'no_material_feedback_control.json').read_text())
          disabled=json.loads((root/'transfer_disabled_control.json').read_text())
          zero=json.loads((root/'zero_resource_control.json').read_text())
          motor_off=json.loads((root/'motor_off_control.json').read_text())
          assert candidate['base']['base']['invalid'] is False
          assert candidate['base']['base']['delivered_n'] > null['base']['base']['delivered_n']
          assert candidate['base']['base']['a_spent'] < null['base']['base']['a_spent']
          assert candidate['base']['base']['fissions']==0
          assert disabled['base']['base']['delivered_n']==0.0
          assert zero['base']['base']['delivered_n']==0.0
          assert motor_off['base']['base']['a_spent'] <= 1e-12
          assert motor_off['base']['base']['fissions'] >= 1
          closure=json.loads((root/'material_energy_closure.json').read_text())
          assert abs(closure['candidate_world_n_loss']-closure['candidate_delivered_n']) <= 1e-10
          assert abs(closure['candidate_world_f_loss']-closure['candidate_delivered_f']) <= 1e-10
          assert closure['candidate_a_to_w_residual'] <= 1e-9
          definition=json.loads((root/'material_signal_definition.json').read_text())
          assert definition['new_parameter'] is False
          assert definition['contact_signal_read'] is False
          assert definition['observer_ledger_read'] is False
          for p in root.glob('*.json'): json.loads(p.read_text())
          print('CLOSURE-007 evidence validation passed')
          PY
      - name: Validate governance and preservation
        run: |
          set -euo pipefail
          python3 scripts/validate_governance.py --mode ADOPTED
          git diff --check
      - name: Hash compact evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2closure007 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2closure007.sha256"
      - name: Upload CLOSURE-007 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-closure007-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2closure007/
            ${{ runner.temp }}/dcdev021m2closure007.sha256
