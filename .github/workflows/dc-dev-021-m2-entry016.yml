name: DC-DEV-021 M2 ENTRY-016 autonomous polarity initiation audit

on:
  push:
    branches:
      - m2/dc-dev-021-entry016-autonomous-polarity-initiation-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry016-initiation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify authority, frozen sources, and bounded scope
        run: |
          set -euo pipefail
          start=4ca7d0ee7c9e135a1ecf8adfdd5525b02c67c6bd
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          forbidden=$(git diff --name-only "$start" HEAD -- \
            digital-protocell/crates/chemistry-core \
            digital-protocell/crates/phase1-certifier \
            digital-protocell/crates/regulatory-core/src \
            digital-protocell/crates/evolution-harness)
          test -z "$forbidden"
          python3 - "$start" <<'PY'
          import subprocess, sys
          start = sys.argv[1]
          allowed = {
              ".github/workflows/dc-dev-021-m2-entry016.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcdev021_m2_entry016.rs",
              ".agent/CURRENT.md", ".agent/DIRECTIVES.md", ".agent/OUTCOMES.md",
              ".agent/LEARNINGS.md", ".agent/RECORD.md", ".agent/REPO_MAP.md",
              ".agent/PROJECT_PROFILE.md",
          }
          prefix = "digital-protocell/experiments/generated/dcdev021m2entry016/"
          changed = subprocess.check_output(["git", "diff", "--name-only", start, "HEAD"], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed and not p.startswith(prefix)]
          assert not unexpected, unexpected
          print("ENTRY-015 authority and ENTRY-016 scope verified")
          PY
          sha256sum \
            digital-protocell/crates/chemistry-core/src/mesh_reactions.rs \
            digital-protocell/crates/regulatory-core/src/intrinsic_exploration.rs \
            digital-protocell/crates/regulatory-core/src/contractility.rs \
            digital-protocell/crates/regulatory-core/src/stick_slip_traction.rs \
            digital-protocell/crates/regulatory-core/src/spatial_resource.rs

      - name: Reproduce accepted ENTRY-005 through ENTRY-015 classifications
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          examples="dcdev021_m2_entry005 dcdev021_m2_entry006 dcdev021_m2_entry007 dcdev021_m2_entry008 dcdev021_m2_entry009 dcdev021_m2_entry010 dcdev021_m2_entry011 dcdev021_m2_entry012 dcdev021_m2_entry013 dcdev021_m2_entry014 dcdev021_m2_entry015"
          for example in $examples; do
            cargo +1.89.0 build -p regulatory-core --example "$example"
          done
          for example in $examples; do
            cargo +1.89.0 run -p regulatory-core --example "$example" -- "$RUNNER_TEMP/$example" "$RUNNER_TEMP/$example-dense"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, math, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          expected = {
              "dcdev021_m2_entry005": "M2_REFRACTORY_MOTOR_DECOUPLING_EXPLORATION_QUALIFIED",
              "dcdev021_m2_entry006": "M2_UNGUIDED_RESOURCE_ACQUISITION_NOT_ESTABLISHED",
              "dcdev021_m2_entry007": "M2_UPTAKE_DEGRADATION_CONCENTRATION_FEEDBACK_CONFIRMED",
              "dcdev021_m2_entry008": "M2_LOCAL_CONTACT_REFRACTORY_EXPLOITATION_UPTAKE_INSUFFICIENT",
              "dcdev021_m2_entry009": "M2_CONTACT_LOCAL_SUPPRESSION_FAMILY_MECHANICALLY_INSUFFICIENT",
              "dcdev021_m2_entry010": "M2_POST_INGESTIVE_MATERIAL_SIGNAL_SUBSTRATE_QUALIFIED",
              "dcdev021_m2_entry011": "M2_FROZEN_UPTAKE_METABOLISM_COMPOSITION_QUALIFIED",
              "dcdev021_m2_entry012": "M2_SEPARATED_RESOURCE_ENCOUNTER_NOT_ESTABLISHED",
              "dcdev021_m2_entry013": "M2_SEARCH_REACH_POLARITY_DECAY_OR_HOMOGENIZATION_CONFIRMED",
              "dcdev021_m2_entry014": "M2_EXCITABLE_POLARITY_REFERENCE_TRANSFER_FEASIBLE",
              "dcdev021_m2_entry015": "M2_EXCITABLE_POLARITY_ACTUATOR_INTERFACE_QUALIFIED",
          }
          for folder, classification in expected.items():
              report = json.loads((root / folder / "qualification.json").read_text())
              assert report["classification"] == classification, (folder, report.get("classification"))
          assert math.isclose(json.loads((root / "dcdev021_m2_entry006/unguided_explorer.json").read_text())["cumulative_acquisition"], 0.2948669468973028, abs_tol=1e-12, rel_tol=0)
          assert json.loads((root / "dcdev021_m2_entry012/qualification.json").read_text())["precontact_parity_pass"] is True
          assert json.loads((root / "dcdev021_m2_entry013/qualification.json").read_text())["m2_bounded_autonomous_resource_acquisition"] == "NOT_ESTABLISHED"
          assert json.loads((root / "dcdev021_m2_entry014/qualification.json").read_text())["architect_acceptance"] == "PENDING"
          assert json.loads((root / "dcdev021_m2_entry015/qualification.json").read_text())["autonomous_polarity_initiation"] == "NOT_ESTABLISHED"
          print("ENTRY-005 through ENTRY-015 preservation passed")
          PY

      - name: Execute ENTRY-016 audit and verify mathematical gates
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run -p regulatory-core --release --example dcdev021_m2_entry016 -- "$RUNNER_TEMP/entry016" "$RUNNER_TEMP/entry016-dense"
          python3 - "$RUNNER_TEMP/entry016" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          def load(name): return json.loads((root / name).read_text())
          q = load("qualification.json")
          assert q["classification"] in {
              "M2_AUTONOMOUS_POLARITY_INITIATION_SUBSTRATE_AVAILABLE",
              "M2_POLARITY_INITIATION_FINITE_TRIGGER_REQUIRED",
              "M2_POLARITY_INITIATION_ENDOGENOUS_ASYMMETRY_ABSENT",
              "M2_POLARITY_INITIATION_MAPPING_UNRESOLVED",
          }
          protocol = load("protocol.json")
          assert protocol["observer_only"] is True
          assert protocol["resource_assay_run"] is False
          assert protocol["production_polarity_initialization"] is False
          assert load("linear_stability_polar.json")["homogeneous_spatial_stability"] == "UNSTABLE"
          assert load("linear_stability_traveling.json")["homogeneous_spatial_stability"] == "UNSTABLE"
          assert load("homogeneous_replay.json")["polar"]["remained_homogeneous_within_existing_tolerance"] is True
          assert all(r["remained_homogeneous_within_existing_tolerance"] for r in load("homogeneous_replay.json")["traveling"])
          assert load("rotation_equivariance.json")["pass"] is True
          forbidden = load("forbidden_information_audit.json")
          assert all(v is False for k, v in forbidden.items() if k != "forbidden_information_read")
          assert forbidden["forbidden_information_read"] == "NONE"
          assert load("m1_preservation.json")["v4_vector"] == [True, True, False, True, True, True, True, True]
          assert all(f["classification"] != "PHYSICALLY_NONUNIFORM" for f in load("local_field_inventory.json")["fields"])
          assert q["settled_organism_physical_asymmetry"] is False
          assert q["mapping_boundary"] == "NOT_APPLICABLE"
          print("ENTRY-016 stability, homogeneous replay, settled-field, rotation, and isolation gates passed")
          PY

      - name: Static audit of observer-only boundary
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("examples/dcdev021_m2_entry016.rs").read_text()
          assert "fn main()" in source
          assert "FiniteSpatialResourceRegionV1" not in source
          assert "local_contact_signal" not in source
          assert "uptake(" not in source
          assert "rand::" not in source and "thread_rng" not in source
          assert "polarity_to_motor" not in source
          assert "apply_local_activated_energy_contractility" not in source
          assert "use regulatory_core::stick_slip_traction" not in source
          assert "stable_json_hash" in source  # evidence identity only
          assert "mechanics_step" in source  # read-only settled-body reconstruction only
          print("ENTRY-016 remains an observer/mathematical audit with no production coupling")
          PY

      - name: Preserve production, D-087, downstream, and governance
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 build -p phase1-certifier --bin digital-protocell-phase1 --release
          DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/production.json"
          python3 - "$RUNNER_TEMP/production.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["mesh_contract"] == "MaturationCoupledV4" and report["reserve_enabled"] is False
          PY
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          expected = {"v2": [True] * 8, "v3": [True] * 8, "v4": [True, True, False, True, True, True, True, True]}
          for name, vector in expected.items():
              report = json.loads((root / f"d087-{name}" / "manifest.json").read_text())
              assert [report[f"gate{i}"]["pass"] for i in range(8)] == vector
          print("canonical D-087 preservation passed")
          PY
          out="$RUNNER_TEMP/foundations"; mkdir -p "$out"
          for spec in "dcdev002_gate_assay:regulator" "dcdev005_gate_assay:plasticity" "dcdev006_gate_assay:contact" "dcdev007_gate_assay:contact_regulation" "dcdev008_gate_assay:finite_resource" "dcdev011_gate_assay:traction"; do
            example="${spec%%:*}"; label="${spec##*:}"
            cargo +1.89.0 run -p regulatory-core --example "$example" -- "$out/$label"
          done
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
          python3 ../scripts/validate_governance.py --mode ADOPTED

      - name: Record artifact SHA-256
        if: always()
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2entry016 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2entry016.sha256"

      - name: Upload ENTRY-016 evidence and digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-entry016-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2entry016/
            ${{ runner.temp }}/entry016/
            ${{ runner.temp }}/entry016-dense/
            ${{ runner.temp }}/dcdev021m2entry016.sha256
            ${{ runner.temp }}/production.json
            ${{ runner.temp }}/d087-v2/
            ${{ runner.temp }}/d087-v3/
            ${{ runner.temp }}/d087-v4/
            ${{ runner.temp }}/foundations/
          if-no-files-found: warn
