name: DC-DEV-020-M1-R1 capacity decomposition

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  m1r1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1r0_requalification.rs examples/dcdev020m1r1_capacity_decomp.rs
      - name: Preserve production source boundaries
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 3cab12551072ad1eafaece72615f448d8efb9bea HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/(chemistry-core|phase1-certifier/src)/'; then
            echo 'M1-R1 may not modify production chemistry or Phase-1 source'
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ei 'dcdev020r[2-9]|dc-dev-021|recycl|salvage|homeostat|controller|behavior'; then
            echo 'M1-R1 later-scope contamination detected'
            exit 1
          fi
      - name: Fresh M1-R1 observer assay
        working-directory: digital-protocell
        env:
          DCDEV020M1R1_OUTPUT: experiments/generated/dcdev020m1r1/ci
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020m1r1_capacity_decomp --quiet
      - name: Verify compact M1-R1 artifacts
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1r1')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  assert (root / name).is_file(), f'missing {root/name}'
          protocol = json.loads((base / 'protocol.json').read_text())
          results = json.loads((base / 'results.json').read_text())
          qualification = json.loads((base / 'qualification.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          fresh_results = json.loads((fresh / 'results.json').read_text())
          fresh_q = json.loads((fresh / 'qualification.json').read_text())
          assert protocol['starting_head'] == '3cab12551072ad1eafaece72615f448d8efb9bea'
          assert protocol['m1r0_entry'] == '4895135deee7dbd782446dbfe25662181951afe0'
          assert protocol['settlement_steps'] == 5000
          assert protocol['deprivation_steps'] == 480
          assert protocol['horizon_steps'] == 480
          assert [a['id'] for a in protocol['arms']] == ['BASE', 'SOURCE_CAPACITY_UB', 'CATALYST_INVESTMENT_OFF', 'COMBINED']
          assert results['base_reproduction'] is True
          assert fresh_protocol == protocol
          assert fresh_results == results
          assert fresh_q == qualification
          assert results['classification'] == 'M1_SOURCE_AND_ALLOCATION_INSUFFICIENT'
          assert len(results['arms']) == 4
          assert all(a['world_to_organism_closure_residual'] <= 1e-8 for a in results['arms'])
          assert all(a['internal_material_closure_residual'] <= 1e-8 for a in results['arms'])
          assert results['arms'][1]['ledger']['diagnostic_a_produced'] > 0
          assert results['arms'][2]['ledger']['catalyst_production'] == 0
          assert qualification['observer_only'] is True
          assert qualification['production_biology_changed'] is False
          assert qualification['chemistry_changed'] is False
          assert qualification['recycling_implemented'] is False
          assert qualification['next_execution_started'] is False
          print('DCDEV020M1R1_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: Phase-1 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact M1-R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r1-compact-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r1/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r1/results.json
            digital-protocell/experiments/generated/dcdev020m1r1/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r1/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r1/ci/qualification.json
          include-hidden-files: false
