name: DC-DEV-011 passive isotropic stick-slip traction

on:
  pull_request:
    branches:
      - strategy/dc-dev-009-motility-feasibility-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-011-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate frozen DC-DEV-011 contract and evidence
        env:
          ENTRY_COMMIT: 8d6fe59397cabfa47bc1d8103acd68f544acc190
          FREEZE_COMMIT: f263536bc2da028630fe09108d07e7ada2e8ca38
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev011")
          required = [
              "protocol.json", "settled_state.json", "arm_summaries.json",
              "rotational_equivalence.json", "gate_results.json",
              "production_boundary.json", "final_manifest.json",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing artifacts: {missing}")
          data = {name: json.loads((root / name).read_text()) for name in required}
          protocol = data["protocol.json"]
          final = data["final_manifest.json"]
          production = Path("digital-protocell/crates/regulatory-core/src/stick_slip_traction.rs")
          assay = Path("digital-protocell/examples/dcdev011_gate_assay.rs")
          if protocol["entry_commit"] != "8d6fe59397cabfa47bc1d8103acd68f544acc190":
              raise SystemExit("wrong entry commit")
          if protocol["freeze_commit"] != "f263536bc2da028630fe09108d07e7ada2e8ca38":
              raise SystemExit("wrong freeze commit")
          if protocol["settlement_steps"] != 5000 or protocol["active_steps"] != 240 or protocol["relaxation_steps"] != 240:
              raise SystemExit("qualification horizon changed")
          if protocol["traction"]["static_traction_limit"] != 0.45 or protocol["traction"]["kinetic_traction"] != 0.2:
              raise SystemExit("frozen traction parameters changed")
          if protocol["parameter_screening"] or protocol["dcdev010_imported"] or protocol["dcdev012_started"]:
              raise SystemExit("forbidden scope enabled")
          if not data["settled_state.json"]["settled"]:
              raise SystemExit("legacy body did not settle")
          if final["next_execution_started"] is not False:
              raise SystemExit("next execution must remain stopped")
          if final["scientific_finding"] not in {
              "DCDEV011_PASSIVE_ISOTROPIC_STICK_SLIP_TRANSLATION_QUALIFIED",
              "DCDEV011_STICK_SLIP_TRANSLATION_NOT_ESTABLISHED",
          }:
              raise SystemExit("unexpected scientific conclusion")
          production_text = production.read_text()
          assay_text = assay.read_text()
          for forbidden in ["directional_substrate", "world_axis", "forward_resistance", "reverse_resistance"]:
              if forbidden in production_text:
                  raise SystemExit(f"directional substrate residue: {forbidden}")
          if '"directional_substrate_imported": false' not in assay_text:
              raise SystemExit("missing explicit directional-substrate exclusion")
          if '"world_axis": false' not in assay_text:
              raise SystemExit("missing explicit world-axis exclusion")
          if data["production_boundary.json"]["coordinate_writes_by_substrate"]:
              raise SystemExit("substrate claims coordinate authority")
          gates = data["gate_results.json"]
          if not gates["gate1_legacy_settled_initial_state"] or not gates["gate3_passivity"]:
              raise SystemExit("settlement or passivity gate failed")
          print(f"validated {len(required)} DC-DEV-011 artifacts")
          PY
          changed="$(git diff --name-only "$ENTRY_COMMIT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then
            echo "DC-DEV-011 may not modify chemistry-core"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ei '(^|/)(d096|dcdev010|directional)/'; then
            echo "DC-DEV-011 may not import rejected directional substrate work"
            exit 1
          fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 --check crates/regulatory-core/src/lib.rs crates/regulatory-core/src/stick_slip_traction.rs examples/dcdev011_gate_assay.rs

      - name: Run DC-DEV-011 qualification and production tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core --lib -- --nocapture
          cargo +1.89.0 run -p regulatory-core --example dcdev011_gate_assay -- experiments/generated/dcdev011

      - name: Preservation assays through DC-DEV-009
        working-directory: digital-protocell
        run: |
          tmp_dir="$(mktemp -d)"
          cargo +1.89.0 run -p regulatory-core --example dcdev002_gate_assay -- "$tmp_dir/dcdev002"
          cargo +1.89.0 run -p regulatory-core --example dcdev003_gate_assay -- "$tmp_dir/dcdev003"
          cargo +1.89.0 run -p regulatory-core --example dcdev004_gate_assay -- "$tmp_dir/dcdev004"
          cargo +1.89.0 run -p regulatory-core --example dcdev005_gate_assay -- "$tmp_dir/dcdev005"
          cargo +1.89.0 run -p regulatory-core --example dcdev006_gate_assay -- "$tmp_dir/dcdev006"
          cargo +1.89.0 run -p regulatory-core --example dcdev007_gate_assay -- "$tmp_dir/dcdev007"
          cargo +1.89.0 run -p regulatory-core --example dcdev008_gate_assay -- "$tmp_dir/dcdev008"
          cargo +1.89.0 run -p regulatory-core --example dcdev009_gate_assay -- "$tmp_dir/dcdev009"

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
