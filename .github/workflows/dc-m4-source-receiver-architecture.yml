name: DC-M4 Physically Owned Source Receiver Architecture
on:
  push:
    branches:
      - codex/dc-m4-source-receiver-architecture
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify bounded architecture, anchors and frozen inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 scripts/verify_source_receiver_architecture.py --repo . --output "$RUNNER_TEMP/source-receiver-evidence"
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: dc-m4-source-receiver-architecture-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/source-receiver-evidence/
