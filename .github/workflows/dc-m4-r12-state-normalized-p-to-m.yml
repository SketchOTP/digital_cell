name: DC-M4-R12 State-Normalized P_TO_M Force Response

on:
  push:
    branches:
      - codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r12-state-normalized-p-to-m:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R11 authority and R12 source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r11=c5d5342b19e912c004dd87eaf33a1ce1f16d27d7
          git merge-base --is-ancestor "$r11" HEAD
          python3 - "$r11" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r12-state-normalized-p-to-m.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcfinal001_r5_v4_neck.rs",
              "digital-protocell/examples/dcm4_r12_state_normalized_p_to_m_force_response_requalification.rs",
              "digital-protocell/experiments/dcm4_r12_state_normalized_p_to_m_force_response_requalification_verify.py",
              "digital-protocell/experiments/generated/dcm4r12statenormalizedptomforcerequalification/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Run focused implementation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r12_state_normalized_p_to_m_force_response_requalification.rs
          python3 -m py_compile experiments/dcm4_r12_state_normalized_p_to_m_force_response_requalification_verify.py
          cargo test --locked -q -p regulatory-core --lib
          cargo check --locked -q -p regulatory-core --example dcm4_r12_state_normalized_p_to_m_force_response_requalification

      - name: Seal R12 force-response contract before outcomes
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          mkdir -p experiments/generated/dcm4r12statenormalizedptomforcerequalification/raw
          cargo run --locked -q -p regulatory-core --example dcm4_r12_state_normalized_p_to_m_force_response_requalification -- \
            --stage seal --output /tmp/dcm4_r12_seal.json
          python3 experiments/dcm4_r12_state_normalized_p_to_m_force_response_requalification_verify.py \
            --repo . --raw /tmp/dcm4_r12_seal.json \
            --output experiments/generated/dcm4r12statenormalizedptomforcerequalification --stage seal

      - name: Execute fixed thirty-state susceptibility qualification
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo run --locked --release -q -p regulatory-core --example dcm4_r12_state_normalized_p_to_m_force_response_requalification -- \
            --stage qualification \
            --output experiments/generated/dcm4r12statenormalizedptomforcerequalification/raw/qualification.json

      - name: Independently verify R12 and seal artifact
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 experiments/dcm4_r12_state_normalized_p_to_m_force_response_requalification_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r12statenormalizedptomforcerequalification/raw/qualification.json \
            --output experiments/generated/dcm4r12statenormalizedptomforcerequalification \
            --stage qualification
          sha256sum target/release/examples/dcm4_r12_state_normalized_p_to_m_force_response_requalification \
            > experiments/generated/dcm4r12statenormalizedptomforcerequalification/binary_sha256.txt
          python3 experiments/dcm4_r12_state_normalized_p_to_m_force_response_requalification_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r12statenormalizedptomforcerequalification/raw/qualification.json \
            --output experiments/generated/dcm4r12statenormalizedptomforcerequalification \
            --stage qualification
          git diff --check

      - name: Confirm downstream stages were not started
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("experiments/generated/dcm4r12statenormalizedptomforcerequalification")
          qualification = json.loads((root / "qualification.json").read_text())
          for key in ("morphogenesis", "reproduction", "population_selection", "reversal", "final_integration"):
              assert qualification[key] == "NOT_REACHED"
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert manifest["exact_head"] == subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert manifest["file_count"] >= 10
          PY

      - name: Upload R12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r12statenormalizedptomforcerequalification-${{ github.sha }}
          if-no-files-found: error
          path: |
            digital-protocell/experiments/generated/dcm4r12statenormalizedptomforcerequalification/
            digital-protocell/experiments/dcm4_r12_state_normalized_p_to_m_force_response_requalification_verify.py
            digital-protocell/examples/dcm4_r12_state_normalized_p_to_m_force_response_requalification.rs
            digital-protocell/target/release/examples/dcm4_r12_state_normalized_p_to_m_force_response_requalification
