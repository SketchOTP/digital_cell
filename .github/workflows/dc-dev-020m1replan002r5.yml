name: DC-DEV-020-M1 REPLAN-002-R5 V4 irreversible physical-death qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002r5_v4_irreversible_physical_death.rs
      - name: Verify bounded R5 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = '9f4d6c34e88a613b0bf677f9f2aa25f8854edbb5'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1replan002r5.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002r5_v4_irreversible_physical_death.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r5/dcdev020m1replan002r5_v4_irreversible_physical_death.md',
          }
          allowed |= {
              f'digital-protocell/experiments/generated/dcdev020m1replan002r5/{name}'
              for name in ('protocol.json', 'results.json', 'qualification.json',
                           'preservation.json', 'artifact_manifest.json')
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R5 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R5_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5/ci/v3_d087
      - name: D-087 MaturationCoupledV4 reproduction
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r5/ci/v4_d087
      - name: R5 fixed-checkpoint qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R5_OUTPUT: experiments/generated/dcdev020m1replan002r5/ci
          DCDEV020M1REPLAN002R5_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r5-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r5_v4_irreversible_physical_death --release --quiet
      - name: Verify R5 compact evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1replan002r5/ci')
          for name in ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json'):
              assert (base / name).is_file(), f'missing {base/name}'
          q = json.loads((base / 'qualification.json').read_text())
          r = json.loads((base / 'results.json').read_text())
          assert q['starting_head'] == '9f4d6c34e88a613b0bf677f9f2aa25f8854edbb5'
          assert q['s0_recovery'] is True
          assert q['s3_recovery'] is False and q['s4_recovery'] is False
          assert q['s3_resource_opportunity'] is True and q['s4_resource_opportunity'] is True
          assert q['no_latch_block'] is True
          assert q['snapshot_identity'] is True
          assert q['starvation_material_closure'] is False
          assert q['refeed_material_closure'] is True
          assert q['material_closure'] is False
          assert q['classification'] == 'M1_V4_DEATH_QUALIFICATION_UNRESOLVED'
          assert q['next_execution_started'] is False
          assert r['next_execution_started'] is False
          assert r['v2_d087'] is True and r['v3_d087'] is True
          assert r['v4_d087_gates'] == [True, True, False, True, True, True, True, True]
          assert r['r4_preservation'] is True
          checkpoints = {row['step'] for row in r['starvation_checkpoints']}
          assert checkpoints == {5277, 6130, 10200, 150200}
          print('DCDEV020M1REPLAN002R5_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: R1, R4, and R5 focused preservation tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r4_v4_contract_aware_preservation -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r5_v4_irreversible_physical_death -- --nocapture
      - name: Phase-1 and preservation suites
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r5-v4-irreversible-physical-death-evidence
          path: digital-protocell/experiments/generated/dcdev020m1replan002r5/ci/**/*.json
