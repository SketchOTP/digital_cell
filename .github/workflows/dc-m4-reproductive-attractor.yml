name: DC-M4 reproductive attractor architecture gate

on:
  push:
    branches: [codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  architecture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and diagnostic-only scope
        run: |
          set -euo pipefail
          start=9aa1db6e001cf94e814b50b3f3cf086934000eee
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - <<'PY'
          import subprocess
          start = '9aa1db6e001cf94e814b50b3f3cf086934000eee'
          allowed = (
              '.agent/',
              '.github/workflows/dc-m4-reproductive-attractor.yml',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r4_evolution.rs',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcm4_reproductive_attractor.rs',
              'digital-protocell/experiments/dcm4_reproductive_attractor_verify.py',
              'digital-protocell/experiments/generated/dcm4reproductiveattractor/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Compile architecture observer and preserved source tests
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcm4_reproductive_attractor
          cargo +1.89.0 test --locked -q -p chemistry-core --lib mesh_fission::tests --no-fail-fast
          cargo +1.89.0 test --locked -q -p chemistry-core --lib planar_ring_topology::tests --no-fail-fast

      - name: Run ten-arm observer-only material and stability gate
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            DCFINAL001_R10R9R5_CANONICAL=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcm4_reproductive_attractor \
            -- --output /tmp/dcm4_reproductive_attractor.json
          python3 experiments/dcm4_reproductive_attractor_verify.py \
            --repo . \
            --input /tmp/dcm4_reproductive_attractor.json \
            --output experiments/generated/dcm4reproductiveattractor
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('experiments/generated/dcm4reproductiveattractor')
          result = json.loads(Path('/tmp/dcm4_reproductive_attractor.json').read_text())
          assert result['observer_only'] is True
          assert result['production_biology_changed'] is False
          assert result['resource_ecology_changed'] is False
          for key in ('resource_n_resource_f', 'fixture_n_fixture_f'):
              cell = result['cells'][key]
              assert len(cell['arms']) == 10
              assert all(arm['mechanics_trace'] for arm in cell['arms'])
          audit = json.loads((root / 'fission_authority_audit.json').read_text())
          assert audit['guards_present'] is True, audit
          forbidden = json.loads((root / 'forbidden_information_audit.json').read_text())
          assert forbidden['pass'] is True, forbidden
          observer = json.loads((root / 'observer_invariance.json').read_text())
          assert observer['pass'] is True, observer
          decision = json.loads((root / 'architecture_decision.json').read_text())
          assert decision['decision'] in {
              'ROUTE_A_EXISTING_GROWTH_INSTABILITY_SUPPORTED',
              'ROUTE_A_NEW_LOCAL_GROWTH_COUPLING_REQUIRED',
              'ROUTE_B_ENDOGENOUS_POLARITY_REQUIRED',
              'REPRODUCTIVE_ATTRACTOR_ARCHITECTURE_UNRESOLVED',
          }, decision
          assert decision['selected_route_is_diagnostic_only'] is True
          assert decision['successor_implementation_authorized'] is False
          spec = decision['route_specification']
          assert spec['status'] == 'PROPOSED_NOT_IMPLEMENTED'
          assert spec['route'] == decision['decision']
          assert spec['material_conservation']
          assert spec['active_energy']
          assert spec['anti_controller']
          if decision['decision'] == 'ROUTE_A_NEW_LOCAL_GROWTH_COUPLING_REQUIRED':
              assert spec['state_variables']['existing_per_edge']
              assert spec['local_equations']
              assert spec['falsifiable_resource_prediction']
              assert spec['validation_domain']['accepted_parent_steps'] == 14778
              assert spec['held_out_validation']
              assert spec['preservation_tests']
              assert spec['expected_failure_classification']
          PY

      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4-reproductive-attractor
          if-no-files-found: error
          retention-days: 90
          path: digital-protocell/experiments/generated/dcm4reproductiveattractor/
