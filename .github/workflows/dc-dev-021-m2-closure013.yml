name: DC-DEV-021 M2 CLOSURE-013 A-fraction execution reconciliation

on:
  push:
    branches:
      - m2/dc-dev-021-m2-closure013-a-fraction-execution-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure013:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - name: Verify exact authority, semantic scope, and bounded diff
        run: |
          set -euo pipefail
          start=925fd72ea0e2f330174cae317564de7f28139d69
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefName,baseRefName > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          pr=json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'pr44.json')))
          assert pr['state']=='OPEN'
          assert pr['isDraft'] is True
          assert pr['mergedAt'] is None
          assert pr['headRefName']=='strategy/dc-dev-020r9-mesh-contract-requalification'
          assert pr['baseRefName']=='strategy/dc-dev-016-metabolic-break-even'
          PY
          python3 - "$start" <<'PY'
          import subprocess, sys
          start=sys.argv[1]
          allowed={
            '.agent/CURRENT.md','.agent/DIRECTIVES.md','.agent/OUTCOMES.md','.agent/RECORD.md',
            '.github/workflows/dc-dev-021-m2-closure013.yml',
            'digital-protocell/crates/regulatory-core/Cargo.toml',
            'digital-protocell/examples/dcdev021_m2_closure010.rs',
            'digital-protocell/examples/dcdev021_m2_closure010_impl.rs',
            'digital-protocell/examples/dcdev021_m2_closure013.rs',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{start}..HEAD'],text=True).splitlines())
          unexpected={p for p in changed if p not in allowed}
          assert not unexpected, sorted(unexpected)
          forbidden=('digital-protocell/crates/chemistry-core/src/','digital-protocell/crates/regulatory-core/src/','digital-protocell/crates/m2-lifeform-runtime/src/')
          assert not any(p.startswith(forbidden) for p in changed)
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build exact historical and reconciled assays
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked -p regulatory-core --release --example dcdev021_m2_closure012 --example dcdev021_m2_closure013
      - name: Replay sealed historical complement execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -p regulatory-core --release --example dcdev021_m2_closure012 -- experiments/generated/dcdev021m2closure012-reference
      - name: Run literal documented A-fraction execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -p regulatory-core --release --example dcdev021_m2_closure013 -- experiments/generated/dcdev021m2closure013
      - name: Validate semantic reconciliation and material closure
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          hist=Path('experiments/generated/dcdev021m2closure012-reference')
          root=Path('experiments/generated/dcdev021m2closure013')
          h=json.loads((hist/'paired_arms.json').read_text())
          q=json.loads((root/'qualification.json').read_text())
          arch=json.loads((root/'architecture.json').read_text())
          rec=json.loads((root/'semantic_reconciliation.json').read_text())
          hb=h['combined']['base']['base']
          rb=json.loads((root/'paired_arms.json').read_text())['combined']['base']['base']
          assert abs(hb['delivered_n']-1252.571074851476) <= 1e-10
          assert hb['fissions'] == 0
          assert abs(rb['delivered_n']-1230.5172060231012) <= 1e-10
          assert rb['fissions'] == 0
          assert q['classification']=='M2_DOCUMENTED_A_FRACTION_LAW_REPRODUCTION_NOT_ESTABLISHED'
          assert q['architect_acceptance'] in ('PENDING', 'COMPLETE')
          assert arch['composition']=='motor_i = raw_i * A/(N+F+A+W) * (1 - regulator_i)'
          assert arch['reconciled_executed_composition']=='motor_i = raw_i * material_signal_i * (1 - regulator_i)'
          assert rec['historical_executed_composition']=='motor_i = raw_i * (1 - A/(N+F+A+W)) * (1 - regulator_i)'
          assert rec['historical_result_preserved'] is True
          expected={'combined','direct_material','contact_local','no_feedback','transfer_disabled','zero_resource','motor_off'}
          for name in ('paired_arms.json','daughter_a_arms.json','daughter_b_arms.json'):
              group=json.loads((root/name).read_text())
              assert set(group)==expected
              for arm in expected:
                  base=group[arm]['base']['base']
                  assert base['invalid'] is False
                  assert abs(base['world_n_loss']-base['delivered_n']) <= 1e-10
                  assert abs(base['world_f_loss']-base['delivered_f']) <= 1e-10
                  assert base['a_to_w_residual'] <= 1e-9
          for p in root.glob('*.json'): json.loads(p.read_text())
          print('CLOSURE-013 semantic reconciliation validation passed')
          PY
      - name: Validate governance and preservation
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'DC-DEV-021-M2-CLOSURE-013-A-FRACTION-EXECUTION-RECONCILIATION-001' .agent/CURRENT.md
          grep -q 'D-20260905-dcdev021-m2-closure013-a-fraction-execution-reconciliation' .agent/DIRECTIVES.md
          grep -q 'OUT-DCDEV021-M2-CLOSURE013-A-FRACTION-EXECUTION-RECONCILIATION' .agent/OUTCOMES.md
          grep -q 'DEC-DCDEV021-M2-CLOSURE013-A-FRACTION-EXECUTION-RECONCILIATION' .agent/RECORD.md
      - name: Hash compact reconciled evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2closure013 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2closure013.sha256"
      - name: Upload CLOSURE-013 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-closure013-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2closure013/
            ${{ runner.temp }}/dcdev021m2closure013.sha256
