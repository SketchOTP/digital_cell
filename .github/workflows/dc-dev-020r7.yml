name: DC-DEV-020-R7 on-policy zero-drift audit

on:
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-020r7-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate compact evidence and preservation boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev020r7")
          required = ["protocol.json", "summary.json", "qualification.json",
                      "literature_review.json", "external_evidence_manifest.json", "manifest.json"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing R7 artifacts: {missing}")
          protocol = json.loads((root / "protocol.json").read_text())
          summary = json.loads((root / "summary.json").read_text())
          qualification = json.loads((root / "qualification.json").read_text())
          external = json.loads((root / "external_evidence_manifest.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          if protocol["accepted_r6_head"] != "f01b716d9051c9f0114f3c5c0d1b123e2df037cf":
              raise SystemExit("wrong accepted R6 authority")
          if protocol["source_commit"] != "3ddae9ea3c954431c8b3ae2ecbf2d6fc94278e56":
              raise SystemExit("wrong R7 source commit")
          if qualification["classification"] != "DCDEV020R7_NFA_COORDINATE_REQUIRED_ON_POLICY":
              raise SystemExit("unexpected R7 classification")
          if not qualification["trajectory_parity"] or not qualification["physics_valid"] or not qualification["drift_accounting_valid"]:
              raise SystemExit("R7 physical or parity gate failed")
          if qualification["nf_on_policy_sufficient"] or not qualification["nfa_on_policy_sufficient"]:
              raise SystemExit("coordinate verdict changed")
          roots = summary["roots"]
          if roots["states"] != 480 or roots["finite"] != 480 or roots["capacity_insufficient"] or roots["nonmonotonic"]:
              raise SystemExit("R7 root coverage changed")
          if abs(summary["r6_versus_root"]["drift_accounting_closure"]) > 1e-10:
              raise SystemExit("R7 drift no longer closes")
          if external["r5_dense_input"]["sha256"] != "4e22ab1dbd6e06f7c9a272747c2ed8271f28ef33f4eaddc1c59bb9df58a46585":
              raise SystemExit("R5 dense seal changed")
          if external["r7_dense_output"]["sha256"] != "abdaea6d075c700e36d14d369dba62982f4a65cea47d2d1f162b5dfe8afa59f8":
              raise SystemExit("R7 dense seal changed")
          for item in manifest["files"]:
              data = (root / item["name"]).read_bytes()
              if len(data) != item["bytes"] or hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit(f"R7 compact manifest mismatch: {item['name']}")
          if qualification["production_chemistry_changed"] or qualification["production_behavior_changed"] or qualification["implementation_authorized"]:
              raise SystemExit("observer-only boundary opened")
          PY
          git diff --quiet f01b716d9051c9f0114f3c5c0d1b123e2df037cf -- \
            digital-protocell/experiments/generated/dcdev020/observer \
            digital-protocell/experiments/generated/dcdev020r2 \
            digital-protocell/experiments/generated/dcdev020r3 \
            digital-protocell/experiments/generated/dcdev020r4 \
            digital-protocell/experiments/generated/dcdev020r5 \
            digital-protocell/experiments/generated/dcdev020r6
          changed="$(git diff --name-only 1e242f28152797b512e25cd56c7b718e45d6ca97 HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then exit 1; fi
          if printf '%s\n' "$changed" | grep -Ei 'dcdev021|dc-dev-021'; then exit 1; fi
          if printf '%s\n' "$changed" | grep -E '^\.gitignore$'; then exit 1; fi

      - name: Scoped formatting and observer tests
        working-directory: digital-protocell
        run: |
          rustup run 1.89.0 rustfmt --edition 2021 --check examples/dcdev020r7_on_policy_zero_drift_audit.rs
          cargo +1.89.0 test -p regulatory-core --example dcdev020r7_on_policy_zero_drift_audit --release

      - name: Reproduce governed R5 dense input
        working-directory: digital-protocell
        env:
          DCDEV020R5_SOURCE_COMMIT: 6dbb8d45c520e2756a81b2cc1e81dff9c3878992
          DCDEV020R5_OUTPUT_ROOT: target/dcdev020r5-ci
          DCDEV020R5_EXTERNAL_LEDGER: target/dcdev020r5-statewise-ledger.json
          DCDEV020R5_EXTERNAL_LOCATION: /mnt/storage1tb/cache/project-artifacts/digital_cell/experiments/generated/dcdev020r5/6dbb8d45c520e2756a81b2cc1e81dff9c3878992/statewise_root_ledger.json
        run: |
          cargo +1.89.0 run -p regulatory-core --example dcdev020r5_local_zero_drift_source_audit --release --quiet
          python3 - <<'PY'
          import json
          rows = json.load(open("target/dcdev020r5-statewise-ledger.json"))
          assert len(rows) == 4800
          assert all(row["status"] == "FINITE_ZERO_DRIFT_ROOT" for row in rows)
          PY

      - name: Reproduce R7 compact evidence
        working-directory: digital-protocell
        env:
          DCDEV020R5_EXTERNAL_LEDGER: target/dcdev020r5-statewise-ledger.json
          DCDEV020R7_OUTPUT_ROOT: target/dcdev020r7-ci
          DCDEV020R7_EXTERNAL_LEDGER: target/dcdev020r7-on-policy-ledger.json
          DCDEV020R7_EXTERNAL_LOCATION: /mnt/storage1tb/cache/project-artifacts/digital_cell/experiments/generated/dcdev020r7/3ddae9ea3c954431c8b3ae2ecbf2d6fc94278e56/on_policy_root_ledger.json
          DCDEV020R7_LEDGER_SHA256: abdaea6d075c700e36d14d369dba62982f4a65cea47d2d1f162b5dfe8afa59f8
          DCDEV020R7_SOURCE_COMMIT: 3ddae9ea3c954431c8b3ae2ecbf2d6fc94278e56
        run: |
          set -euo pipefail
          cargo +1.89.0 run -p regulatory-core --example dcdev020r7_on_policy_zero_drift_audit --release --quiet
          for name in protocol.json qualification.json literature_review.json external_evidence_manifest.json; do
            cmp "target/dcdev020r7-ci/$name" "experiments/generated/dcdev020r7/$name"
          done
          python3 - <<'PY'
          import json, math
          ignored = {"trajectory_hash", "committed_artifact_hash_match"}
          def compare(a, b, path="root"):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert set(a) == set(b), f"key mismatch at {path}"
                  for key in a:
                      if key not in ignored:
                          compare(a[key], b[key], f"{path}.{key}")
              elif isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), f"length mismatch at {path}"
                  for i, (left, right) in enumerate(zip(a, b)):
                      compare(left, right, f"{path}[{i}]")
              elif isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=1e-9, abs_tol=1e-12), f"numeric mismatch at {path}"
              else:
                  assert a == b, f"value mismatch at {path}"
          compare(json.load(open("target/dcdev020r7-ci/summary.json")),
                  json.load(open("experiments/generated/dcdev020r7/summary.json")))
          rows = json.load(open("target/dcdev020r7-on-policy-ledger.json"))
          assert len(rows) == 480
          assert all(row["root_audit"]["status"] == "FINITE_ZERO_DRIFT_ROOT" for row in rows)
          PY

      - name: Regulatory-core regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p regulatory-core

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
