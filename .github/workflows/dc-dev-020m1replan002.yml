name: DC-DEV-020-M1 maturation coupled load-bearing feasibility

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  maturation-coupled-load-bearing:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1replan002_maturation_coupled_load_bearing_feasibility.rs
      - name: Verify bounded diagnostic diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '92075021ae1f4c9917f7ace9b160e5694e001de2'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1replan002.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1replan002_maturation_coupled_load_bearing_feasibility.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002/maturation_coupled_load_bearing_feasibility.md',
              'digital-protocell/experiments/generated/dcdev020m1replan002/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002/results.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1replan002/artifact_manifest.json',
          }
          unexpected = changed - allowed
          assert not unexpected, f'unexpected diagnostic paths: {sorted(unexpected)}'
          print('DCDEV020M1REPLAN002_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002/ci/v3_d087
      - name: Run maturation/load-bearing qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002_OUTPUT: experiments/generated/dcdev020m1replan002/ci
          DCDEV020M1REPLAN002_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002_maturation_coupled_load_bearing_feasibility --release --quiet
      - name: Run focused maturation/load-bearing tests
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002_maturation_coupled_load_bearing_feasibility -- --nocapture
      - name: Verify compact evidence
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f'DC-DEV-020-M1-REPLAN-002 verifier failure: {message}')

          base = Path('experiments/generated/dcdev020m1replan002')
          ci = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, ci):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((ci / 'protocol.json').read_text())
          results = json.loads((ci / 'results.json').read_text())
          qualification = json.loads((ci / 'qualification.json').read_text())
          preservation = json.loads((ci / 'preservation.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['starting_head'] == '92075021ae1f4c9917f7ace9b160e5694e001de2', 'starting head mismatch')
          require(protocol['observer_only'] is True and protocol['next_execution_started'] is False, 'observer boundary changed')
          require(results['classification'] in {
              'M1_MATURATION_COUPLED_LOAD_BEARING_FEASIBILITY_CONFIRMED',
              'M1_MATURATION_COUPLED_LOAD_BEARING_HOMEOSTASIS_ONLY',
              'M1_MATURATION_COUPLED_LOAD_BEARING_INSUFFICIENT',
              'M1_MATURATION_COUPLED_LOAD_BEARING_INVALID',
          }, 'classification outside directive list')
          require(abs(results['arms']['A_static_current']['organized_material_delta'] - 0.34214067689038075) <= 1e-8, 'static control changed')
          require(abs(results['arms']['B_moving_current']['organized_material_delta'] + 9.954959206543037) <= 1e-8, 'moving control changed')
          require(abs(results['arms']['C_moving_age_structured']['organized_material_delta'] + 1.7633945824468071) <= 1e-8, 'age-only control changed')
          require(results['checks']['controls_reproduce'], 'control reproduction failed')
          require(results['checks']['candidate_homeostasis'], 'candidate homeostasis failed')
          require(results['checks']['candidate_recovery'], 'candidate recovery failed')
          require(results['checks']['starvation_decline'], 'starvation decline failed')
          require(results['checks']['material_closure'] and results['checks']['reference_identity'], 'closure/reference identity failed')
          require(results['checks']['boundedness'] and results['checks']['resource_delivery_same'], 'boundedness/source parity failed')
          require(results['checks']['damage_preservation'], 'damage fixture failed')
          require(preservation['v2_d087'] and preservation['v3_d087'], 'D-087 preservation failed')
          require(qualification['observer_only'] and qualification['e0_authority'] and qualification['e1_material_identity_and_lineage'], 'qualification boundary failed')
          print('DCDEV020M1REPLAN002_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: GC conservation preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution harness preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002-maturation-coupled-load-bearing-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1replan002/protocol.json
            digital-protocell/experiments/generated/dcdev020m1replan002/results.json
            digital-protocell/experiments/generated/dcdev020m1replan002/qualification.json
            digital-protocell/experiments/generated/dcdev020m1replan002/preservation.json
            digital-protocell/experiments/generated/dcdev020m1replan002/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1replan002/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1replan002/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1replan002/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1replan002/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1replan002/ci/artifact_manifest.json
