name: DC-DEV-020-M1-R6-R7 reference geometry coupling decision

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  reference-geometry-coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check crates/chemistry-core/src/mesh_mechanics.rs
          rustfmt +1.89.0 --edition 2021 --check crates/chemistry-core/src/mesh_reactions.rs
          rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1r6r7_reference_geometry_coupling_decision.rs
      - name: Verify bounded R6-R7 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          start = '821f6a85c1d4825715090c8ccb3482ceddccbde5'
          changed = subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r6r7.yml',
              'digital-protocell/crates/chemistry-core/src/mesh_mechanics.rs',
              'digital-protocell/crates/chemistry-core/src/mesh_reactions.rs',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r6r7_reference_geometry_coupling_decision.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r6r7/reference_geometry_coupling_decision.md',
              'digital-protocell/experiments/generated/dcdev020m1r6r7/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r7/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r7/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r7/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r7/artifact_manifest.json',
          }
          unexpected = set(changed) - allowed
          assert not unexpected, f'unexpected R6-R7 paths: {sorted(unexpected)}'
          print('DCDEV020M1R6R7_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r7/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r7/ci/v3_d087
      - name: Run R6-R7 qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1R6R7_OUTPUT: experiments/generated/dcdev020m1r6r7/ci
          DCDEV020M1R6R7_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1r6r7-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6r7_reference_geometry_coupling_decision --release --quiet
      - name: Run focused remesh lineage test
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --example dcdev020m1r6r7_reference_geometry_coupling_decision -- --nocapture
      - name: Verify compact evidence
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f'R6-R7 verifier failure: {message}')

          base = Path('experiments/generated/dcdev020m1r6r7')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          preservation = json.loads((fresh / 'preservation.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['starting_head'] == '821f6a85c1d4825715090c8ccb3482ceddccbde5', 'starting head mismatch')
          require(protocol['observer_only'] is True and protocol['next_execution_started'] is False, 'observer boundary changed')
          require(results['classification'] in {
              'M1_REFERENCE_GEOMETRY_COUPLING_CAUSALLY_CONFIRMED',
              'M1_REFERENCE_GEOMETRY_COUPLING_HOMEOSTASIS_ONLY',
              'M1_REFERENCE_GEOMETRY_COUPLING_NOT_SUFFICIENT',
              'M1_REFERENCE_GEOMETRY_COUPLING_INVALID',
          }, 'classification outside directive list')
          require(abs(results['arms']['A']['organized_material_delta'] - 0.3421406768903523) <= 1e-8, 'static reference changed')
          require(abs(results['arms']['B']['organized_material_delta'] + 9.954959206543037) <= 1e-8, 'current moving reference changed')
          require(abs(results['arms']['C']['organized_material_delta'] + 7.90146640791825) <= 1e-8, 'reference shadow changed')
          require(results['arms']['A']['closure']['max_strict_residual'] <= 1e-8, 'static closure failed')
          require(results['arms']['B']['closure']['max_strict_residual'] <= 1e-8, 'current closure failed')
          require(results['arms']['C']['closure']['max_strict_residual'] <= 1e-8, 'reference closure failed')
          require(qualification['e0_authority'] and qualification['e1_reference_length_caller_audit'], 'authority/caller gate failed')
          require(qualification['e2_isolated_shadow_correctness'] and qualification['observer_only'], 'shadow gate failed')
          require(preservation['r6_r6_reproduction'] and preservation['geometry_material_conservation'], 'preservation failed')
          require(preservation['historical_v2_d087'] and preservation['candidate_v3_d087'], 'D-087 preservation failed')
          require(results['checks']['d087'] is True, 'R6-R7 D-087 checks failed')
          require(results['checks']['remesh_reference_lineage'] is True, 'reference lineage check failed')
          print('DCDEV020M1R6R7_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: Geometry/material preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution harness preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r6r7-reference-geometry-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r6r7/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r7/ci/artifact_manifest.json
