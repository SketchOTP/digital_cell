name: DC-DEV-021 goal Route-C finite reserve growth

on:
  push:
    branches:
      - m2/dc-dev-021-routec-finite-reserve-growth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routec:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and Route-C allowlist
        run: |
          set -euo pipefail
          start=2d9372b38e5a81f5176ffcca14a00d569a204668
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          allowed = {
              '.agent/RECORD.md',
              '.agent/OUTCOMES.md',
              '.github/workflows/dc-dev-021-goal-routec-finite-reserve-growth.yml',
              'digital-protocell/crates/chemistry-core/src/d091_analysis.rs',
              'digital-protocell/crates/m2-lifeform-runtime/src/main.rs',
              'digital-protocell/docs/goal-routec-finite-reserve-growth-contract.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines())
          prefixes = ('digital-protocell/experiments/generated/routec_finite_reserve_growth/',)
          unexpected = {p for p in changed if p not in allowed and not p.startswith(prefixes)}
          assert not unexpected, sorted(unexpected)
          assert 'digital-protocell/crates/chemistry-core/src/d091_analysis.rs' in changed
          assert 'digital-protocell/crates/m2-lifeform-runtime/src/main.rs' in changed
          forbidden = (
              'digital-protocell/crates/regulatory-core/src/',
              'digital-protocell/crates/phase1-certifier/src/',
              'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(p.startswith(forbidden) for p in changed)
          PY

      - name: Build and test affected crates
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 check --locked -p chemistry-core
          cargo +1.89.0 test --locked -p m2-lifeform-runtime

      - name: Run matched Route-C controls
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --routec-reserve-growth --steps 3000 --seed 1 \
            --report "$RUNNER_TEMP/routec-active.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --routec-reserve-growth --transfer-disabled --steps 3000 --seed 1 \
            --report "$RUNNER_TEMP/routec-disabled.json"

      - name: Validate provisional Route-C result and compact evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('experiments/generated/routec_finite_reserve_growth')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for item in manifest['files']:
              assert (root / item).is_file(), item
          for path in root.glob('*.json'):
              json.loads(path.read_text())

          temp = Path(os.environ['RUNNER_TEMP'])
          active = json.loads((temp / 'routec-active.json').read_text())
          disabled = json.loads((temp / 'routec-disabled.json').read_text())
          assert active['step'] == disabled['step'] == 3000
          assert active['reserve_enabled'] is True
          assert disabled['reserve_enabled'] is True
          assert active['first_transfer_step'] == 1
          assert disabled['first_transfer_step'] is None
          assert active['fission_events'] == 0
          assert disabled['fission_events'] == 0
          assert active['living_count'] == 1
          assert disabled['living_count'] == 0
          assert active['cumulative_n_delivered'] > 0
          assert active['cumulative_f_delivered'] > 0
          assert disabled['cumulative_n_delivered'] == 0
          assert disabled['cumulative_f_delivered'] == 0
          for report in (active, disabled):
              assert report['motor_failures'] == 0
              assert abs(report['world_n_conservation_error']) <= 1e-12
              assert abs(report['world_f_conservation_error']) <= 1e-12
              assert report['resource_causal_reproduction'] == 'NOT_ESTABLISHED'
              assert report['autonomous_resource_acquisition'] == 'NOT_ESTABLISHED'
          print('Route-C provisional negative validation passed')
          PY

      - name: Hash and upload Route-C evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/routec_finite_reserve_growth \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/routec-finite-reserve-growth.sha256"

      - name: Upload Route-C evidence
        uses: actions/upload-artifact@v4
        with:
          name: dc-dev-021-goal-routec-finite-reserve-growth-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/routec_finite_reserve_growth/
            ${{ runner.temp }}/routec-finite-reserve-growth.sha256
