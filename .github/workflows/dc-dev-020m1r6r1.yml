name: DC-DEV-020-M1-R6-R1 geometry material closure audit

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  geometry-material-closure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1r6r1_geometry_material_closure_audit.rs
      - name: Verify bounded R6-R1 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = 'adea13fafa1f2a85e521a44b5d77249820d107bd'
          changed = subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md', 'STORAGE_MAP.md',
              '.github/workflows/dc-dev-020m1r6r1.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r6r1_geometry_material_closure_audit.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r6r1/geometry_material_closure_audit.md',
              'digital-protocell/experiments/generated/dcdev020m1r6r1/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r1/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r1/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r1/artifact_manifest.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r1/R6R1_EVIDENCE_MANIFEST.json',
          }
          assert set(changed) <= allowed, f'unexpected R6-R1 paths: {sorted(set(changed) - allowed)}'
          forbidden = [path for path in changed if any(token in path.lower() for token in (
              'chemistry-core/src', 'mesh_reactions.rs', 'mesh_transport.rs',
              'mesh_mechanics.rs', 'mesh_fission.rs', 'recycl', 'salvage',
              'dc-dev-021', 'phase1-certifier/src/gates.rs',
          ))]
          assert not forbidden, f'forbidden R6-R1 paths: {forbidden}'
          print('DCDEV020M1R6R1_BOUNDED_DIFF_PASS')
          PY
      - name: Fresh geometry/material closure audit
        working-directory: digital-protocell
        env:
          DCDEV020M1R6R1_OUTPUT: experiments/generated/dcdev020m1r6r1/ci
          DCDEV020M1R6R1_DENSE_OUTPUT: experiments/generated/dcdev020m1r6r1/ci_dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6r1_geometry_material_closure_audit --release --quiet
      - name: Verify fresh audit artifacts and fail-closed gates
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  print(f'::error title=R6-R1 verifier::{message}')
                  raise SystemExit(1)

          base = Path('experiments/generated/dcdev020m1r6r1')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R6-R1-GEOMETRY-MATERIAL-CLOSURE-AUDIT-001', 'directive mismatch')
          require(protocol['starting_head'] == 'adea13fafa1f2a85e521a44b5d77249820d107bd', 'starting head mismatch')
          require(protocol['observer_only'] is True, 'observer-only flag missing')
          require(results['classification'] in {
              'M1_RUNTIME_GEOMETRY_MASS_COUPLING_CONFIRMED',
              'M1_RUNTIME_CLOSURE_OTHER_STAGE_CONFIRMED',
              'M1_RUNTIME_CLOSURE_CAUSE_UNRESOLVED',
              'M1_RUNTIME_CLOSURE_AUDIT_INVALID',
          }, 'unknown classification')
          require(results['r6_reproduction']['committed_checkpoint_agreement'] is True, 'R6 checkpoint replay failed')
          require(results['r6_reproduction']['observer_trajectory_parity'] is True, 'observer trajectory parity failed')
          require(results['r6_reproduction']['trajectory_hash'] == 'be91ed02266a0078', 'trajectory hash mismatch')
          require(results['r6_reproduction']['final_mesh_hash'] == 'e4c4dd4ff2e443d8', 'final mesh hash mismatch')
          require(results['stage_ledger_pass'] is True, 'stage ledger failed')
          require(abs(results['attribution_8000']['unexplained_residual']) <= 1e-8, 'unexplained residual too large')
          require(abs(results['attribution_8000']['geometry_cumulative_residual'] - results['attribution_8000']['geometry_fixed_concentration_delta']) <= 1e-8, 'geometry attribution mismatch')
          require(results['mechanics_only_isolation']['executed'] is True, 'mechanics isolation not executed')
          require(results['remesh_only_isolation']['executed'] is True, 'remesh isolation not executed')
          require(qualification['e0_authority'] is True and qualification['e1_stage_ledger'] is True, 'qualification gates failed')
          require(qualification['next_execution_started'] is False, 'next execution started')
          require(results['next_execution_started'] is False, 'results advanced')
          require(results['production_biology_changed'] is False and results['mechanics_changed'] is False, 'production scope changed')
          for contract in ('ConservativeV2', 'ConservativeV3'):
              report = json.loads((fresh / ('v2_d087' if contract == 'ConservativeV2' else 'v3_d087') / 'certification' / 'report.json').read_text())
              require(report['mesh_contract'] == contract, f'{contract} contract mismatch')
              require(report['reserve_enabled'] is False, f'{contract} reserve enabled')
              require([report[f'gate{i}']['pass'] for i in range(8)] == [True] * 8, f'{contract} D-087 preservation failed')
          print('DCDEV020M1R6R1_ARTIFACT_AND_FAIL_CLOSED_GATE_VERIFICATION_PASS')
          PY
      - name: D-087 preservation regression
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r1/ci/v3_d087
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r1/ci/v2_d087
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r6r1-geometry-material-closure-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r6r1/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/R6R1_EVIDENCE_MANIFEST.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r1/ci/artifact_manifest.json
