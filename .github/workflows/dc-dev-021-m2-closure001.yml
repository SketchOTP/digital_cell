name: DC-DEV-021 M2 closure finite-world autonomous ecology

on:
  push:
    branches:
      - m2/dc-dev-021-m2-closure-finite-world-autonomous-ecology
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m2-closure-finite-world:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded scope
        run: |
          set -euo pipefail
          start=e56da9f88b632c6655eb79b50133cf5d0a864bbc
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess, sys
          start = sys.argv[1]
          allowed = {
              ".github/workflows/dc-dev-021-m2-closure001.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/crates/regulatory-core/src/contractility.rs",
              "digital-protocell/crates/regulatory-core/src/finite_world.rs",
              "digital-protocell/crates/regulatory-core/src/lib.rs",
              "digital-protocell/crates/regulatory-core/src/stick_slip_traction.rs",
              "digital-protocell/examples/dcdev021_m2_closure001.rs",
              "digital-protocell/examples/dcdev021_m2_closure001_impl.rs",
              ".agent/CURRENT.md", ".agent/DIRECTIVES.md", ".agent/OUTCOMES.md",
              ".agent/LEARNINGS.md", ".agent/RECORD.md", ".agent/REPO_MAP.md",
          }
          prefix = "digital-protocell/experiments/generated/dcdev021m2closure001/"
          changed = subprocess.check_output(["git", "diff", "--name-only", start, "HEAD"], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed and not p.startswith(prefix)]
          assert not unexpected, unexpected
          print("closure authority and scope verified")
          PY
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefName,baseRefName
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and execute closure assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build -p regulatory-core --release --example dcdev021_m2_closure001
          cargo +1.89.0 run -p regulatory-core --release --example dcdev021_m2_closure001 -- experiments/generated/dcdev021m2closure001

      - name: Validate closure evidence and preservation
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("experiments/generated/dcdev021m2closure001")
          required = [
              "protocol.json", "authority.json", "entry028_metadata_correction.json", "external_discovery.json",
              "runtime_architecture.json", "step_order.json", "polarity_runtime_parity.json", "polarity_continuity.json",
              "finite_world_authority.json", "finite_world_inventory.json", "finite_world_single_region_parity.json",
              "finite_world_no_hidden_feed.json", "finite_world_shared_allocation.json", "finite_world_order_invariance.json",
              "existing_motor_campaign.json", "existing_motor_decision.json", "protrusion_authority.json",
              "protrusion_energy_contract.json", "protrusion_controls.json", "autonomous_acquisition.json",
              "contact_and_transfer_chronology.json", "resource_depletion.json", "metabolic_consequence.json",
              "behavior_energy_tradeoff.json", "starvation_resource_removal.json", "shared_ecology.json",
              "lineage_resource_ledger.json", "reproductive_causality.json", "descendant_fission.json",
              "descendant_continuity.json", "rotation_equivariance.json", "index_invariance.json",
              "update_order_invariance.json", "forbidden_information_audit.json", "m1_preservation.json",
              "entry005_028_preservation.json", "downstream_preservation.json", "restart_boundary.json",
              "evolution_reentry_readiness.json", "qualification.json", "artifact_manifest.json",
          ]
          for name in required:
              assert (root / name).is_file(), name
          q = json.loads((root / "qualification.json").read_text())
          assert q["starting_head"] == "e56da9f88b632c6655eb79b50133cf5d0a864bbc"
          assert q["classification"] == "M2_CURRENT_SENSORIMOTOR_ROUTE_ECOLOGICALLY_INSUFFICIENT"
          assert q["next_execution_started"] is False
          assert q["architect_acceptance"] == "PENDING"
          assert q["finite_world"] and q["shared_world"]
          assert q["unbacked_nf_inflow"] == "NONE"
          sanity = json.loads((root / "finite_world_contact_sanity.json").read_text())
          assert sanity["positive_transfer"] is True
          assert sanity["world_debit_matches_delivery"] is True
          campaign = json.loads((root / "existing_motor_campaign.json").read_text())
          for arm in ("spatial", "same_mean", "motor_off", "transfer_disabled", "zero_resource", "protrusive"):
              assert campaign[arm]["invalid"] is False, arm
          assert campaign["spatial"]["delivered_n"] == 0.0
          assert campaign["protrusive"]["delivered_n"] == 0.0
          assert campaign["spatial"]["slips"] > 0
          assert campaign["protrusive"]["slips"] > 0
          closure = json.loads((root / "protrusion_energy_contract.json").read_text())
          assert closure["new_numeric_parameter"] is False
          assert closure["a_to_w"] == "exact spent amount"
          m1 = json.loads((root / "m1_preservation.json").read_text())
          assert m1["source_changed"] is False
          assert m1["v2_d087"] == "8/8" and m1["v3_d087"] == "8/8" and m1["v4_d087"] == "7/8"
          assert m1["v4_vector"] == [True, True, False, True, True, True, True, True]
          print("closure evidence and preservation gates passed")
          PY

      - name: Validate historical classifications and production preservation
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
            "dcdev021m2entry005":"M2_REFRACTORY_MOTOR_DECOUPLING_EXPLORATION_QUALIFIED",
            "dcdev021m2entry006":"M2_UNGUIDED_RESOURCE_ACQUISITION_NOT_ESTABLISHED",
            "dcdev021m2entry007":"M2_UPTAKE_DEGRADATION_CONCENTRATION_FEEDBACK_CONFIRMED",
            "dcdev021m2entry008":"M2_LOCAL_CONTACT_REFRACTORY_EXPLOITATION_UPTAKE_INSUFFICIENT",
            "dcdev021m2entry009":"M2_CONTACT_LOCAL_SUPPRESSION_FAMILY_MECHANICALLY_INSUFFICIENT",
            "dcdev021m2entry010":"M2_POST_INGESTIVE_MATERIAL_SIGNAL_SUBSTRATE_QUALIFIED",
            "dcdev021m2entry011":"M2_FROZEN_UPTAKE_METABOLISM_COMPOSITION_QUALIFIED",
            "dcdev021m2entry012":"M2_SEPARATED_RESOURCE_ENCOUNTER_NOT_ESTABLISHED",
            "dcdev021m2entry013":"M2_SEARCH_REACH_POLARITY_DECAY_OR_HOMOGENIZATION_CONFIRMED",
            "dcdev021m2entry014":"M2_EXCITABLE_POLARITY_REFERENCE_TRANSFER_FEASIBLE",
            "dcdev021m2entry015":"M2_EXCITABLE_POLARITY_ACTUATOR_INTERFACE_QUALIFIED",
            "dcdev021m2entry016":"M2_POLARITY_INITIATION_ENDOGENOUS_ASYMMETRY_ABSENT",
            "dcdev021m2entry017":"M2_POST_FISSION_ASYMMETRY_PRESENT_TOPOLOGY_MAPPING_UNRESOLVED",
            "dcdev021m2entry018":"M2_NATIVE_MATERIAL_RING_POLARITY_TRANSFER_FEASIBLE",
            "dcdev021m2entry019":"M2_CONSERVATIVE_LIFE_HISTORY_POLARITY_INITIATION_QUALIFIED",
            "dcdev021m2entry020":"M2_AUTONOMOUS_POLARITY_MECHANICAL_AMPLITUDE_INSUFFICIENT",
            "dcdev021m2entry021":"M2_CONSERVATIVE_POLARITY_FISSION_INHERITANCE_AND_AMPLIFICATION_QUALIFIED",
            "dcdev021m2entry022":"M2_POST_FISSION_TRANSIENT_MOTOR_CONTRAST_MECHANICALLY_INSUFFICIENT",
            "dcdev021m2entry023":"M2_DAUGHTER_MECHANICAL_TRANSFER_ATTRIBUTION_UNRESOLVED",
            "dcdev021m2entry024":"M2_EFFECTOR_ORIENTATION_DAUGHTER_DEPENDENT_UNRESOLVED",
            "dcdev021m2entry025":"M2_LIVE_ANTAGONISTIC_INHERITED_POLARITY_COMPOSITION_INSUFFICIENT",
            "dcdev021m2entry026r1":"M2_POST_FISSION_DEVELOPMENT_MAINTAINS_INHERITED_POLARITY_WITHOUT_DE_NOVO_RESEED",
          }
          for folder, value in expected.items():
              actual = json.loads((Path("experiments/generated") / folder / "qualification.json").read_text())["classification"]
              assert actual == value, (folder, actual)
          print("historical classification preservation passed")
          PY
          DCDEV020R9R3_CONTRACT=ConservativeV3 DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 cargo +1.89.0 run -p phase1-certifier --bin digital-protocell-phase1 --release -- --steps 1 --out "$RUNNER_TEMP/production.json"
          python3 - "$RUNNER_TEMP/production.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          assert result["mesh_contract"] == "MaturationCoupledV4"
          assert result["reserve_enabled"] is False
          PY
          cargo +1.89.0 test -p regulatory-core finite_world -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
          python3 scripts/validate_governance.py --mode ADOPTED

      - name: Record and upload closure evidence
        if: always()
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2closure001 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2closure001.sha256"

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-closure001-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2closure001/
            ${{ runner.temp }}/dcdev021m2closure001.sha256
            ${{ runner.temp }}/production.json
          if-no-files-found: warn
