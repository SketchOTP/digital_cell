name: DC-FINAL-001-R10R9R3 buffered reserve canonical growth

on:
  push:
    branches: [codex/dc-final-001-r10r9r3-buffered-reserve]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r10r9r3-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R10R9R3 authority and bounded scope
        run: |
          set -euo pipefail
          start=222a40b44edb2e601ee32ec953819303692619cb
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - <<'PY'
          import subprocess
          start = '222a40b44edb2e601ee32ec953819303692619cb'
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r10r9r3.yml',
              'digital-protocell/crates/chemistry-core/src/mesh_growth.rs',
              'digital-protocell/crates/chemistry-core/src/metabolic_reserve.rs',
              'digital-protocell/crates/chemistry-core/tests/d091_tests.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r4_evolution.rs',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r10r7_variant_feasibility.rs',
              'digital-protocell/examples/dcfinal001_r10r9r3_d091v2_reproduction.rs',
              'digital-protocell/examples/dcfinal001_r10r9r3_evolution.rs',
              'digital-protocell/experiments/dcfinal001_r10r9r3_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r10r9r3/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY

      - name: Install sanctioned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.89.0 rustfmt

      - name: Run focused D091 v2 checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -q -p chemistry-core --test d091_tests --no-fail-fast
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r3_d091v2_reproduction
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r3_evolution

      - name: Run R10R9R3 reproduction and population assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r3_d091v2_reproduction
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r3_evolution
          python3 - <<'PY'
          import json
          repro = json.load(open('/tmp/dcfinal001_r10r9r3_d091v2_reproduction.json'))
          pop = json.load(open('/tmp/dcfinal001_r10r9r3_evolution.json'))
          assert repro['robust_reproduction'] is True
          assert repro['geometry_valid_fissions'] >= 7
          assert repro['full_state_viable_daughter_pairs'] >= 6
          assert all(c['ledger']['reserve_r_to_m'] == 0.0 for c in pop['campaigns'])
          assert all(c['ledger']['reserve_funded_growth'] == 0.0 for c in pop['campaigns'])
          assert all(c['ledger']['mutations'] == 0 for c in pop['campaigns'] if not c['mutation_enabled'])
          assert max(c['terminal']['maximum_generation'] for c in pop['campaigns'] if c['mutation_enabled']) >= 2
          assert all(c['ledger']['post_bootstrap_physical_fissions'] == 0 for c in pop['campaigns'] if c['mutation_enabled'] and len(c['environment_sequence']) == 2)
          PY

      - name: Validate sealed panel, evidence, and manifests
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/dcfinal001_r10r9r3_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('experiments/generated/dcfinal001r10r9r3')
          assert json.loads((root / 'specialization_feasibility.json').read_text())['status'] is True
          assert json.loads((root / 'environment_a_selection.json').read_text())['status'] == 'NOT_ESTABLISHED'
          assert json.loads((root / 'reversal.json').read_text())['status'] == 'NOT_ESTABLISHED'
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY
          git diff --check

      - name: Upload exact-head R10R9R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r10r9r3
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r10r9r3
            /tmp/dcfinal001_r10r9r3_d091v2_reproduction.json
            /tmp/dcfinal001_r10r9r3_evolution.json
