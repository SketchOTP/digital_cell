name: DC-DEV-019-R1 portability harness repair

on:
  pull_request:
    branches:
      - strategy/dc-dev-019-nutrient-homeostasis-persistence

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.89 and rustfmt
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add rustfmt --toolchain 1.89.0

      - name: Replace host-specific exact-float assertions with existing tolerance gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('digital-protocell/examples/dcdev019_homeostasis.rs')
          s=p.read_text()
          exacts = [
              r'    assert_eq!\(settled_hash, R1_SETTLED_HASH\);\n',
              r'    assert_eq!\(legacy_deprived_hash, R1_DEPRIVED_HASH\);\n',
              r'    assert_eq!\(\n        phase1_selected_run\.final_e_stored,\n        ACCEPTED_PHASE1_SELECTED_E\n    \);\n',
              r'    assert_eq!\(original_m2_run\.final_e_stored, ACCEPTED_ORIGINAL_M2_E\);\n',
              r'    assert_eq!\(original_m3_run\.final_e_stored, ACCEPTED_ORIGINAL_M3_E\);\n',
          ]
          for pat in exacts:
              s2, n = re.subn(pat, '', s, count=1)
              if n != 1:
                  raise SystemExit(f'missing expected portability assertion: {pat}')
              s = s2
          # Historical controls already use <=1e-10 and continuous deprivation already
          # requires same-run material-hash parity. Keep both scientific gates unchanged.
          p.write_text(s)
          PY
          rustup run 1.89.0 rustfmt --edition 2021 digital-protocell/examples/dcdev019_homeostasis.rs

      - name: Validate repaired harness on Linux
        working-directory: digital-protocell
        env:
          DCDEV019R1_OUTPUT_ROOT: ${{ runner.temp }}/dcdev019r1
        run: |
          cargo +1.89.0 run -p regulatory-core --example dcdev019_homeostasis
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          q=json.loads((Path(os.environ['DCDEV019R1_OUTPUT_ROOT'])/'qualification.json').read_text())
          assert q['material_parity']
          assert q['historical_controls_reproduced']
          assert abs(q['h_deprived']-0.12874703683936634) <= 1e-10
          assert abs(q['carried_state_feed']['final_e_stored']-56.54155735320212) <= 1e-10
          assert abs(q['reset_state_feed']['final_e_stored']-55.84948101858201) <= 1e-10
          assert abs(q['source_saturated_feed']['final_e_stored']-61.68434818478833) <= 1e-10
          assert not q['gate1_pass']
          assert q['classification'] == 'DCDEV019R1_CONTINUOUS_COORDINATED_METABOLIC_HOMEOSTASIS_NOT_ESTABLISHED'
          PY

      - name: Commit harness-only portability repair
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ "$changed" != 'digital-protocell/examples/dcdev019_homeostasis.rs' ]; then
            echo 'Unexpected portability-repair scope'
            exit 1
          fi
          git config user.name 'digital-cell-architect'
          git config user.email 'actions@users.noreply.github.com'
          git add digital-protocell/examples/dcdev019_homeostasis.rs
          git commit -m 'Make DC-DEV-019-R1 assay tolerance-portable'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
