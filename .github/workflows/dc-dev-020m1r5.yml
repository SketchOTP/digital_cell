name: DC-DEV-020-M1-R5 sustained homeostasis

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  sustained-homeostasis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check \
            crates/regulatory-core/src/backing_reservoir.rs \
            crates/regulatory-core/src/coupled_resource.rs \
            crates/regulatory-core/src/lib.rs \
            examples/dcdev020m1r5_sustained_homeostasis.rs
      - name: Verify bounded R5 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '68d1c88ec1b915a4bee86efe24e985222b529d5a'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              'STORAGE_MAP.md',
              '.github/workflows/dc-dev-020m1r5.yml',
              'digital-protocell/crates/regulatory-core/src/backing_reservoir.rs',
              'digital-protocell/crates/regulatory-core/src/coupled_resource.rs',
              'digital-protocell/crates/regulatory-core/src/lib.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r5_sustained_homeostasis.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r5/sustained_homeostasis.md',
              'digital-protocell/experiments/generated/dcdev020m1r5/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r5/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r5/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r5/artifact_manifest.json',
          }
          unexpected = [path for path in changed if path not in allowed]
          assert not unexpected, f'unexpected R5 paths: {unexpected}'
          forbidden = [path for path in changed if any(token in path.lower() for token in (
              'dc-dev-021', 'recycl', 'salvage', 'mesh_reactions.rs',
              'mesh_transport.rs', 'mesh_mechanics.rs', 'mesh_fission.rs',
              'phase1-certifier/src/gates.rs', 'phase1-certifier/src/frozen.rs',
          ))]
          assert not forbidden, f'forbidden R5 paths: {forbidden}'
          print('DCDEV020M1R5_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r5/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r5/ci/v2_d087
      - name: Fresh R5 sustained assay
        working-directory: digital-protocell
        env:
          DCDEV020M1R5_OUTPUT: experiments/generated/dcdev020m1r5/ci
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020m1r5_sustained_homeostasis --release --quiet
      - name: R3 starvation/topology preservation replay
        working-directory: digital-protocell
        env:
          DCDEV020M1R3_OUTPUT: experiments/generated/dcdev020m1r5/ci/r3_replay
        run: |
          mkdir -p experiments/generated/dcdev020m1r5/ci/r3_replay
          cp -R experiments/generated/dcdev020m1r5/ci/v3_d087 experiments/generated/dcdev020m1r5/ci/r3_replay/v3_d087
          cp -R experiments/generated/dcdev020m1r5/ci/v2_d087 experiments/generated/dcdev020m1r5/ci/r3_replay/v2_d087
          cargo +1.89.0 run -p regulatory-core --example dcdev020m1r3_ordinary_decay_candidate --release --quiet
      - name: Verify R5 artifacts and sustained gates
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  print(f'::error title=R5 verifier::{message}')
                  raise SystemExit(1)

          base = Path('experiments/generated/dcdev020m1r5')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R5-SUSTAINED-HOMEOSTASIS-001', 'directive mismatch')
          require(protocol['starting_head'] == '68d1c88ec1b915a4bee86efe24e985222b529d5a', 'starting head mismatch')
          require(protocol['backing_reservoir_schema'] == 'FINITE_SPATIAL_BACKING_RESERVOIR_V1', 'backing schema mismatch')
          require(protocol['initial_finite_mass']['n'] == 243.14924801053778, 'N inventory mismatch')
          require(protocol['initial_finite_mass']['f'] == 243.14924801053778, 'F inventory mismatch')
          require(protocol['replenishment_events'] == 0, 'protocol replenishment not zero')
          require(results['r4_exact_reproduction'] is True, 'R4 reproduction failed')
          require(results['first_step_v1_transport_parity'] is True, 'first-step parity failed')
          require(results['classification'] == 'M1_SUSTAINED_HOMEOSTASIS_V1_SUFFICIENT', f"classification={results['classification']}")
          a = results['arm_a_coupled']; b = results['arm_b_uncoupled']; c = results['arm_c_no_resource']; d = results['arm_d_feed_then_remove']
          for arm in (a, b):
              require(arm['resource_remaining_positive'], f"resource exhausted for {arm['arm']}")
              require(arm['final_state']['organized_material'] >= arm['initial']['organized_material'] - 1e-8, f"organized criterion failed for {arm['arm']}")
              require(arm['final_state']['observer_viable'] is True, f"viability failed for {arm['arm']}")
              require(arm['final_state']['closed_intact'] is True, f"topology failed for {arm['arm']}")
              require(arm['final_state']['ruptured_edges'] == 0, f"rupture for {arm['arm']}")
              require(arm['final_state']['physical_runtime_valid'] is True, f"runtime invalid for {arm['arm']}")
              require(arm['source']['replenishment_events'] == 0, f"replenishment for {arm['arm']}")
              require(arm['source']['max_world_loss_delivery_residual'] <= 1e-8, f"world closure for {arm['arm']}")
              require(arm['world_organism_closure_residual'] <= 1e-8, f"internal closure for {arm['arm']}")
          require(c['organized_material_delta'] < a['organized_material_delta'], 'no-resource arm not worse')
          require(d['r4_reproduction'] is True, 'feed-removal R4 checkpoint failed')
          require(d['post_removal_delivery'] == 0.0, 'post-removal delivery nonzero')
          require(d['post_removal_coupled_activation'] == 0.0, 'post-removal coupled activation nonzero')
          require(d['post_removal_organized_delta'] < 0.0, 'post-removal material did not deteriorate')
          for report, contract in ((json.loads((fresh/'v3_d087/certification/report.json').read_text()), 'ConservativeV3'), (json.loads((fresh/'v2_d087/certification/report.json').read_text()), 'ConservativeV2')):
              require(report['mesh_contract'] == contract, f"mesh contract={report.get('mesh_contract')}")
              require(report['reserve_enabled'] is False, 'reserve enabled')
              require([report[f'gate{i}']['pass'] for i in range(8)] == [True] * 8, f'D087 gates failed for {contract}')
              require(report['primary_conclusion'] == 'D087_PHASE1_AUTOPOIETIC_PROTOCELL_CERTIFIED', 'D087 conclusion failed')
          require(qualification['e0_authority'] is True and qualification['e1_backing_reservoir_isolation'] is True, 'E0/E1 failed')
          require(qualification['e3_resource_dependence'] is True and qualification['e4_preservation'] is True, 'E3/E4 failed')
          require(results['production_selection_changed'] is False, 'production selection changed')
          require(results['parameter_search'] is False and results['controller_added'] is False, 'unauthorized control change')
          require(results['resource_replenishment'] is False and results['recycling'] is False, 'unauthorized resource change')
          require(results['next_execution_started'] is False, 'next execution started')
          print('DCDEV020M1R5_ARTIFACT_AND_SUSTAINED_GATE_VERIFICATION_PASS')
          PY
      - name: Regulatory-core backing/coupled tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p regulatory-core backing_reservoir -- --nocapture
          cargo +1.89.0 test -p regulatory-core coupled_resource -- --nocapture
      - name: Phase-1 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r5-sustained-homeostasis-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r5/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r5/results.json
            digital-protocell/experiments/generated/dcdev020m1r5/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r5/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r5/ci/v3_d087/certification/report.json
            digital-protocell/experiments/generated/dcdev020m1r5/ci/v2_d087/certification/report.json
