name: DC-DEV-020-R8 product-feedback attractor audit

on:
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-020r8-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate R8 compact evidence and frozen boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("digital-protocell/experiments/generated/dcdev020r8")
          names = ["protocol.json", "pairing_summary.json", "constraint_summary.json",
                   "feasible_region.json", "capacity_validation.json", "qualification.json",
                   "literature_review.json", "external_evidence_manifest.json", "manifest.json"]
          if any(not (root / name).is_file() for name in names):
              raise SystemExit("missing R8 compact evidence")
          protocol = json.loads((root / "protocol.json").read_text())
          qualification = json.loads((root / "qualification.json").read_text())
          external = json.loads((root / "external_evidence_manifest.json").read_text())
          if protocol["accepted_r7_head"] != "7d5f772f0db67b8d754d27c1182c933533f750fd":
              raise SystemExit("wrong R7 authority")
          if protocol["source_commit"] != "6e2b03a7551409086c1a38d6cf5f62827fb91929":
              raise SystemExit("wrong R8 source commit")
          if qualification["classification"] != "DCDEV020R8_PRODUCT_FEEDBACK_TOPOLOGY_INCOMPATIBLE":
              raise SystemExit("unexpected R8 classification")
          if qualification["dc_dev_021_authorized"] or qualification["next_execution_started"]:
              raise SystemExit("R8 scope boundary opened")
          if qualification["production_chemistry_changed"] or qualification["production_behavior_changed"]:
              raise SystemExit("production boundary opened")
          if external["R5"]["sha256"] != "4e22ab1dbd6e06f7c9a272747c2ed8271f28ef33f4eaddc1c59bb9df58a46585":
              raise SystemExit("R5 seal changed")
          if external["R7"]["sha256"] != "abdaea6d075c700e36d14d369dba62982f4a65cea47d2d1f162b5dfe8afa59f8":
              raise SystemExit("R7 seal changed")
          if external["dense_R8"]["sha256"] != "12b41f27c928635899a7ea3a8d496cfdd3af7d3fd83aaa93024724663e2df9ff":
              raise SystemExit("R8 dense seal changed")
          PY
          changed="$(git diff --name-only 1e242f28152797b512e25cd56c7b718e45d6ca97 HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then exit 1; fi
          if printf '%s\n' "$changed" | grep -Ei 'dcdev021|dc-dev-021'; then exit 1; fi
          if printf '%s\n' "$changed" | grep -E '^\.gitignore$'; then exit 1; fi

      - name: Scoped formatting and R8 tests
        working-directory: digital-protocell
        run: |
          rustup run 1.89.0 rustfmt --edition 2021 --check examples/dcdev020r8_nfa_restorative_attractor.rs
          cargo +1.89.0 test -p regulatory-core --example dcdev020r8_nfa_restorative_attractor --release

      - name: Reproduce sealed R5 and R7 inputs
        working-directory: digital-protocell
        env:
          DCDEV020R5_SOURCE_COMMIT: 6dbb8d45c520e2756a81b2cc1e81dff9c3878992
          DCDEV020R5_OUTPUT_ROOT: target/dcdev020r5-ci
          DCDEV020R5_EXTERNAL_LEDGER: target/dcdev020r5-statewise-ledger.json
          DCDEV020R5_EXTERNAL_LOCATION: /mnt/storage1tb/cache/project-artifacts/digital_cell/experiments/generated/dcdev020r5/6dbb8d45c520e2756a81b2cc1e81dff9c3878992/statewise_root_ledger.json
          DCDEV020R7_EXTERNAL_LEDGER: target/dcdev020r7-on-policy-ledger.json
          DCDEV020R7_OUTPUT_ROOT: target/dcdev020r7-ci
          DCDEV020R7_EXTERNAL_LOCATION: /mnt/storage1tb/cache/project-artifacts/digital_cell/experiments/generated/dcdev020r7/3ddae9ea3c954431c8b3ae2ecbf2d6fc94278e56/on_policy_root_ledger.json
          DCDEV020R7_LEDGER_SHA256: abdaea6d075c700e36d14d369dba62982f4a65cea47d2d1f162b5dfe8afa59f8
          DCDEV020R7_SOURCE_COMMIT: 3ddae9ea3c954431c8b3ae2ecbf2d6fc94278e56
        run: |
          set -euo pipefail
          cargo +1.89.0 run -p regulatory-core --example dcdev020r5_local_zero_drift_source_audit --release --quiet
          test "$(python3 -c 'import json; print(len(json.load(open("target/dcdev020r5-statewise-ledger.json"))))')" = 4800
          cargo +1.89.0 run -p regulatory-core --example dcdev020r7_on_policy_zero_drift_audit --release --quiet
          test "$(python3 -c 'import json; print(len(json.load(open("target/dcdev020r7-on-policy-ledger.json"))))')" = 480

      - name: Reproduce R8 compact evidence
        working-directory: digital-protocell
        env:
          DCDEV020R8_R5_LEDGER: target/dcdev020r5-statewise-ledger.json
          DCDEV020R8_R7_LEDGER: target/dcdev020r7-on-policy-ledger.json
          DCDEV020R8_OUTPUT_ROOT: target/dcdev020r8-ci
          DCDEV020R8_EXTERNAL_LEDGER: target/dcdev020r8-pair-constraint-ledger.json
          DCDEV020R8_EXTERNAL_LOCATION: /mnt/storage1tb/cache/project-artifacts/digital_cell/experiments/generated/dcdev020r8/6e2b03a7551409086c1a38d6cf5f62827fb91929/pair_constraint_ledger.json
          DCDEV020R8_EXTERNAL_SHA256: 12b41f27c928635899a7ea3a8d496cfdd3af7d3fd83aaa93024724663e2df9ff
          DCDEV020R8_SOURCE_COMMIT: 6e2b03a7551409086c1a38d6cf5f62827fb91929
        run: |
          set -euo pipefail
          cargo +1.89.0 run -p regulatory-core --example dcdev020r8_nfa_restorative_attractor --release --quiet
          python3 - <<'PY'
          import json, math
          names = ["protocol.json", "pairing_summary.json", "constraint_summary.json",
                   "feasible_region.json", "capacity_validation.json", "qualification.json",
                   "literature_review.json", "external_evidence_manifest.json", "manifest.json"]
          def compare(left, right, path="root"):
              if isinstance(left, dict) and isinstance(right, dict):
                  assert set(left) == set(right), f"key mismatch at {path}"
                  for key in left:
                      compare(left[key], right[key], f"{path}.{key}")
              elif isinstance(left, list) and isinstance(right, list):
                  assert len(left) == len(right), f"length mismatch at {path}"
                  for index, (a, b) in enumerate(zip(left, right)):
                      compare(a, b, f"{path}[{index}]")
              elif isinstance(left, (int, float)) and isinstance(right, (int, float)):
                  assert math.isclose(float(left), float(right), rel_tol=1e-9, abs_tol=1e-12), f"numeric mismatch at {path}: {left!r} != {right!r}"
              else:
                  assert left == right, f"value mismatch at {path}: {left!r} != {right!r}"
          for name in names:
              with open(f"target/dcdev020r8-ci/{name}") as generated, open(f"experiments/generated/dcdev020r8/{name}") as committed:
                  compare(json.load(generated), json.load(committed), name)
          PY

      - name: Regulatory-core regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p regulatory-core

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
