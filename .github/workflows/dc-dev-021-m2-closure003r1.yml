name: DC-DEV-021 M2 CLOSURE-003-R1 finite membrane reproductive requalification

on:
  push:
    branches:
      - m2/dc-dev-021-m2-closure003r1-finite-membrane-reproductive-requalification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure003r1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify CLOSURE-003-R1 authority and scope
        run: |
          set -euo pipefail
          start=987f565530c201c38072c4aba54079545f79233b
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          gh pr view 44 --repo SketchOTP/digital_cell --json state,isDraft,mergedAt,headRefName,baseRefName
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify bounded CLOSURE-003-R1 diff
        run: |
          set -euo pipefail
          start=987f565530c201c38072c4aba54079545f79233b
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          allowed = {
              ".agent/CURRENT.md", ".agent/DIRECTIVES.md", ".agent/LEARNINGS.md",
              ".agent/OUTCOMES.md", ".agent/RECORD.md", ".agent/REPO_MAP.md",
              ".agent/PROJECT_PROFILE.md",
              ".github/workflows/dc-dev-021-m2-closure003r1.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcdev021_m2_closure003r1.rs",
              "digital-protocell/examples/dcdev021_m2_closure003r1_impl.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", f"{start}..HEAD"], text=True).splitlines())
          unexpected = {
              path for path in changed
              if path not in allowed
              and not path.startswith("digital-protocell/experiments/generated/dcdev021m2closure003r1/")
          }
          assert not unexpected, sorted(unexpected)
          print("CLOSURE-003-R1 additive diff is within authorized assay/evidence/workflow/governance surfaces")
          PY

      - name: Build and run CLOSURE-003-R1 assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked -p regulatory-core --release --example dcdev021_m2_closure003r1
          cargo +1.89.0 run --locked -p regulatory-core --release --example dcdev021_m2_closure003r1 -- experiments/generated/dcdev021m2closure003r1

      - name: Validate whole-membrane calibration and spatial stop boundary
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("experiments/generated/dcdev021m2closure003r1")
          required = [
              "protocol.json", "authority.json", "closure003_architect_acceptance.json",
              "d088_reproductive_environment_authority.json", "feeding_boundary_selection.json",
              "finite_membrane_calibration_contract.json", "finite_membrane_daughter_a.json",
              "finite_membrane_daughter_b.json", "finite_membrane_exposure_audit.json",
              "maintenance_growth_ledger.json", "mass_threshold_chronology.json",
              "fission_eligibility_chronology.json", "reproductive_resource_unit.json",
              "finite_spatial_world.json", "finite_resource_lifecycle.json",
              "transfer_disabled_lifecycle.json", "zero_resource_lifecycle.json",
              "whole_membrane_reference.json", "resource_reproductive_causality.json",
              "lineage_ledger.json", "descendant_continuity.json", "inherited_state_inventory.json",
              "heritability_metrics.json", "heritability_shuffle_control.json",
              "ecological_phenotype_attribution.json", "variation_generation_audit.json",
              "evolution_reentry_readiness.json", "world_material_closure.json",
              "energetic_closure.json", "rotation_equivariance.json", "index_invariance.json",
              "update_order_invariance.json", "forbidden_information_audit.json",
              "m1_preservation.json", "entry005_028_preservation.json",
              "closure001_preservation.json", "closure001r1_preservation.json",
              "closure002_preservation.json", "closure003_preservation.json",
              "downstream_preservation.json", "restart_boundary.json",
              "repository_professionalism.json", "qualification.json", "artifact_manifest.json",
          ]
          for name in required:
              assert (root / name).is_file(), name

          q = json.loads((root / "qualification.json").read_text())
          assert q["starting_head"] == "987f565530c201c38072c4aba54079545f79233b"
          assert q["classification"] == "M2_REPRODUCTIVE_RESOURCE_UNIT_QUALIFIED_SPATIAL_REPRODUCTION_NOT_ESTABLISHED"
          assert q["capacity_n"] == 4096.0 and q["capacity_f"] == 4096.0
          assert q["capacity_exhausted"] is False
          assert q["daughter_a_first_fission"] is not None
          assert q["daughter_b_first_fission"] is not None
          assert q["resource_unit_n"] > 0 and q["resource_unit_f"] > 0
          assert q["finite_spatial_world"] == "RUN"
          assert q["finite_resource_fissions"] == 0
          assert q["transfer_disabled_fissions"] == 0
          assert q["zero_resource_fissions"] == 0
          assert q["resource_causal_reproduction"] == "NOT_ESTABLISHED"
          assert q["heritable_ecological_phenotype"] == "NOT_REACHED"
          assert q["environment_dependent_evolution"] == "NOT_ESTABLISHED"
          assert q["next_execution_started"] is False
          assert q["architect_acceptance"] == "PENDING"

          for name in ("finite_membrane_daughter_a.json", "finite_membrane_daughter_b.json"):
              arm = json.loads((root / name).read_text())
              assert arm["first_whole_membrane_transfer"] == 1
              assert arm["first_fission_step"] is not None
              assert arm["fissions"] == 1
              assert arm["remaining_inventory_n"] > 0
              assert arm["remaining_inventory_f"] > 0
              assert arm["invalid"] is False

          closure = json.loads((root / "world_material_closure.json").read_text())
          assert closure["pass"] is True
          energy = json.loads((root / "energetic_closure.json").read_text())
          assert energy["pass"] is True and energy["reserve"] == "OFF"
          assert json.loads((root / "finite_membrane_calibration_contract.json").read_text())["all_membrane_segments"] is True
          assert json.loads((root / "forbidden_information_audit.json").read_text())["resource_info_to_behavior"] == "NONE"
          assert json.loads((root / "entry005_028_preservation.json").read_text())["status"] == "PASS"
          assert json.loads((root / "closure003_preservation.json").read_text())["status"] == "PASS"
          m1 = json.loads((root / "m1_preservation.json").read_text())
          assert m1["source_changed"] is False
          assert (m1["v2_d087"], m1["v3_d087"], m1["v4_d087"]) == ("8/8", "8/8", "7/8")
          assert m1["v4_vector"] == [True, True, False, True, True, True, True, True]
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert all(item["present"] for item in manifest["files"])
          print("CLOSURE-003-R1 whole-membrane calibration, finite-unit, spatial-stop, and preservation gates passed")
          PY

      - name: Run preservation, downstream, and governance checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p regulatory-core finite_world -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          python3 ../scripts/validate_governance.py --mode ADOPTED

      - name: Record CLOSURE-003-R1 artifact digest
        if: always()
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021m2closure003r1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dcdev021m2closure003r1.sha256"

      - name: Upload CLOSURE-003-R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-m2-closure003r1-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021m2closure003r1/
            ${{ runner.temp }}/dcdev021m2closure003r1.sha256
          if-no-files-found: warn
