name: DC-DEV-020-M1 REPLAN-002-R4 V4 contract-aware preservation qualification

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check crates/phase1-certifier/src/sim.rs examples/dcdev020m1replan002r4_v4_contract_aware_preservation.rs
      - name: Verify bounded R4 diff
        run: |
          python3 - <<'PY'
          import subprocess

          start = 'ad1642ec3b2e565e0651efe3daf36e0390351dfb'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/RECORD.md',
              '.github/workflows/dc-dev-020m1replan002r4.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/crates/phase1-certifier/src/sim.rs',
              'digital-protocell/examples/dcdev020m1replan002r4_v4_contract_aware_preservation.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1replan002r4/dcdev020m1replan002r4_v4_contract_aware_preservation.md',
          }
          allowed |= {
              f'digital-protocell/experiments/generated/dcdev020m1replan002r4/{name}'
              for name in ('protocol.json', 'tracer_semantics.json', 'd087_results.json',
                           'causal_starvation.json', 'starvation_fate.json', 'r1_preservation.json',
                           'historical_preservation.json', 'qualification.json', 'artifact_manifest.json')
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected R4 paths: {sorted(unexpected)}')
          print('DCDEV020M1REPLAN002R4_BOUNDED_DIFF_PASS')
          PY
      - name: D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r4/ci/v2_d087
      - name: D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r4/ci/v3_d087
      - name: D-087 MaturationCoupledV4 raw reproduction
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
          DCDEV020M1REPLAN002R1_V4: '1'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1replan002r4/ci/v4_d087
      - name: Run R4 qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1REPLAN002R4_OUTPUT: experiments/generated/dcdev020m1replan002r4/ci
          DCDEV020M1REPLAN002R4_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1replan002r4-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1replan002r4_v4_contract_aware_preservation --release --quiet
      - name: Verify R4 compact evidence
        working-directory: digital-protocell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('experiments/generated/dcdev020m1replan002r4/ci')
          names = ('protocol.json', 'tracer_semantics.json', 'd087_results.json',
                   'causal_starvation.json', 'starvation_fate.json', 'r1_preservation.json',
                   'historical_preservation.json', 'qualification.json', 'artifact_manifest.json')
          for name in names:
              assert (base / name).is_file(), f'missing {base/name}'
          q = json.loads((base / 'qualification.json').read_text())
          assert q['starting_head'] == 'ad1642ec3b2e565e0651efe3daf36e0390351dfb'
          assert q['v2_d087'] is True and q['v3_d087'] is True
          assert q['v4_d087'] == [True, True, False, True, True, True, True, True]
          assert q['v4_sole_historical_failure'] is True
          assert q['causal_starvation_150k'] is True
          assert q['physical_trajectory_parity'] is True
          assert q['r1_capabilities_preserved'] is True
          assert q['historical_preservation'] is True
          assert q['classification'] == 'M1_V4_CONTRACT_AWARE_PRESERVATION_QUALIFIED'
          assert q['next_execution_started'] is False
          print('DCDEV020M1REPLAN002R4_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: R1 and R2 preservation tests
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r1_maturation_coupled_production_candidate -- --nocapture
          cargo +1.89.0 test -p phase1-certifier --example dcdev020m1replan002r2_d087_v4_lifecycle_semantics_audit -- --nocapture
      - name: Phase-1 and preservation suites
        working-directory: digital-protocell
        run: |
          cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1replan002r4-v4-contract-aware-preservation-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1replan002r4/ci/**/*.json
