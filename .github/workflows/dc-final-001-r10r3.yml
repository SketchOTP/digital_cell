name: DC-FINAL-001-R10R3 D096 activated-material integration

on:
  push:
    branches: [codex/dc-final-001-r10r3-d096-activated-material]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r10r3-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R10R2 authority and bounded R10R3 scope
        run: |
          set -euo pipefail
          start=2a9d0307ec9d99e4ae2347b50dd9993eef9fa8c4
          scientific=895d89f35455ea109e9da288105e71736f616bf3
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e "$scientific"^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r10r3.yml',
              'digital-protocell/crates/chemistry-core/src/d096_allocation.rs',
              'digital-protocell/crates/chemistry-core/src/material_mesh.rs',
              'digital-protocell/crates/chemistry-core/tests/d096_tests.rs',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r4_evolution.rs',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r10r3_',
              'digital-protocell/experiments/dcfinal001_r10r3_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r10r3/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '2a9d0307ec9d99e4ae2347b50dd9993eef9fa8c4..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          forbidden = [
              path for path in changed
              if path.startswith('digital-protocell/crates/chemistry-core/src/')
              and path not in {
                  'digital-protocell/crates/chemistry-core/src/d096_allocation.rs',
                  'digital-protocell/crates/chemistry-core/src/material_mesh.rs',
              }
          ]
          assert not forbidden, forbidden
          PY
          gh run view 34428948113 --repo SketchOTP/digital_cell \
            --json conclusion,headSha --jq '.conclusion + " " + .headSha' \
            | grep '^success 2a9d0307ec9d99e4ae2347b50dd9993eef9fa8c4$'
          gh api repos/SketchOTP/digital_cell/actions/runs/34428948113/artifacts \
            --jq '.artifacts[] | select(.name == "dcfinal001r10r2") | .archive_download_url' \
            | head -1 > "$RUNNER_TEMP/r10r2-artifact-url"
          test -s "$RUNNER_TEMP/r10r2-artifact-url"
          gh api "$(cat "$RUNNER_TEMP/r10r2-artifact-url")" > "$RUNNER_TEMP/r10r2.zip"
          echo '6dfa72dc8728b6f8af5f6a7c574327ab9f108059eb9ee574d130a9f98708eefb  '"$RUNNER_TEMP/r10r2.zip" | sha256sum -c -
          gh pr view 44 --repo SketchOTP/digital_cell \
            --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr == {
              'state': 'OPEN', 'isDraft': True, 'mergedAt': None,
              'headRefOid': 'fb77f472b1519a9e0f713833efba5b1d403f4723',
          }, pr
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.89.0 rustfmt

      - name: Replay D096 integration and reproduction gates
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r3_d096v1_reproduction -- \
            --output "$RUNNER_TEMP/d096v1.json"
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r3_budget_diagnostics -- \
            --output "$RUNNER_TEMP/budget.json"
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r3_d096v2_reproduction -- \
            --output "$RUNNER_TEMP/d096v2.json"
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10_signed_stress -- \
            --output "$RUNNER_TEMP/r10-control.json"
          python3 experiments/dcfinal001_r10r3_evidence.py \
            --head 895d89f35455ea109e9da288105e71736f616bf3 \
            --budget "$RUNNER_TEMP/budget.json" \
            --v1 "$RUNNER_TEMP/d096v1.json" \
            --v2 "$RUNNER_TEMP/d096v2.json" \
            --r10-control "$RUNNER_TEMP/r10-control.json" \
            --r10 experiments/generated/dcfinal001r10 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r10r3 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          v1 = json.loads((root / 'd096v1.json').read_text())
          v2 = json.loads((root / 'd096v2.json').read_text())
          assert v1['counts'] == {
              'growth_qualified': 10,
              'geometry_valid_fissions': 0,
              'full_state_viable_daughter_pairs': 0,
          }
          assert v2['counts'] == {
              'growth_qualified': 10,
              'geometry_valid_fissions': 1,
              'full_state_viable_daughter_pairs': 1,
          }
          assert not v1['robust_reproduction']
          assert not v2['robust_reproduction']
          assert all(
              row['expression_budget']['expression_structural_draw'] == 0
              and row['expression_budget']['expression_failures'] == 0
              for row in v2['runs']
          )
          PY

      - name: Preserve D096-v1, R10, and M1-M3 surfaces
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -q -p regulatory-core
          cargo +1.89.0 test --locked -q -p chemistry-core \
            --test d096_tests \
            --test r8_v4_closure_consistency_tests \
            --test r4_contract_topology_tests \
            --test d088_tests \
            --test d091_tests
          cargo +1.89.0 test --locked -q -p evolution-harness
          cargo +1.89.0 test --locked -q -p m2-lifeform-runtime --bin digital-cell-final-lifeform
          cargo +1.89.0 check --locked -q -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Validate formatting and evidence manifest
        run: |
          set -euo pipefail
          rustfmt +1.89.0 --edition 2021 --check \
            digital-protocell/crates/chemistry-core/src/d096_allocation.rs \
            digital-protocell/crates/chemistry-core/src/material_mesh.rs \
            digital-protocell/crates/chemistry-core/tests/d096_tests.rs \
            digital-protocell/examples/dcfinal001_r4_evolution.rs \
            digital-protocell/examples/dcfinal001_r5_v4_neck.rs \
            digital-protocell/examples/dcfinal001_r10r3_budget_diagnostics.rs \
            digital-protocell/examples/dcfinal001_r10r3_d096v1_reproduction.rs \
            digital-protocell/examples/dcfinal001_r10r3_d096v2_reproduction.rs
          python3 -m py_compile digital-protocell/experiments/dcfinal001_r10r3_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('digital-protocell/experiments/generated/dcfinal001r10r3')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY
          git diff --check

      - name: Upload exact-head R10R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r10r3
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r10r3
            ${{ runner.temp }}/d096v1.json
            ${{ runner.temp }}/budget.json
            ${{ runner.temp }}/d096v2.json
            ${{ runner.temp }}/r10-control.json
