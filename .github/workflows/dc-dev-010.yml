name: DC-DEV-010 passive directional substrate audit

on:
  pull_request:
    branches:
      - strategy/dc-dev-009-motility-feasibility-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-010-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate DC-DEV-010 failure evidence and boundary
        env:
          ENTRY_COMMIT: 8d6fe59397cabfa47bc1d8103acd68f544acc190
          R1_ENTRY_COMMIT: b4178417e30907835183c7f9c16a639bdd8d31db
          R2_ENTRY_COMMIT: 16503a73d91f2c1e239206b73e69af1fee0fcf60
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev010")
          r1_root = Path("digital-protocell/experiments/generated/dcdev010r1")
          r2_root = Path("digital-protocell/experiments/generated/dcdev010r2")
          required = [
              "protocol.json", "passivity.json", "matched_arms.json",
              "directional_coupling.json", "step_ledger.json",
              "artifact_analysis.json", "production_boundary.json",
              "final_manifest.json",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing original artifacts: {missing}")
          r1_missing = [name for name in [*required, "mechanical_rest.json"] if not (r1_root / name).is_file()]
          if r1_missing:
              raise SystemExit(f"missing R1 artifacts: {r1_missing}")
          r2_required = [
              "protocol.json", "force_components.json", "arm_summaries.json",
              "step_ledger.json", "artifact_analysis.json", "production_boundary.json",
              "final_manifest.json",
          ]
          r2_missing = [name for name in r2_required if not (r2_root / name).is_file()]
          if r2_missing:
              raise SystemExit(f"missing R2 artifacts: {r2_missing}")
          data = {name: json.loads((root / name).read_text()) for name in required}
          r1 = {name: json.loads((r1_root / name).read_text()) for name in [*required, "mechanical_rest.json"]}
          protocol = data["protocol.json"]
          final = data["final_manifest.json"]
          if protocol["entry_commit"] != "8d6fe59397cabfa47bc1d8103acd68f544acc190":
              raise SystemExit("wrong entry commit")
          if protocol["parameter_screening"] is not False:
              raise SystemExit("parameter screening must remain false")
          if protocol["substrate_mechanisms"] != 1:
              raise SystemExit("more than one substrate mechanism")
          if final["conclusion"] != "DCDEV010_DIRECTIONAL_SUBSTRATE_TRANSLATION_NOT_ESTABLISHED":
              raise SystemExit("unexpected scientific conclusion")
          if final["first_failed_gate"] != "GATE1_PASSIVITY_AND_MOTOR_OFF_NO_PROPULSION":
              raise SystemExit("unexpected first failed gate")
          if final["next_execution_started"] is not False:
              raise SystemExit("next execution must remain stopped")
          passivity = data["passivity.json"]
          if passivity["maximum_positive_substrate_work"] > passivity["work_tolerance"]:
              raise SystemExit("substrate positive work exceeded tolerance")
          arms = data["matched_arms.json"]
          if abs(arms["motor_off_directional"]["projected_displacement"]) <= arms["translation_tolerance"]:
              raise SystemExit("expected motor-off failure evidence is absent")
          if not data["production_boundary.json"]["disabled_substrate_legacy_parity"]:
              raise SystemExit("legacy parity failed")
          r1_protocol = r1["protocol.json"]
          r1_final = r1["final_manifest.json"]
          r1_rest = r1["mechanical_rest.json"]
          if r1_protocol["entry_commit"] != "b4178417e30907835183c7f9c16a639bdd8d31db":
              raise SystemExit("wrong R1 entry commit")
          if r1_protocol["translation_tolerance"] != 5.3290705182007514e-11:
              raise SystemExit("R1 translation tolerance drifted")
          if r1_final["next_execution_started"] is not False:
              raise SystemExit("R1 next execution must remain stopped")
          if r1_final["conclusion"] != "DCDEV010R1_BASELINE_MECHANICAL_REST_NOT_ESTABLISHED":
              raise SystemExit("unexpected R1 conclusion")
          if r1_final["first_failed_gate"] != "GATE1_BASELINE_MECHANICAL_REST":
              raise SystemExit("unexpected R1 first failed gate")
          if r1_rest["rest_achieved"] is not False:
              raise SystemExit("R1 must record the baseline rest stop")
          if not r1_rest["chemistry_resource_state_preserved"]:
              raise SystemExit("R1 settlement changed chemistry/resource state")
          r2 = {name: json.loads((r2_root / name).read_text()) for name in r2_required}
          r2_protocol = r2["protocol.json"]
          r2_final = r2["final_manifest.json"]
          r2_force = r2["force_components.json"]
          r2_boundary = r2["production_boundary.json"]
          r2_arms = r2["arm_summaries.json"]
          if r2_protocol["entry_commit"] != "16503a73d91f2c1e239206b73e69af1fee0fcf60":
              raise SystemExit("wrong R2 entry commit")
          if r2_protocol["horizon_steps"] != 5000:
              raise SystemExit("R2 horizon must remain exactly 5000")
          if r2_protocol["fixed_windows"] != {"early": [0, 999], "middle": [2000, 2999], "late": [4000, 4999]}:
              raise SystemExit("R2 analysis windows drifted")
          if r2_final["conclusion"] != "DCDEV010R2_BASELINE_FORCE_BALANCE_AUDIT_COMPLETE":
              raise SystemExit("unexpected R2 conclusion")
          if r2_final["classification"] not in {
              "DCDEV010R2_BASELINE_EQUILIBRIUM_APPROACH_SUPPORTED",
              "DCDEV010R2_PERSISTENT_BASELINE_MECHANICS_RESIDUAL_CONFIRMED",
              "DCDEV010R2_DIRECTIONAL_SUBSTRATE_SPECIFIC_RESIDUAL_CONFIRMED",
              "DCDEV010R2_BASELINE_EQUILIBRIUM_AUDIT_INCONCLUSIVE",
          }:
              raise SystemExit("invalid R2 classification")
          if not r2_final["gate1_observer_parity"] or not r2_force["trajectory_parity"]:
              raise SystemExit("R2 observer parity failed")
          if r2_force["maximum_parity_error"] > r2_force["parity_tolerance"]:
              raise SystemExit("R2 force decomposition parity exceeded tolerance")
          if not r2_force["per_vertex_vectors_recorded"] or not r2_force["organism_wide_vector_sums_recorded"]:
              raise SystemExit("R2 force provenance incomplete")
          if not r2_boundary["observer_only"] or r2_boundary["production_behavior_changed"]:
              raise SystemExit("R2 crossed observer-only boundary")
          if not r2_boundary["chemistry_resource_state_preserved"] or not r2_boundary["no_dcdev011_started"]:
              raise SystemExit("R2 preservation boundary failed")
          for arm in ["legacy_passive", "isotropic_passive", "directional_passive"]:
              if r2_arms[arm]["steps"] != 5000:
                  raise SystemExit(f"R2 arm {arm} did not execute 5000 steps")
          print(f"validated {len(required)} original and {len(r1)} R1 artifacts")
          PY
          changed="$(git diff --name-only "$ENTRY_COMMIT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then
            echo "DC-DEV-010 may not modify chemistry-core"
            exit 1
          fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustup run 1.89.0 rustfmt --edition 2021 --check \
            examples/dcdev010_gate_assay.rs \
            crates/regulatory-core/src/contractility.rs \
            crates/regulatory-core/src/substrate_traction.rs \
            crates/regulatory-core/src/lib.rs

      - name: Production substrate tests
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p regulatory-core substrate_traction -- --nocapture

      - name: Preserve original DC-DEV-010 audit artifacts
        run: |
          test -f digital-protocell/experiments/generated/dcdev010/final_manifest.json
          test "$(python3 -c 'import json; print(json.load(open("digital-protocell/experiments/generated/dcdev010/final_manifest.json"))["conclusion"])')" = "DCDEV010_DIRECTIONAL_SUBSTRATE_TRANSLATION_NOT_ESTABLISHED"

      - name: Run DC-DEV-010-R1 mechanical-rest audit
        working-directory: digital-protocell
        run: cargo +1.89.0 run -p regulatory-core --example dcdev010_gate_assay -- experiments/generated/dcdev010r1

      - name: Run DC-DEV-010-R2 force-balance audit
        working-directory: digital-protocell
        run: cargo +1.89.0 run -p regulatory-core --example dcdev010_gate_assay -- experiments/generated/dcdev010r2

      - name: Preservation assays through DC-DEV-009
        working-directory: digital-protocell
        run: |
          tmp_dir="$(mktemp -d)"
          cargo +1.89.0 run -p regulatory-core --example dcdev002_gate_assay -- "$tmp_dir/dcdev002"
          cargo +1.89.0 run -p regulatory-core --example dcdev003_gate_assay -- "$tmp_dir/dcdev003"
          cargo +1.89.0 run -p regulatory-core --example dcdev004_gate_assay -- "$tmp_dir/dcdev004"
          cargo +1.89.0 run -p regulatory-core --example dcdev005_gate_assay -- "$tmp_dir/dcdev005"
          cargo +1.89.0 run -p regulatory-core --example dcdev006_gate_assay -- "$tmp_dir/dcdev006"
          cargo +1.89.0 run -p regulatory-core --example dcdev007_gate_assay -- "$tmp_dir/dcdev007"
          cargo +1.89.0 run -p regulatory-core --example dcdev008_gate_assay -- "$tmp_dir/dcdev008"
          cargo +1.89.0 run -p regulatory-core --example dcdev009_gate_assay -- "$tmp_dir/dcdev009"

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
