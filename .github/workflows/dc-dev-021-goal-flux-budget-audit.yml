name: DC-DEV-021 goal unified flux budget and preservation audit

on:
  push:
    branches:
      - m2/dc-dev-021-goal-post-fission-ecological-reentry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flux-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=c51e5d997099b8cac703b3d0345ebf39cab729b5
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines())
          allowed = {
              '.agent/CURRENT.md', '.agent/LEARNINGS.md', '.agent/OUTCOMES.md',
              '.agent/RECORD.md',
              '.github/workflows/dc-dev-021-goal-flux-budget-audit.yml',
              '.github/workflows/dc-dev-021-goal-post-fission-ecological-reentry.yml',
              'docs/goal-unified-flux-budget-audit-r7.md',
              'docs/goal-material-flow-architecture-selection-r8.md',
              'scripts/dcdev021_goal_flux_budget_audit.py',
              'digital-protocell/crates/chemistry-core/src/material_mesh.rs',
          }
          prefix = 'digital-protocell/experiments/generated/dcdev021goalmaterialfluxbudgetr7/'
          unexpected = {p for p in changed if p not in allowed and not p.startswith(prefix)}
          assert not unexpected, sorted(unexpected)
          assert not any(p.startswith(('digital-protocell/crates/regulatory-core/src/',
                                      'digital-protocell/crates/phase1-certifier/src/',
                                      'digital-protocell/crates/evolution-harness/src/'))
                         for p in changed)
          PY

      - name: Build runtime and run the common flux ledger
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked --release -p m2-lifeform-runtime
          python3 ../scripts/dcdev021_goal_flux_budget_audit.py \
            --binary target/release/digital-protocell-m2-runtime \
            --reference experiments/generated/dcdev021m2closure003r1/whole_membrane_reference.json \
            --output experiments/generated/dcdev021goalmaterialfluxbudgetr7

      - name: Validate first divergence and controls
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('experiments/generated/dcdev021goalmaterialfluxbudgetr7')
          q = json.loads((root / 'qualification.json').read_text())
          d = json.loads((root / 'first_divergence.json').read_text())
          ledger = json.loads((root / 'common_flux_ledger.json').read_text())
          assert q['classification'] == 'GOAL_AGENT_PROVISIONAL_FLUX_LEDGER_FIRST_DIVERGENCE_IDENTIFIED'
          assert q['assimilation_architecture'] == 'INVESTIGATE_NOT_ACCEPTED'
          assert d['stage'] == 'environmental_n_f_transferred'
          assert d['first_common_checkpoint'] == 1
          assert ledger['comparisons'][0]['spatial_active']['environmental_n_transferred'] > 0
          assert ledger['comparisons'][0]['transfer_disabled']['environmental_n_transferred'] == 0
          final = ledger['comparisons'][-1]
          assert final['spatial_active']['fission_events'] == 0
          assert final['transfer_disabled']['fission_events'] == 0
          assert abs(final['spatial_active']['world_n_conservation_error']) <= 1e-12
          assert abs(final['spatial_active']['world_f_conservation_error']) <= 1e-12
          print('unified flux ledger and transfer-disabled control passed')
          PY

      - name: Preserve assimilation validity, D-088, D-091, and geometry boundaries
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p chemistry-core --lib material_mesh::tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime -- --nocapture
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('experiments/generated/dcdev021m2closure003r1')
          m1 = json.loads((root / 'm1_preservation.json').read_text())
          assert m1['v2_d087'] == '8/8'
          assert m1['v3_d087'] == '8/8'
          assert m1['v4_d087'] == '7/8'
          assert m1['v4_vector'] == [True, True, False, True, True, True, True, True]
          print('canonical D-087 preservation boundary passed')
          PY

      - name: Record known governance baseline status
        working-directory: digital-protocell
        run: |
          set +e
          python3 ../scripts/validate_governance.py --mode ADOPTED
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          Path('experiments/generated/dcdev021goalmaterialfluxbudgetr7/governance_validation.json').write_text(
              json.dumps({
                  'status': status,
                  'classification': 'KNOWN_BASELINE_FAILURE' if status else 'PASSED',
                  'promoted_to_project_acceptance': False,
              }, indent=2) + '\n'
          )
          PY
          echo "repo-wide governance validator status=$status; recorded without promoting it to project acceptance"

      - name: Hash and upload compact evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021goalmaterialfluxbudgetr7 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/dcdev021-goal-flux-budget.sha256"

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-goal-flux-budget-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021goalmaterialfluxbudgetr7/
            ${{ runner.temp }}/dcdev021-goal-flux-budget.sha256
