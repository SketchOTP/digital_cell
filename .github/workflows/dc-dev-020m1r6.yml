name: DC-DEV-020-M1-R6 full runtime integration

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  full-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: |
          rustfmt +1.89.0 --edition 2021 --check \
            examples/dcdev020m1r6_full_runtime.rs
      - name: Verify bounded R6 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '9ff1bba4a48caf582e4598b4030d746e4360a61b'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', start, 'HEAD'], text=True
          ).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md', 'STORAGE_MAP.md',
              '.github/workflows/dc-dev-020m1r6.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r6_full_runtime.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r6/full_runtime_integration.md',
              'digital-protocell/experiments/generated/dcdev020m1r6/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r6/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r6/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r6/artifact_manifest.json',
          }
          assert set(changed) <= allowed, f'unexpected R6 paths: {sorted(set(changed) - allowed)}'
          forbidden = [path for path in changed if any(token in path.lower() for token in (
              'dc-dev-021', 'recycl', 'salvage', 'chemistry-core/src',
              'mesh_reactions.rs', 'mesh_transport.rs', 'mesh_mechanics.rs',
              'mesh_fission.rs', 'phase1-certifier/src/gates.rs',
              'phase1-certifier/src/frozen.rs',
          ))]
          assert not forbidden, f'forbidden R6 paths: {forbidden}'
          print('DCDEV020M1R6_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6/ci/v2_d087
      - name: Fresh R6 full-runtime assay
        working-directory: digital-protocell
        env:
          DCDEV020M1R6_OUTPUT: experiments/generated/dcdev020m1r6/ci
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6_full_runtime --release --quiet
      - name: Verify R6 artifacts and fail-closed gates
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  print(f'::error title=R6 verifier::{message}')
                  raise SystemExit(1)

          base = Path('experiments/generated/dcdev020m1r6')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R6-FULL-RUNTIME-INTEGRATION-CERT-001', 'directive mismatch')
          require(protocol['starting_head'] == '9ff1bba4a48caf582e4598b4030d746e4360a61b', 'starting head mismatch')
          require(protocol['candidate']['mesh_schema'] == 'ConservativeV3', 'candidate schema mismatch')
          require(protocol['candidate']['reserve'] == 'OFF', 'reserve not off')
          require(protocol['candidate']['coupled_source'] == 'OFF', 'coupled source enabled')
          require(protocol['resource']['replenishment_events'] == 0, 'replenishment not zero')
          require(results['classification'] in {
              'M1_FULL_RUNTIME_CERTIFIED',
              'M1_FULL_RUNTIME_HOMEOSTASIS_REGRESSION',
              'M1_FULL_RUNTIME_DEATH_REGRESSION',
              'M1_FULL_RUNTIME_CERTIFICATION_INVALID',
          }, f"unknown classification={results['classification']}")
          require(results['production_default_after'] == 'UNCHANGED', 'production default changed')
          require(results['coupled_source_selected'] is False, 'coupled source selected')
          require(results['m2_authorized'] is False and results['dc_dev_021_authorized'] is False, 'downstream work authorized')
          require(results['next_execution_started'] is False, 'next execution started')
          fed = results['arm_fed']
          no_resource = results['arm_no_resource']
          removal = results['arm_feed_remove']
          death = results['full_runtime_death']
          require(fed['source']['replenishment_events'] == 0, 'fed replenishment')
          require(fed['source']['max_world_delivery_residual'] <= 1e-8, 'fed world boundary residual')
          require(no_resource['organized_material_delta'] < fed['organized_material_delta'], 'no-resource control not worse')
          require(removal['post_removal_delivery'] == 0.0, 'post-removal delivery nonzero')
          require(removal['organized_material_delta'] < 0.0, 'post-removal material did not decline')
          require(death['bound_exhausted_without_rupture'] or death['rupture_step'] is not None, 'death continuation has no termination evidence')
          for report, contract in ((json.loads((fresh/'v3_d087/certification/report.json').read_text()), 'ConservativeV3'), (json.loads((fresh/'v2_d087/certification/report.json').read_text()), 'ConservativeV2')):
              require(report['mesh_contract'] == contract, f"mesh contract={report.get('mesh_contract')}")
              require(report['reserve_enabled'] is False, 'reserve enabled')
              require([report[f'gate{i}']['pass'] for i in range(8)] == [True] * 8, f'D087 gates failed for {contract}')
          require(qualification['e0_authority'] is True and qualification['e1_runtime_inventory'] is True, 'authority/runtime inventory failed')
          require(qualification['e5_d087_preservation'] is True, 'D087 preservation failed')
          require(qualification['next_execution_started'] is False, 'qualification advanced')
          print('DCDEV020M1R6_ARTIFACT_AND_FAIL_CLOSED_GATE_VERIFICATION_PASS')
          PY
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics -- --nocapture
      - name: D-091 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: D-088 preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r6-full-runtime-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r6/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6/results.json
            digital-protocell/experiments/generated/dcdev020m1r6/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r6/ci/v3_d087/certification/report.json
            digital-protocell/experiments/generated/dcdev020m1r6/ci/v2_d087/certification/report.json
