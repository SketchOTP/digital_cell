name: DC-DEV-020-M1-R6-R4 homeostasis contact causal audit

on:
  push:
    branches:
      - strategy/dc-dev-020r9-mesh-contract-requalification
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even

permissions:
  contents: read

jobs:
  homeostasis-contact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python3 scripts/validate_governance.py --mode ADOPTED
      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustfmt +1.89.0 --edition 2021 --check examples/dcdev020m1r6r4_homeostasis_contact_audit.rs
      - name: Verify bounded R6-R4 diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          start = '69b6133a5f76d3c7839705c78922c7452ad5d550'
          changed = subprocess.check_output(['git', 'diff', '--name-only', start, 'HEAD'], text=True).splitlines()
          allowed = {
              '.agent/CURRENT.md', '.agent/DIRECTIVES.md', '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md', '.agent/REPO_MAP.md',
              '.github/workflows/dc-dev-020m1r6r4.yml',
              'digital-protocell/crates/phase1-certifier/Cargo.toml',
              'digital-protocell/examples/dcdev020m1r6r4_homeostasis_contact_audit.rs',
              'digital-protocell/docs/strategy/developmental_sensorimotor/dcdev020m1r6r4/homeostasis_contact_audit.md',
              'digital-protocell/experiments/generated/dcdev020m1r6r4/protocol.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r4/results.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r4/qualification.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r4/preservation.json',
              'digital-protocell/experiments/generated/dcdev020m1r6r4/artifact_manifest.json',
          }
          assert set(changed) <= allowed, f'unexpected R6-R4 paths: {sorted(set(changed) - allowed)}'
          print('DCDEV020M1R6R4_BOUNDED_DIFF_PASS')
          PY
      - name: Actual D-087 ConservativeV3 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV3
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r4/ci/v3_d087
      - name: Actual D-087 ConservativeV2 preservation
        working-directory: digital-protocell
        env:
          DCDEV020R9R3_CONTRACT: ConservativeV2
          DCDEV020R9R3_RESERVE: '0'
        run: cargo +1.89.0 run -p phase1-certifier --bin phase1_certification --release --quiet -- --output experiments/generated/dcdev020m1r6r4/ci/v2_d087
      - name: Run R6-R4 qualification
        working-directory: digital-protocell
        env:
          DCDEV020M1R6R4_OUTPUT: experiments/generated/dcdev020m1r6r4/ci
          DCDEV020M1R6R4_DENSE_OUTPUT: ${{ runner.temp }}/dcdev020m1r6r4-dense
        run: cargo +1.89.0 run -p phase1-certifier --example dcdev020m1r6r4_homeostasis_contact_audit --release --quiet
      - name: Verify R6-R4 compact evidence
        working-directory: digital-protocell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  print(f'::error title=R6-R4 verifier::{message}')
                  raise SystemExit(f'R6-R4 verifier failure: {message}')

          base = Path('experiments/generated/dcdev020m1r6r4')
          fresh = base / 'ci'
          names = ('protocol.json', 'results.json', 'qualification.json', 'preservation.json', 'artifact_manifest.json')
          for root in (base, fresh):
              for name in names:
                  require((root / name).is_file(), f'missing {root/name}')
          protocol = json.loads((base / 'protocol.json').read_text())
          fresh_protocol = json.loads((fresh / 'protocol.json').read_text())
          results = json.loads((fresh / 'results.json').read_text())
          qualification = json.loads((fresh / 'qualification.json').read_text())
          preservation = json.loads((fresh / 'preservation.json').read_text())
          require(fresh_protocol == protocol, 'fresh protocol differs from committed protocol')
          require(protocol['directive'] == 'DC-DEV-020-M1-R6-R4-HOMEOSTASIS-CONTACT-CAUSAL-AUDIT-001', 'directive mismatch')
          require(protocol['starting_head'] == '69b6133a5f76d3c7839705c78922c7452ad5d550', 'starting head mismatch')
          require(protocol['runtime_contract'] == {
              'material': 'GeometryConservativeV3',
              'chemistry': 'ConservativeV3',
              'reserve': 'OFF',
              'transport': 'unchanged uncoupled V1 finite spatial transport',
              'world': 'FINITE_SPATIAL_BACKING_RESERVOIR_V1',
          }, 'runtime identity mismatch')
          require(protocol['resource']['center'] == [4.8, 0.0], 'resource center changed')
          require(protocol['resource']['radius'] == 1.5, 'resource radius changed')
          require(protocol['resource']['replenishment_events'] == 0, 'replenishment was enabled')
          require(qualification['observer_only'] is True, 'observer-only boundary missing')
          require(qualification['next_execution_started'] is False, 'next execution started')
          require(results['classification'] in {
              'M1_FULL_RUNTIME_CONTACT_LOSS_CAUSALLY_DOMINANT',
              'M1_FULL_RUNTIME_EMBODIED_DEMAND_DOMINANT',
              'M1_FULL_RUNTIME_TRANSPORT_DRIVE_LIMITED',
              'M1_FULL_RUNTIME_CONTACT_AND_DEMAND_MIXED',
              'M1_FULL_RUNTIME_HOMEOSTASIS_CAUSE_UNRESOLVED',
          }, f"unexpected classification={results['classification']}")
          require(results['classification'] == 'M1_FULL_RUNTIME_EMBODIED_DEMAND_DOMINANT', 'bounded classification changed')
          require(results['production_changed'] is False, 'production changed')
          require(results['resource_geometry_changed'] is False, 'resource geometry changed')
          require(results['target_added'] is False, 'target was added')
          require(results['parameter_search'] is False, 'parameter search was used')
          actual = results['actual_fed']
          static = results['r5_static_reference']
          frozen = results['geometry_frozen']
          upper = results['contact_upper_bound']
          require(abs(actual['organized_material_delta'] - (-82.9654506509167)) <= 1e-8, 'actual R6 reproduction changed')
          require(abs(actual['source']['n_delivered'] - 14.627590100158915) <= 1e-8, 'actual N delivery changed')
          require(abs(actual['source']['f_delivered'] - 14.627590100158915) <= 1e-8, 'actual F delivery changed')
          require(abs(actual['source']['n_remaining'] - 228.5216579103792) <= 1e-8, 'actual remaining N changed')
          require(actual['contact']['last_positive_delivery_step'] == 849, 'last positive delivery step changed')
          require(actual['contact']['first_permanent_zero_exposure_step'] == 850, 'permanent contact loss step changed')
          require(actual['contact']['cumulative_potential_deficit_n'] > 0.0, 'exposure shadow did not diverge')
          require(actual['closure']['max_unexplained_residual'] <= 1e-8, 'actual closure failed')
          require(static['source']['n_delivered'] > 160.0, 'R5 static delivery was not sustained')
          require(static['organized_material_delta'] >= -1e-8, 'R5 static organized material declined')
          require(frozen['organized_material_delta'] >= -1e-8, 'geometry-frozen diagnostic declined')
          require(static['trajectory_hash'] == frozen['trajectory_hash'], 'geometry-frozen trajectory differs from static reference')
          require(static['final_mesh_hash'] == frozen['final_mesh_hash'], 'geometry-frozen mesh differs from static reference')
          require(upper['source']['n_delivered'] >= 243.14924801053778 - 1e-8, 'upper-bound inventory was not available')
          require(upper['source']['n_remaining'] <= 1e-8, 'upper-bound finite inventory was not accounted')
          require(upper['organized_material_delta'] < 0.0, 'upper-bound demand result changed sign')
          require(upper['final_state']['closed_intact'] is True and upper['final_state']['observer_viable'] is True, 'upper-bound physical state invalid')
          require(results['recovery']['no_state_reset'] is True, 'recovery reset state')
          require(results['recovery_actual'] is False and results['recovery_contact_upper_bound'] is False, 'recovery negative result changed')
          require(results['preservation_pass'] is True, 'D-087 preservation failed')
          require(preservation['historical_v2_d087'] is True and preservation['candidate_v3_d087'] is True, 'D-087 reports were not certified')
          print('DCDEV020M1R6R4_ARTIFACT_VERIFICATION_PASS')
          PY
      - name: Geometry/material preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d098_geometry_material_conservation -- --nocapture
      - name: Phase-1 metrics preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --test metrics_semantics -- --nocapture
      - name: D-088 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture
      - name: D-091 preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d091_tests -- --nocapture
      - name: Evolution harness preservation
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness -- --nocapture
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdev020m1r6r4-homeostasis-contact-evidence
          path: |
            digital-protocell/experiments/generated/dcdev020m1r6r4/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/artifact_manifest.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/ci/protocol.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/ci/results.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/ci/qualification.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/ci/preservation.json
            digital-protocell/experiments/generated/dcdev020m1r6r4/ci/artifact_manifest.json
