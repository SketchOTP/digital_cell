name: DC-FINAL-001-R10R9R4 density-preserving mutation supply

on:
  push:
    branches: [codex/dc-final-001-r10r9r3-buffered-reserve]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r10r9r4-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact authority and bounded scope
        run: |
          set -euo pipefail
          start=31bad212c9a4da81475d79be8f1ba3a71c7e0c74
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - <<'PY'
          import subprocess
          start = '31bad212c9a4da81475d79be8f1ba3a71c7e0c74'
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r10r9r4.yml',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r4_evolution.rs',
              'digital-protocell/examples/dcfinal001_r10r9r4_evolution.rs',
              'digital-protocell/experiments/dcfinal001_r10r9r4_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r10r9r4/',
          )
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{start}..HEAD'], text=True).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY

      - name: Install sanctioned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Run focused checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -q -p chemistry-core --test d091_tests --no-fail-fast
          cargo +1.89.0 check --locked -q -p regulatory-core --example dcfinal001_r10r9r4_evolution

      - name: Run R10R9R3 reproduction preservation
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r3_d091v2_reproduction

      - name: Run mutation-off density controls
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
          DCFINAL001_R10R9R4_BASELINE=1 DCFINAL001_R10R9R4_MUTATION_OFF_ONLY=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r4_evolution -- --output /tmp/dcfinal001_r10r9r4_density_baseline.json
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
          DCFINAL001_R10R9R4_MUTATION_OFF_ONLY=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r4_evolution -- --output /tmp/dcfinal001_r10r9r4_density_scaled_off.json

      - name: Check density parity before mutation-on interpretation
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          b = json.load(open('/tmp/dcfinal001_r10r9r4_density_baseline.json'))
          s = json.load(open('/tmp/dcfinal001_r10r9r4_density_scaled_off.json'))
          assert b['protocol']['founder_multiplicity'] == 150
          assert b['protocol']['open_medium_volume'] == 150.0
          assert s['protocol']['founder_multiplicity'] == 900
          assert s['protocol']['open_medium_volume'] == 900.0
          assert all(c['ledger']['mutations'] == 0 for c in b['campaigns'] + s['campaigns'])
          for sc in s['campaigns']:
              bc = next(x for x in b['campaigns']
                        if x['replicate'] == sc['replicate']
                        and x['environment_sequence'] == sc['environment_sequence'])
              assert sc['ledger']['physical_fissions'] == 6 * bc['ledger']['physical_fissions']
              assert sc['ledger']['post_bootstrap_physical_fissions'] == 6 * bc['ledger']['post_bootstrap_physical_fissions']
              assert sc['ledger']['physical_deaths'] == 6 * bc['ledger']['physical_deaths']
          PY

      - name: Run exact scaled R10R9R4 population assay
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          DCFINAL001_R10R9R1_RESERVE=1 DCFINAL001_R10R9R3_RESERVE=1 \
            cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r10r9r4_evolution -- --output /tmp/dcfinal001_r10r9r4_evolution.json

      - name: Generate and validate R10R9R4 evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/dcfinal001_r10r9r4_evidence.py
          python3 experiments/dcfinal001_r10r9r4_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('experiments/generated/dcfinal001r10r9r4')
          parity = json.loads((root / 'density_scaling_parity.json').read_text())
          assert parity['status'] == 'PASS'
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY
          git diff --check

      - name: Upload exact-head R10R9R4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r10r9r4
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r10r9r4
            /tmp/dcfinal001_r10r9r3_d091v2_reproduction.json
            /tmp/dcfinal001_r10r9r4_density_baseline.json
            /tmp/dcfinal001_r10r9r4_density_scaled_off.json
            /tmp/dcfinal001_r10r9r4_evolution.json
