name: DC-M4-R11 P_TO_M qualification validity

on:
  push:
    branches:
      - codex/dc-final-001-r10r9r5-lifecycle-evidence-recovery
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r11-p-to-m-qualification-validity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R10 authority and R11 source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          r10=8bdcadf4b03c503d0871d02c600849fb2ebfe915
          git merge-base --is-ancestor "$r10" HEAD
          python3 - "$r10" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{start}..HEAD"], text=True
          ).splitlines()
          allowed = (
              ".agent/",
              ".github/workflows/dc-m4-r11-p-to-m-qualification-validity.yml",
              "digital-protocell/crates/regulatory-core/Cargo.toml",
              "digital-protocell/examples/dcfinal001_r4_evolution.rs",
              "digital-protocell/examples/dcfinal001_r5_v4_neck.rs",
              "digital-protocell/examples/dcm4_r11_p_to_m_qualification_validity.rs",
              "digital-protocell/experiments/dcm4_r11_p_to_m_qualification_validity_verify.py",
              "digital-protocell/experiments/generated/dcm4r11ptomqualificationvalidity/",
          )
          unexpected = [
              path for path in changed if not any(path.startswith(prefix) for prefix in allowed)
          ]
          assert not unexpected, unexpected
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Run focused implementation checks
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check --config skip_children=true examples/dcm4_r11_p_to_m_qualification_validity.rs
          python3 -m py_compile experiments/dcm4_r11_p_to_m_qualification_validity_verify.py
          cargo test --locked -q -p regulatory-core --lib
          cargo check --locked -q -p regulatory-core --example dcm4_r11_p_to_m_qualification_validity

      - name: Seal R11 metric contract before snapshot execution
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          mkdir -p experiments/generated/dcm4r11ptomqualificationvalidity/raw
          cargo run --locked -q -p regulatory-core --example dcm4_r11_p_to_m_qualification_validity -- \
            --stage seal --output /tmp/dcm4_r11_seal.json
          python3 experiments/dcm4_r11_p_to_m_qualification_validity_verify.py \
            --repo . --raw /tmp/dcm4_r11_seal.json \
            --output experiments/generated/dcm4r11ptomqualificationvalidity --stage seal

      - name: Execute fixed R8/R10 susceptibility qualification
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo run --locked --release -q -p regulatory-core --example dcm4_r11_p_to_m_qualification_validity -- \
            --stage qualification \
            --output experiments/generated/dcm4r11ptomqualificationvalidity/raw/qualification.json

      - name: Independently verify R11 and seal artifact
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 experiments/dcm4_r11_p_to_m_qualification_validity_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r11ptomqualificationvalidity/raw/qualification.json \
            --output experiments/generated/dcm4r11ptomqualificationvalidity \
            --stage qualification
          sha256sum target/release/examples/dcm4_r11_p_to_m_qualification_validity \
            > experiments/generated/dcm4r11ptomqualificationvalidity/binary_sha256.txt
          python3 experiments/dcm4_r11_p_to_m_qualification_validity_verify.py \
            --repo . \
            --raw experiments/generated/dcm4r11ptomqualificationvalidity/raw/qualification.json \
            --output experiments/generated/dcm4r11ptomqualificationvalidity \
            --stage qualification
          git diff --check

      - name: Confirm downstream stages were not started
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("experiments/generated/dcm4r11ptomqualificationvalidity")
          qualification = json.loads((root / "qualification.json").read_text())
          assert qualification["morphogenesis"] == "NOT_REACHED"
          assert qualification["reproduction"] == "NOT_REACHED"
          assert qualification["population_selection"] == "NOT_REACHED"
          assert qualification["reversal"] == "NOT_REACHED"
          assert qualification["final_integration"] == "NOT_REACHED"
          manifest = json.loads((root / "artifact_manifest.json").read_text())
          assert manifest["exact_head"] == subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert manifest["file_count"] >= 10
          PY

      - name: Upload R11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcm4r11ptomqualificationvalidity-${{ github.sha }}
          if-no-files-found: error
          path: |
            digital-protocell/experiments/generated/dcm4r11ptomqualificationvalidity/
            digital-protocell/experiments/dcm4_r11_p_to_m_qualification_validity_verify.py
            digital-protocell/examples/dcm4_r11_p_to_m_qualification_validity.rs
            digital-protocell/target/release/examples/dcm4_r11_p_to_m_qualification_validity
