name: DC-FINAL-001-R9 refractory curvature-normal cortex

on:
  push:
    branches: [codex/dc-final-001-r9-refractory-curvature-normal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r9-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify R8R1 authority, owner override, and bounded scope
        run: |
          set -euo pipefail
          start=cdeec37274403286bd43efe847d30ec9b4d1593d
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$start" HEAD
          git cat-file -e bf195f5d9f6c2fe555bdec9810e2a16a1ab2cdc3^{commit}
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = (
              '.agent/',
              '.github/workflows/dc-final-001-r9.yml',
              'digital-protocell/crates/regulatory-core/Cargo.toml',
              'digital-protocell/examples/dcfinal001_r5_v4_neck.rs',
              'digital-protocell/examples/dcfinal001_r9_gate1.rs',
              'digital-protocell/examples/dcfinal001_r9_refractory_curvature.rs',
              'digital-protocell/experiments/dcfinal001_r9_evidence.py',
              'digital-protocell/experiments/generated/dcfinal001r9/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'cdeec37274403286bd43efe847d30ec9b4d1593d..HEAD'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          assert not bad, bad
          PY
          gh run view 34396700355 --repo SketchOTP/digital_cell \
            --json conclusion,headSha --jq '.conclusion + " " + .headSha' \
            | grep '^success cdeec37274403286bd43efe847d30ec9b4d1593d$'
          gh pr view 44 --repo SketchOTP/digital_cell \
            --json state,isDraft,mergedAt,headRefOid > "$RUNNER_TEMP/pr44.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr44.json').read_text())
          assert pr == {
              'state': 'OPEN',
              'isDraft': True,
              'mergedAt': None,
              'headRefOid': 'fb77f472b1519a9e0f713833efba5b1d403f4723',
          }, pr
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Replay static-attractor audit and refractory campaign
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r9_gate1 -- --output "$RUNNER_TEMP/r9-gate1.json"
          cargo +1.89.0 run --locked -q --release -p regulatory-core \
            --example dcfinal001_r9_refractory_curvature -- --output "$RUNNER_TEMP/r9.json"
          scientific_head=$(python3 - <<'PY'
          import json
          print(json.load(open('experiments/generated/dcfinal001r9/authority.json'))['result_scientific_head'])
          PY
          )
          python3 experiments/dcfinal001_r9_evidence.py \
            --head "$scientific_head" \
            --raw "$RUNNER_TEMP/r9.json" \
            --gate1 "$RUNNER_TEMP/r9-gate1.json" \
            --r8r1 experiments/generated/dcfinal001r8r1 \
            --output "$RUNNER_TEMP/evidence"
          diff -ru experiments/generated/dcfinal001r9 "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          raw = json.loads((root / 'r9.json').read_text())
          gate1 = json.loads((root / 'r9-gate1.json').read_text())
          assert (gate1['campaign']['growth_qualified'],
                  gate1['campaign']['geometry_valid_fissions'],
                  gate1['campaign']['simple_viable_daughter_pairs']) == (10, 4, 4)
          refractory = raw['refractory_normal']
          assert (refractory['growth_qualified'], refractory['geometry_valid_fissions'],
                  refractory['simple_viable_daughter_pairs']) == (10, 5, 5)
          conditional = raw['conditional_normal_plus_tangential']
          assert conditional['triggered'] is True
          composed = conditional['campaign']
          assert (composed['growth_qualified'], composed['geometry_valid_fissions'],
                  composed['simple_viable_daughter_pairs']) == (10, 2, 2)
          assert raw['controls']['adaptation_disabled_parity']['pass'] is True
          assert raw['controls']['motor_off_passive_parity']['pass'] is True
          assert raw['controls']['zero_a_pass'] is True
          assert raw['remesh_continuity_pass'] is True
          assert raw['refractory_patch_dynamics']['patch_relocation_observed'] is True
          assert raw['normal_energy_closure']['pass'] is True
          assert raw['classification'] == 'V4_ROBUST_PHYSICAL_REPRODUCTION_NOT_ESTABLISHED'
          assert raw['evolution_execution'] == 'NOT_REACHED_GATE7_8_STOP'
          assert raw['next_execution_started'] is False
          PY

      - name: Preserve M1, M2, lifecycle, and tests-only evolution surfaces
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p regulatory-core -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test r8_v4_closure_consistency_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test r4_contract_topology_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d088_tests -- --nocapture
          cargo +1.89.0 test --locked -p chemistry-core --test d091_tests -- --nocapture
          cargo +1.89.0 test --locked -p evolution-harness -- --nocapture
          cargo +1.89.0 test --locked -p m2-lifeform-runtime --bin digital-cell-final-lifeform -- --nocapture
          cargo +1.89.0 check --locked -p godot-bridge
          run_d087() {
            local output="$1" contract="$2" v4="$3"
            if test "$v4" = 1; then
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 DCDEV020M1REPLAN002R1_V4=1 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            else
              DCDEV020R9R3_CONTRACT="$contract" DCDEV020R9R3_RESERVE=0 \
                cargo +1.89.0 run -q -p phase1-certifier --bin phase1_certification --release -- --output "$output"
            fi
          }
          run_d087 "$RUNNER_TEMP/d087-v2" ConservativeV2 0
          run_d087 "$RUNNER_TEMP/d087-v3" ConservativeV3 0
          run_d087 "$RUNNER_TEMP/d087-v4" ConservativeV3 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {
              'v2': [True] * 8,
              'v3': [True] * 8,
              'v4': [True, True, False, True, True, True, True, True],
          }
          for name, vector in expected.items():
              manifest = json.loads((root / f'd087-{name}' / 'manifest.json').read_text())
              assert [manifest[f'gate{i}']['pass'] for i in range(8)] == vector
          PY

      - name: Validate focused formatting and evidence manifest
        run: |
          set -euo pipefail
          rustfmt +1.89.0 --edition 2021 --check \
            digital-protocell/examples/dcfinal001_r5_v4_neck.rs \
            digital-protocell/examples/dcfinal001_r9_gate1.rs \
            digital-protocell/examples/dcfinal001_r9_refractory_curvature.rs
          python3 -m py_compile digital-protocell/experiments/dcfinal001_r9_evidence.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('digital-protocell/experiments/generated/dcfinal001r9')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for row in manifest['files']:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
              assert path.stat().st_size == row['bytes']
          PY

      - name: Upload exact-head R9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcfinal001r9
          if-no-files-found: error
          retention-days: 90
          path: |
            digital-protocell/experiments/generated/dcfinal001r9
            ${{ runner.temp }}/r9-gate1.json
            ${{ runner.temp }}/r9.json
