name: DC-M4 Four-Operator Chemical Work Owners
on:
  push:
    branches: [codex/dc-m4-mechanochemical-work-ownership]
    paths-ignore: [.github/workflows/dc-m4-mechanochemical-acquisition.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Native audits and independent ownership/observation checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owner-evidence"
          python3 -m unittest discover -s scripts -p test_chemical_work_ownership.py -v 2>&1 | tee "$RUNNER_TEMP/owner-evidence/owner-tests.log"
          python3 -m unittest discover -s scripts -p test_mechanochemical_observations.py -v 2>&1 | tee "$RUNNER_TEMP/owner-evidence/observation-tests.log"
          python3 -m unittest discover -s scripts -p test_chemical_work_oracle.py -v 2>&1 | tee "$RUNNER_TEMP/owner-evidence/oracle-tests.log"
          cd digital-protocell
          cargo test --locked -p chemistry-core --features chemical-reference-port --test chemical_reference_port --test chemical_body_port 2>&1 | tee "$RUNNER_TEMP/owner-evidence/native-regressions.log"
          cargo build --locked -p chemistry-core --features chemical-reference-port --example chemical_work_owners 2>&1 | tee "$RUNNER_TEMP/owner-evidence/native-build.log"
          cp target/debug/examples/chemical_work_owners "$RUNNER_TEMP/owner-evidence/native-owner-audit"
          "$RUNNER_TEMP/owner-evidence/native-owner-audit" > "$RUNNER_TEMP/owner-evidence/native-observations.json"
          cd ..
          python3 scripts/chemical_work_ownership.py > "$RUNNER_TEMP/owner-evidence/owner-observations.json"
          python3 scripts/qualify_chemical_work_owners.py --input "$RUNNER_TEMP/owner-evidence/owner-observations.json" --native "$RUNNER_TEMP/owner-evidence/native-observations.json" --output "$RUNNER_TEMP/owner-evidence/owner-qualification.json" > "$RUNNER_TEMP/owner-evidence/owner-qualification.log"
          python3 scripts/mechanochemical_observations.py --source docs/dc-m4-mechanochemical-evidence --output "$RUNNER_TEMP/owner-evidence/physical-observations.json" > "$RUNNER_TEMP/owner-evidence/physical-observations.log"
          python3 scripts/qualify_mechanochemical_observations.py --source docs/dc-m4-mechanochemical-evidence --input "$RUNNER_TEMP/owner-evidence/physical-observations.json" --output "$RUNNER_TEMP/owner-evidence/physical-qualification.json" > "$RUNNER_TEMP/owner-evidence/physical-qualification.log"
          python3 scripts/verify_mechanochemical_owners.py --require-review --output "$RUNNER_TEMP/owner-evidence" > "$RUNNER_TEMP/owner-evidence/scope.log"
          git diff --check a800279a355dc49060d81f805800f0a6def7b7a8
          test -z "$(git status --porcelain)"
          python3 - "$RUNNER_TEMP/owner-evidence" <<'PYCODE'
          import pathlib,json,hashlib,subprocess,sys
          root=pathlib.Path('.');out=pathlib.Path(sys.argv[1]);files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          b={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files if p and (root/p).is_file()},'evidence':{str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}}
          (out/'bindings.json').write_text(json.dumps(b,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dc-m4-mechanochemical-owners-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/owner-evidence/
