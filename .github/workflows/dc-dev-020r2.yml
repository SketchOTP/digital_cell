name: DC-DEV-020-R2 allosteric requalification observer

on:
  pull_request:
    branches:
      - strategy/dc-dev-016-metabolic-break-even
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc-dev-020r2-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install sanctioned rustfmt component
        run: rustup component add rustfmt --toolchain 1.89.0

      - name: Governance ADOPTED validation
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Validate R2 evidence and preservation scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("digital-protocell/experiments/generated/dcdev020r2")
          required = [
              "protocol.json", "results.json", "qualification.json",
              "source_actuation_envelope.json", "literature_review.json",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing R2 artifacts: {missing}")
          protocol = json.loads((root / "protocol.json").read_text())
          results = json.loads((root / "results.json").read_text())
          qualification = json.loads((root / "qualification.json").read_text())
          literature = json.loads((root / "literature_review.json").read_text())
          if protocol["entry_commit"] != "1e242f28152797b512e25cd56c7b718e45d6ca97":
              raise SystemExit("wrong R2 entry authority")
          if protocol["prior_head"] != "876012f8888b074285c55167613471a59d4be25d":
              raise SystemExit("wrong prior R1 head")
          if (protocol["settle_steps"], protocol["deprivation_steps"], protocol["feed_steps"]) != (5000, 480, 480):
              raise SystemExit("R2 horizon changed")
          if protocol["observer_only"] is not True or protocol["production_integration"] is not False:
              raise SystemExit("R2 observer boundary changed")
          if results["observer_only"] is not True or results["production_behavior_changed"] or results["chemistry_behavior_changed"]:
              raise SystemExit("production behavior contamination")
          if results["gate_4_pass"] is not False:
              raise SystemExit("Gate 4 did not fail closed")
          if results["conclusion"] != "DCDEV020_A_ONLY_ALLOSTERIC_COORDINATE_INSUFFICIENT":
              raise SystemExit("unexpected R2 classification")
          if results["implementation_authorized"] or results["next_execution_started"]:
              raise SystemExit("implementation boundary opened")
          if qualification["classification"] != results["conclusion"] or qualification["implementation_authorized"] or qualification["next_execution_started"]:
              raise SystemExit("qualification boundary changed")
          if results["a_only_fit"] is not None:
              raise SystemExit("A-only fit unexpectedly qualified")
          if results["root_solve"]["minimum_constant_break_even_gain"] != 13.9482421875:
              raise SystemExit("break-even root changed")
          if results["sequencing_audit"]["reaction_order_unchanged"] is not True:
              raise SystemExit("reaction sequencing changed")
          if literature["external_constants_imported"] or literature["species_specific_identities_imported"]:
              raise SystemExit("external biology imported")
          print("validated DC-DEV-020-R2 negative observer evidence")
          PY
          git diff --exit-code 1e242f28152797b512e25cd56c7b718e45d6ca97 HEAD -- \
            digital-protocell/experiments/generated/dcdev020/
          changed="$(git diff --name-only 1e242f28152797b512e25cd56c7b718e45d6ca97 HEAD)"
          if printf '%s\n' "$changed" | grep -E '^digital-protocell/crates/chemistry-core/'; then exit 1; fi
          if printf '%s\n' "$changed" | grep -Ei 'dcdev019|dc-dev-019|dcdev021|dc-dev-021'; then exit 1; fi

      - name: Scoped formatting
        working-directory: digital-protocell
        run: rustup run 1.89.0 rustfmt --edition 2021 --check examples/dcdev020r2_allosteric_requalification.rs

      - name: Run DC-DEV-020-R2 observer assay
        working-directory: digital-protocell
        run: cargo +1.89.0 run -p regulatory-core --example dcdev020r2_allosteric_requalification --quiet

      - name: Regulatory-core regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p regulatory-core

      - name: Phase-1 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p phase1-certifier --release --test metrics_semantics

      - name: D-088 focused regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p chemistry-core --test d088_tests -- --nocapture

      - name: Evolution-harness preservation regression
        working-directory: digital-protocell
        run: cargo +1.89.0 test -p evolution-harness

      - name: Record exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          echo "checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"
