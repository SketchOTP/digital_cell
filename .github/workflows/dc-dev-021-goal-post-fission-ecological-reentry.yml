name: DC-DEV-021 goal post-fission ecological re-entry

on:
  push:
    branches:
      - m2/dc-dev-021-goal-post-fission-ecological-reentry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-fission-ecology:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact result head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install sanctioned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Verify exact authority and bounded diff
        run: |
          set -euo pipefail
          start=13526747c44f9e1d07e5fbf49a3371dd62bb88b2
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse "$start")" = "$start"
          git merge-base --is-ancestor "$start" HEAD
          git diff --check
          python3 - "$start" <<'PY'
          import subprocess
          import sys

          start = sys.argv[1]
          allowed = {
              '.agent/CURRENT.md',
              '.agent/DIRECTIVES.md',
              '.agent/LEARNINGS.md',
              '.agent/OUTCOMES.md',
              '.agent/RECORD.md',
              '.github/workflows/dc-dev-021-goal-post-fission-ecological-reentry.yml',
              'digital-protocell/crates/m2-lifeform-runtime/src/main.rs',
              'docs/goal-post-fission-ecological-reentry-r6.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{start}..HEAD'], text=True
          ).splitlines())
          prefix = 'digital-protocell/experiments/generated/dcdev021goalpostfissionecologicalreentryr6/'
          unexpected = {path for path in changed if path not in allowed and not path.startswith(prefix)}
          assert not unexpected, sorted(unexpected)
          forbidden_prefixes = (
              'digital-protocell/crates/chemistry-core/src/',
              'digital-protocell/crates/regulatory-core/src/',
              'digital-protocell/crates/phase1-certifier/src/',
              'digital-protocell/crates/evolution-harness/src/',
          )
          assert not any(path.startswith(forbidden_prefixes) for path in changed)
          PY

      - name: Build and test runtime
        working-directory: digital-protocell
        run: cargo +1.89.0 test --locked -p m2-lifeform-runtime

      - name: Run exact post-fission active and disabled controls
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --post-fission-ecology --steps 12000 --seed 2 \
            --report "$RUNNER_TEMP/active.json"
          cargo +1.89.0 run --locked -q --release -p m2-lifeform-runtime -- \
            --post-fission-ecology --transfer-disabled --steps 12000 --seed 2 \
            --report "$RUNNER_TEMP/disabled.json"

      - name: Validate bounded provisional negative and evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('experiments/generated/dcdev021goalpostfissionecologicalreentryr6')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          for item in manifest['evidence_files']:
              assert (root / item).is_file(), item
          for path in root.glob('*.json'):
              json.loads(path.read_text())

          temp = Path(os.environ['RUNNER_TEMP'])
          active = json.loads((temp / 'active.json').read_text())
          disabled = json.loads((temp / 'disabled.json').read_text())
          for report in (active, disabled):
              assert report['step'] == 12000
              assert report['pre_ecology_fission_events'] == 1
              assert report['ecology_started_after_unforced_fission'] is True
              assert report['fission_events'] == 0
              assert report['first_fission_step'] is None
              assert abs(report['world_n_conservation_error']) <= 1e-12
              assert abs(report['world_f_conservation_error']) <= 1e-12
              assert report['resource_causal_reproduction'] == 'NOT_ESTABLISHED'
              assert report['autonomous_resource_acquisition'] == 'NOT_ESTABLISHED'
          assert active['resource_transfer_enabled'] is True
          assert disabled['resource_transfer_enabled'] is False
          assert active['first_transfer_step'] == 1
          assert disabled['first_transfer_step'] is None
          assert active['cumulative_n_delivered'] > 0.0
          assert active['cumulative_f_delivered'] > 0.0
          assert active['cumulative_assimilation_n_processed'] > 0.0
          assert active['cumulative_assimilation_m_incorporated'] > 0.0
          assert disabled['cumulative_n_delivered'] == 0.0
          assert disabled['cumulative_f_delivered'] == 0.0
          assert disabled['cumulative_assimilation_n_processed'] == 0.0
          assert disabled['cumulative_assimilation_m_incorporated'] == 0.0
          assert active['living_count'] == 2
          assert disabled['living_count'] == 0
          print('post-fission ecological re-entry provisional negative validation passed')
          PY

      - name: Hash and upload compact evidence
        working-directory: digital-protocell
        run: |
          set -euo pipefail
          find experiments/generated/dcdev021goalpostfissionecologicalreentryr6 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/dcdev021-goal-post-fission-ecological-reentry.sha256"

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: dcdev021-goal-post-fission-ecological-reentry-${{ github.sha }}
          path: |
            digital-protocell/experiments/generated/dcdev021goalpostfissionecologicalreentryr6/
            ${{ runner.temp }}/dcdev021-goal-post-fission-ecological-reentry.sha256
