[workspace]
resolver = "2"
members = [
    "crates/chemistry-core",
    "crates/experiment-runner",
    "crates/godot-bridge",
    "crates/phase1-certifier",
    "crates/evolution-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Digital Cell Project"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }
